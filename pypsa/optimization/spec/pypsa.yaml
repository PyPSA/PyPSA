      count(Line_capital_cost_curve AND count(Line_capital_cost_curve_bends_down, over=breakpoint) > 0, over=line) == 0
  Process_capital_cost_curve:
    description: >-
      a process whose build pays along a piecewise `capital_cost` curve: an
      extendable one of PyPSA's `active_assets` with curve data
      (`optimize.py:404-421`, `piecewise.py:230-257`)
    condition: count(Process_capital_cost_curve_nom, over=breakpoint) > 0 AND Process_p_nom_extendable AND Process_active_asset
  Process_capital_cost_curve_bends_down:
    description: >-
      a breakpoint where a process's build cost curve gets less steep: the
      segment after it rises less per unit of nominal internal power than the
      one before
    condition: >-
      Process_capital_cost_curve_nom
      AND shift(Process_capital_cost_curve_nom, along=breakpoint, offset=1)
      AND shift(Process_capital_cost_curve_nom, along=breakpoint, offset=-1)
      AND (Process_capital_cost_curve_cost - shift(Process_capital_cost_curve_cost, along=breakpoint, offset=1, edge=0))
      * (shift(Process_capital_cost_curve_nom, along=breakpoint, offset=-1, edge=0) - Process_capital_cost_curve_nom)
      > (shift(Process_capital_cost_curve_cost, along=breakpoint, offset=-1, edge=0) - Process_capital_cost_curve_cost)
      * (Process_capital_cost_curve_nom - shift(Process_capital_cost_curve_nom, along=breakpoint, offset=1, edge=0))
  Process_capital_cost_as_lp:
    description: >-
      linopy's choice of method for all process build cost curves at once
      (`method="auto"`): the segment lines where every curve is convex, the
      incremental rows otherwise. PyPSA calls linopy once per component, so
      this choice is apart from every other component's. A build has no
      status, so no gate (`optimize.py:412-421`)
    condition: >-
      count(Process_capital_cost_curve AND count(Process_capital_cost_curve_bends_down, over=breakpoint) > 0, over=process) == 0
  Transformer_capital_cost_curve:
    description: >-
      a transformer whose build pays along a piecewise `capital_cost` curve: an
      extendable one of PyPSA's `active_assets` with curve data
      (`optimize.py:404-421`, `piecewise.py:230-257`)
    condition: count(Transformer_capital_cost_curve_nom, over=breakpoint) > 0 AND Transformer_s_nom_extendable AND Transformer_active_asset
  Transformer_capital_cost_curve_bends_down:
    description: >-
      a breakpoint where a transformer's build cost curve gets less steep: the
      segment after it rises less per unit of nominal apparent power than the
      one before
    condition: >-
      Transformer_capital_cost_curve_nom
      AND shift(Transformer_capital_cost_curve_nom, along=breakpoint, offset=1)
      AND shift(Transformer_capital_cost_curve_nom, along=breakpoint, offset=-1)
      AND (Transformer_capital_cost_curve_cost - shift(Transformer_capital_cost_curve_cost, along=breakpoint, offset=1, edge=0))
      * (shift(Transformer_capital_cost_curve_nom, along=breakpoint, offset=-1, edge=0) - Transformer_capital_cost_curve_nom)
      > (shift(Transformer_capital_cost_curve_cost, along=breakpoint, offset=-1, edge=0) - Transformer_capital_cost_curve_cost)
      * (Transformer_capital_cost_curve_nom - shift(Transformer_capital_cost_curve_nom, along=breakpoint, offset=1, edge=0))
  Transformer_capital_cost_as_lp:
    description: >-
      linopy's choice of method for all transformer build cost curves at once
      (`method="auto"`): the segment lines where every curve is convex, the
      incremental rows otherwise. PyPSA calls linopy once per component, so
      this choice is apart from every other component's. A build has no
      status, so no gate (`optimize.py:412-421`)
    condition: >-
      count(Transformer_capital_cost_curve AND count(Transformer_capital_cost_curve_bends_down, over=breakpoint) > 0, over=transformer) == 0
  Link_efficiency_curve:
    description: >-
      an output port whose `efficiency` follows a piecewise curve over the
      link's flow, in place of one value (`constraints.py:1530-1576`)
    condition: count(Link_efficiency_curve_p, over=breakpoint) > 0
  Process_rate_curve:
    description: >-
      a port whose `rate` follows a piecewise curve over the process's
      internal power, in place of one value (`constraints.py:1530-1576`)
    condition: count(Process_rate_curve_p, over=breakpoint) > 0
  Generator_efficiency_curve:
    description: >-
      a generator whose primary energy follows a piecewise `efficiency` curve
      over its output: one of PyPSA's `active_assets` with curve data, in a
      network with a `primary_energy` row (`global_constraints.py:336-365`)
    condition: >-
      count(Generator_efficiency_curve_p, over=breakpoint) > 0 AND Generator_active_asset
      AND count(GlobalConstraint_type == 'primary_energy', over=global_constraint) > 0
  Generator_com_ext:
    description: >-
      a committable generator with an extendable, non-modular build that
      is active in the snapshot's period. These are PyPSA's `com-ext` rows, whose
      status is relaxed against the chosen build
    condition: >-
      Generator_committable
      AND Generator_p_nom_extendable
      AND NOT (Generator_p_nom_mod > 0)
      AND Generator_active
  Generator_maint_ext:
    description: >-
      a maintainable generator with an extendable build that is active in the
      snapshot's period, unless it is committable and modular. These are the
      maintenance rows against the chosen build
    condition: >-
      Generator_maintainable
      AND Generator_p_nom_extendable
      AND NOT (Generator_committable AND Generator_p_nom_mod > 0)
      AND Generator_active
  Generator_committed:
    description: >-
      a committable generator that is active in the snapshot's period: every
      unit-commitment row's set
    condition: Generator_committable AND Generator_active
  Generator_ramps_from_previous:
    description: >-
      a snapshot whose ramp uses a previous output. It is any snapshot but its
      period's first, and the horizon's first where the generator comes in off
      or carries an initial output
    condition: >-
      position(snapshot, within=snapshot_period[period]) > 0 OR (position(snapshot) == 0 AND
      (Generator_status_initial == 0 OR Generator_p_init))
  Link_com_ext:
    description: >-
      a committable link with an extendable, non-modular build that is active in
      the snapshot's period. These are PyPSA's `com-ext` rows, whose status is
      relaxed against the chosen build
    condition: >-
      Link_committable
      AND Link_p_nom_extendable
      AND NOT (Link_p_nom_mod > 0)
      AND Link_active
  Link_maint_ext:
    description: >-
      a maintainable link with an extendable build that is active in the
