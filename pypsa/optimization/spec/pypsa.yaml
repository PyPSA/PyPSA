description: >-
  The file states a plain `n.optimize()`, its multi-period class under the
  `multi_investment_periods` keyword, and its stochastic class, which
  `n.set_scenarios(...)` sets. Every quantity chosen once the future is known
  (second-stage) spans the futures dispatch is chosen in (`scenario`).
  Capacity is chosen once, before the future is known, and paid at its
  expected cost in each investment `period` its build year and lifetime span.
  Operation is the expectation over the scenarios' weights, with a share
  priced at the worst-outcome mean cost (CVaR) only where a risk preference is
  set. A plain run's data has one scenario, one period, unit weights, no
  outage and every `active` flag true, so the problem is the standard one. On
  a security-constrained run, PyPSA copies each branch flow limit once per
  `outage`, and the outage factors, `active` flags and scenario weights come
  from data prep.

dimensions:
  scenario:
    description: the futures dispatch is chosen in, each with a weight
  snapshot:
    description: dispatch periods
    dtype: str
    ordered: true
  bus:
    description: network nodes
  generator:
    description: generating units, each on one bus
  link:
    description: controllable connections, each from one bus to the buses it delivers to
  link_output:
    description: >-
      a link's output ports, one label per port a link declares. The labels
      are PyPSA's `bus1`, `bus2`, … columns read long, data prep. A link of
      any number of output ports is then one term in the balance
  process:
    description: generalised multi-port converters, each with an internal power that every port draws or delivers at its own rate
  process_output:
    description: >-
      a process's ports, one label per port a process declares. The labels are
      PyPSA's `bus0`, `bus1`, …, each with a signed `rate`, data prep. A
      process of any number of ports is then one term in the balance
  load:
    description: demands, each on one bus
  storage_unit:
    description: storage units, dispatch and store behind one bus connection
  store:
    description: pure energy stores, each on one bus
  line:
    description: passive branches, each between two buses, their flow set by impedance
  transformer:
    description: passive branches between two buses, their flow set by impedance and tap ratio, with a phase shift fixed or optimised
  cycle:
    description: >-
      independent cycles of the passive network graph, the cycle basis, data
      prep. Each period has its own basis, of the branches that are active in it. A
      label is a position in that period's basis, so one label is a different
      cycle in another period
  outage:
    description: >-
      the passive branches a security-constrained run takes out one at a time
      (PyPSA's `branch_outages`), each a line or a transformer. A plain run
      has none
  segment:
    description: >-
      the cuts a passive branch's loss curve is held above. They are PyPSA's
      tangents, as many as its `segments` count, or its secants, as many as
      its tolerance loop places. A lossless run has none
    dtype: int
  global_constraint:
    description: PyPSA's `GlobalConstraint` rows, one label per declared limit
  period:
    description: investment periods. It is PyPSA's `investment_periods`
    dtype: int
    ordered: true
  flow_based_domain:
    description: >-
      the flow-based domains, each with its own zero-sum balance of net
      positions (PyPSA's `domain` of a `flow_based` row), data prep. A run whose
      flow-based rows name no domain has one. A run without them has none
  carrier:
    description: energy carriers, what a growth limit is set per
  breakpoint:
    description: >-
      the corners of a piecewise-linear curve, in order. A curve runs over the
      breakpoints its data has rows for, so curves may differ in length
    dtype: int
    ordered: true

parameters:
  Bus_attached:
    description: >-
      whether a load, a unit, a port or a branch that is active in the
      snapshot's period is attached to the bus, data prep. A bus nothing is
      attached to has no balance row
    dims: [bus, snapshot]
    dtype: bool
  snapshot_weightings_objective:
    description: PyPSA's `snapshot_weightings.objective` — hours a snapshot weighs in the cost
    dims: [snapshot]
  Generator_p_nom:
    description: nominal power
    dims: [scenario, generator]
  Generator_p_nom_extendable:
    description: whether the nominal power is a decision
    dims: [generator]
    dtype: bool
  Generator_p_min_pu:
    description: least output, per unit of nominal power
    dims: [scenario, snapshot, generator]
  Generator_p_max_pu:
    description: "most output, per unit of nominal power: an availability profile"
    dims: [scenario, snapshot, generator]
  Generator_marginal_cost:
    description: cost of one unit of output
    dims: [scenario, snapshot, generator]
  Generator_marginal_cost_curve_p:
    description: >-
      the output at each breakpoint of a generator's piecewise `marginal_cost`
      curve: PyPSA's `p_pu` breakpoints times `p_nom`, data prep. A generator
      with no curve has no rows
    dims: [generator, breakpoint]
    missing: absent
  Generator_marginal_cost_curve_cost:
    description: >-
      the running cost at each breakpoint of a generator's piecewise
      `marginal_cost` curve: zero at the first, then each segment's width in
      output times the `marginal_cost` at its upper breakpoint, summed, data
      prep. It is linopy's `Slopes(...).to_breakpoints` (`piecewise.py:310-312`)
    dims: [generator, breakpoint]
    missing: absent
  Generator_efficiency_curve_p:
    description: >-
      the output at each breakpoint of a generator's piecewise `efficiency`
      curve: PyPSA's `p_pu` breakpoints times `p_nom`, data prep. A generator
      with no curve has no rows
    dims: [generator, breakpoint]
    missing: absent
  Generator_efficiency_curve_primary:
    description: >-
      the primary energy a generator draws at each breakpoint of its piecewise
      `efficiency` curve: the output over the `efficiency` there, and zero
      where that quotient is undefined, as at no output with no efficiency,
      data prep (`piecewise.py:279-280`, `piecewise.py:314-316`)
    dims: [generator, breakpoint]
    missing: absent
  Generator_marginal_cost_quadratic:
    description: cost of the square of one unit of output
    dims: [scenario, snapshot, generator]
  Generator_sign:
    description: >-
      the sign output enters its bus's balance with. It is PyPSA's `sign`, `1`
      unless given, `-1` for a unit that draws power. PyPSA refuses one that
      differs by scenario (`constants.py:46`)
    dims: [generator]
  Generator_committable:
    description: whether output is gated by an on/off status decision
    dims: [generator]
    dtype: bool
  Generator_ramp_limit_up:
    description: most a generator may raise its output between snapshots, per unit of nominal power. No value means no limit. The value at the later of the two snapshots applies, so the limit may change over time
    dims: [scenario, snapshot, generator]
    missing: absent
  Generator_ramp_limit_down:
    description: most a generator may lower its output between snapshots, per unit of nominal power. No value means no limit. The value at the later of the two snapshots applies, so the limit may change over time
    dims: [scenario, snapshot, generator]
    missing: absent
  Generator_ramp_limit_start_up:
    description: most output in the snapshot a unit starts, per unit of nominal power. No value means no limit
    dims: [scenario, generator]
    missing: absent
  Generator_ramp_limit_shut_down:
    description: most output in the snapshot before a unit stops, per unit of nominal power. No value means no limit
    dims: [scenario, generator]
    missing: absent
  Generator_min_up_time:
    description: least snapshots a unit stays on once started
    dims: [scenario, generator]
    dtype: int
  Generator_min_down_time:
    description: least snapshots a unit stays off once stopped
    dims: [scenario, generator]
    dtype: int
  Generator_status_initial:
    description: >-
      one where the unit was on before the first snapshot, zero where off.
      It is PyPSA's `up_time_before > 0` for a committable unit, and one for
      a unit that is not, whose ramp rows PyPSA starts from on
      (`constraints.py:323`), data prep
    dims: [scenario, generator]
  Generator_p_init:
    description: >-
      the output a unit brought into the horizon (PyPSA's `p_init`), read only
      where the unit came in running. No value means it is unknown, and the
      unit then has no ramp row at the first snapshot
    dims: [scenario, generator]
    missing: 0
  Generator_up_time_brought_in:
    description: >-
      one while the up time a unit brought into the horizon is still
      running, zero after. It is PyPSA's start `up_time_before` snapshots
      before the first, counted while `min_up_time` has not passed since
      (`constraints.py:302-323`, `:677-678`), data prep
    dims: [scenario, snapshot, generator]
  Generator_down_time_brought_in:
    description: >-
      one while the down time a unit brought into the horizon is still
      running, zero after. It is PyPSA's stop `down_time_before` snapshots
      before the first, counted while `min_down_time` has not passed since
      (`constraints.py:302-323`, `:677-678`), data prep
    dims: [scenario, snapshot, generator]
  Generator_start_up_cost:
    description: cost of one start in this snapshot
    dims: [scenario, snapshot, generator]
  Generator_shut_down_cost:
    description: cost of one stop in this snapshot
    dims: [scenario, snapshot, generator]
  Generator_stand_by_cost:
    description: cost of one snapshot spent on
    dims: [scenario, snapshot, generator]
  Generator_p_nom_mod:
    description: the module size a build comes in whole numbers of. No value means the build is continuous
    dims: [generator]
    missing: absent
  Generator_modules_installed:
    description: >-
      how many whole modules a committable build has in place, data prep. It
      is `Generator_p_nom / Generator_p_nom_mod` where a fixed build is
      modular, and one where it is not. PyPSA refuses a fixed modular build
      whose nominal power is not a whole number of modules
    dims: [scenario, generator]
  Generator_big_m:
    description: >-
      the bound a committed extendable generator's big-M rows release it by,
      data prep. It is the build cap `p_nom_max` times the highest `p_max_pu`,
      where the cap is finite and positive. Elsewhere it is
      `committable_big_m` times the highest `p_max_pu`
      (`components.py:1082-1152`). Without that keyword, it is ten times the
      largest of the peak total load and the component's largest finite
      `p_nom` and `p_nom_max`. Where there is none of them, it is 1e6. Below
      the output a solve wants, it caps that output
    dims: [scenario, generator]
    missing: absent
  Generator_p_min_pu_nonneg:
    description: >-
      true where none of the generator's own minimums-per-unit is negative. It
      is PyPSA's per-unit `(p_min_pu >= 0).all()` over every snapshot and
      scenario, data prep
    dims: [generator]
    dtype: bool
  Generator_maintainable:
    description: >-
      whether a generator must be taken off for maintenance within the
      horizon: in any scenario, as PyPSA takes the union over them
      (`components.py:1000-1003`)
    dims: [generator]
    dtype: bool
  Generator_maintenance_pu:
    description: the share of the build a maintenance event takes off
    dims: [scenario, generator]
  Generator_maintenance_events:
    description: how many maintenance events occur within the horizon
    dims: [scenario, generator]
    dtype: int
  Generator_maintenance_duration:
    description: >-
      the hours of generator weightings one maintenance event covers, PyPSA's
      `maintenance_duration`. It has no value where the generator is not
      maintainable. No row contains it. In data prep you turn it into
      `Generator_maintenance_cover` and `Generator_maintenance_start_blocked`.
      The assumptions state that it fits the horizon
    dims: [scenario, generator]
    missing: absent
  Generator_maintenance_start_blocked:
    description: >-
      true where no maintenance event may start, data prep. The snapshots it
      would cover there run past the end of the horizon or into one the
      generator is not active in. It is PyPSA's `active & ~valid`, from
      `maintenance_duration` and the generator weightings
    dims: [scenario, snapshot, generator]
    dtype: bool
  Link_ramp_limit_up:
    description: most a link may raise its flow between snapshots, per unit of nominal power. No value means no limit. The value at the later of the two snapshots applies, so the limit may change over time
    dims: [scenario, snapshot, link]
    missing: absent
  Link_ramp_limit_down:
    description: most a link may lower its flow between snapshots, per unit of nominal power. No value means no limit. The value at the later of the two snapshots applies, so the limit may change over time
    dims: [scenario, snapshot, link]
    missing: absent
  Link_p_nom:
    description: nominal power
    dims: [scenario, link]
  Link_p_nom_extendable:
    description: whether the nominal power is a decision
    dims: [link]
    dtype: bool
  Link_p_min_pu:
    description: "least flow, per unit of nominal power: negative for a link that carries both ways"
    dims: [scenario, snapshot, link]
  Link_p_max_pu:
    description: most flow, per unit of nominal power
    dims: [scenario, snapshot, link]
  Link_efficiency:
    description: >-
      share of the flow that arrives at an output port, PyPSA's `efficiency`,
      `efficiency2`, … read long: negative where that port consumes rather
      than delivers. Read at the snapshot the flow arrives, so a delayed port
      delivers at its arrival snapshot's efficiency (`constraints.py:1575`)
    dims: [scenario, snapshot, link_output]
  Link_efficiency_curve_p:
    description: >-
      the flow at each breakpoint of the piecewise `efficiency` curve of an
      output port: PyPSA's `p_pu` breakpoints of `efficiency`, `efficiency2`,
      … read long, times the link's `p_nom`, data prep. A port with no curve
      has no rows
    dims: [link_output, breakpoint]
    missing: absent
  Link_efficiency_curve_delivery:
    description: >-
      what an output port delivers at each breakpoint of its piecewise
      `efficiency` curve: the flow times the `efficiency` there, and zero where
      that product is undefined, data prep (`piecewise.py:314-316`). PyPSA
      refuses a curve of both signs (`io.py:2319-2324`)
    dims: [link_output, breakpoint]
    missing: absent
  Link_output_delay:
    description: >-
      snapshots a port's delivery lags its link's flow (PyPSA's `delay`,
      `delay2`, … read long). In data prep you divide it by the
      `snapshot_weightings.generators` value and round it up. It is zero for a
      port that delivers at once. A port has the same delay in every scenario,
      because PyPSA refuses a delay that differs by scenario
      (`constants.py:55`)
    dims: [link_output]
    dtype: int
  Link_output_cyclic_delay:
    description: >-
      whether a delayed port's flow wraps from the end of its investment
      period (PyPSA's `cyclic_delay`, `cyclic_delay2`, …). Where it does not,
      the flow still in transit at each period's first snapshots is lost. The
      flag is the same in every scenario, as the delay is
    dims: [link_output]
    dtype: bool
  Link_marginal_cost:
    description: cost of one unit of flow
    dims: [scenario, snapshot, link]
  Link_marginal_cost_quadratic:
    description: cost of the square of one unit of flow
    dims: [scenario, snapshot, link]
  Link_marginal_cost_curve_p:
    description: >-
      the flow at each breakpoint of a link's piecewise `marginal_cost` curve:
      PyPSA's `p_pu` breakpoints times `p_nom`, data prep. A link with no
      curve has no rows
    dims: [link, breakpoint]
    missing: absent
  Link_marginal_cost_curve_cost:
    description: >-
      the running cost at each breakpoint of a link's piecewise
      `marginal_cost` curve: zero at the first, then each segment's width in
      flow times the `marginal_cost` at its upper breakpoint, summed, data
      prep. It is linopy's `Slopes(...).to_breakpoints`
      (`piecewise.py:310-312`). A curve that starts below zero flow, where
      `p_min_pu` is negative, costs more than nothing at zero flow
    dims: [link, breakpoint]
    missing: absent
  Link_committable:
    description: whether flow is gated by an on/off status decision
    dims: [link]
    dtype: bool
  Link_ramp_limit_start_up:
    description: most flow in the snapshot a link starts, per unit of nominal power. No value means no limit
    dims: [scenario, link]
    missing: absent
  Link_ramp_limit_shut_down:
    description: most flow in the snapshot before a link stops, per unit of nominal power. No value means no limit
    dims: [scenario, link]
    missing: absent
  Link_min_up_time:
    description: least snapshots a link stays on once started
    dims: [scenario, link]
    dtype: int
  Link_min_down_time:
    description: least snapshots a link stays off once stopped
    dims: [scenario, link]
    dtype: int
  Link_status_initial:
    description: >-
      one where the link was on before the first snapshot, zero where off.
      It is PyPSA's `up_time_before > 0` for a committable link, and one for
      a link that is not, whose ramp rows PyPSA starts from on
      (`constraints.py:323`), data prep
    dims: [scenario, link]
  Link_p_init:
    description: >-
      the flow a link brought into the horizon (PyPSA's `p_init`), read only
      where the link came in running. No value means it is unknown, and the
      link then has no ramp row at the first snapshot
    dims: [scenario, link]
    missing: 0
  Link_up_time_brought_in:
    description: >-
      one while the up time a link brought into the horizon is still
      running, zero after. It is PyPSA's start `up_time_before` snapshots
      before the first, counted while `min_up_time` has not passed since
      (`constraints.py:302-323`, `:677-678`), data prep
    dims: [scenario, snapshot, link]
  Link_down_time_brought_in:
    description: >-
      one while the down time a link brought into the horizon is still
      running, zero after. It is PyPSA's stop `down_time_before` snapshots
      before the first, counted while `min_down_time` has not passed since
      (`constraints.py:302-323`, `:677-678`), data prep
    dims: [scenario, snapshot, link]
  Link_start_up_cost:
    description: cost of one start in this snapshot
    dims: [scenario, snapshot, link]
  Link_shut_down_cost:
    description: cost of one stop in this snapshot
    dims: [scenario, snapshot, link]
  Link_stand_by_cost:
    description: cost of one snapshot spent on
    dims: [scenario, snapshot, link]
  Link_p_nom_mod:
    description: the module size a build comes in whole numbers of. No value means the build is continuous
    dims: [link]
    missing: absent
  Link_modules_installed:
    description: >-
      how many whole modules a committable build has in place, data prep. It
      is `Link_p_nom / Link_p_nom_mod` where a fixed build is modular, and one
      where it is not. PyPSA refuses a fixed modular build whose nominal power
      is not a whole number of modules
    dims: [scenario, link]
  Link_big_m:
    description: >-
      the bound a committed extendable link's big-M rows release it by, data
      prep. It is the build cap `p_nom_max` times the highest `p_max_pu`,
      where the cap is finite and positive. Elsewhere it is
      `committable_big_m` times the highest `p_max_pu`
      (`components.py:1082-1152`). Without that keyword, it is ten times the
      largest of the peak total load and the component's largest finite
      `p_nom` and `p_nom_max`. Where there is none of them, it is 1e6. Below
      the flow a solve wants, it caps that flow
    dims: [scenario, link]
    missing: absent
  Link_p_min_pu_nonneg:
    description: >-
      true where none of the link's own minimums-per-unit is negative. It is
      PyPSA's per-unit `(p_min_pu >= 0).all()` over every snapshot and
      scenario, data prep
    dims: [link]
    dtype: bool
  Link_maintainable:
    description: >-
      whether a link must be taken off for maintenance within the horizon: in
      any scenario, as PyPSA takes the union over them
      (`components.py:1000-1003`)
    dims: [link]
    dtype: bool
  Link_maintenance_pu:
    description: the share of the build a maintenance event takes off
    dims: [scenario, link]
  Link_maintenance_events:
    description: how many maintenance events occur within the horizon
    dims: [scenario, link]
    dtype: int
  Link_maintenance_duration:
    description: >-
      the hours of generator weightings one maintenance event covers, PyPSA's
      `maintenance_duration`. It has no value where the link is not
      maintainable. No row contains it. In data prep you turn it into
      `Link_maintenance_cover` and `Link_maintenance_start_blocked`. The
      assumptions state that it fits the horizon
    dims: [scenario, link]
    missing: absent
  Link_maintenance_start_blocked:
    description: >-
      true where no maintenance event may start, data prep. The snapshots it
      would cover there run past the end of the horizon or into one the link
      is not active in. It is PyPSA's `active & ~valid`, from
      `maintenance_duration` and the generator weightings
    dims: [scenario, snapshot, link]
    dtype: bool
  Process_p_nom:
    description: nominal internal power
    dims: [scenario, process]
  Process_p_nom_extendable:
    description: whether the nominal internal power is a decision
    dims: [process]
    dtype: bool
  Process_p_min_pu:
    description: "least internal power, per unit of nominal power: negative for a process that runs both ways"
    dims: [scenario, snapshot, process]
  Process_p_max_pu:
    description: most internal power, per unit of nominal power
    dims: [scenario, snapshot, process]
  Process_rate:
    description: >-
      the energy a port draws or delivers per unit of internal power (PyPSA's
      `rate0`, `rate1`, … read long). It is negative where the port withdraws
      and positive where it injects. A link is a process whose `bus0` rate is
      minus one and whose output rates are its efficiencies. The rate at the
      snapshot the transfer arrives applies, so a delayed port transfers at
      its arrival snapshot's rate (`constraints.py:1575`)
    dims: [scenario, snapshot, process_output]
  Process_rate_curve_p:
    description: >-
      the internal power at each breakpoint of the piecewise `rate` curve of a
      port: PyPSA's `p_pu` breakpoints of `rate0`, `rate1`, … read long, times
      the process's `p_nom`, data prep. A port with no curve has no rows
    dims: [process_output, breakpoint]
    missing: absent
  Process_rate_curve_transfer:
    description: >-
      what a port transfers at each breakpoint of its piecewise
      `rate` curve: the internal power times the `rate` there, and zero where
      that product is undefined, data prep (`piecewise.py:314-316`). PyPSA
      refuses a curve of both signs (`io.py:2319-2324`)
    dims: [process_output, breakpoint]
    missing: absent
  Process_output_delay:
    description: >-
      snapshots a port's transfer lags its process's internal power (PyPSA's
      `delay0`, `delay1`, … read long). In data prep you divide it by the
      `snapshot_weightings.generators` value and round it up. It is zero for a
      port that transfers at once. A port has the same delay in every
      scenario, as a link's port has
    dims: [process_output]
    dtype: int
  Process_output_cyclic_delay:
    description: >-
      whether a delayed port's transfer wraps from the end of its investment
      period (PyPSA's `cyclic_delay0`, `cyclic_delay1`, …). Where it does not,
      the energy still in transit at each period's first snapshots is lost.
      The flag is the same in every scenario, as the delay is
    dims: [process_output]
    dtype: bool
  Process_marginal_cost:
    description: cost of one unit of internal power
    dims: [scenario, snapshot, process]
  Process_marginal_cost_quadratic:
    description: cost of the square of one unit of internal power
    dims: [scenario, snapshot, process]
  Process_marginal_cost_curve_p:
    description: >-
      the internal power at each breakpoint of a process's piecewise
      `marginal_cost` curve: PyPSA's `p_pu` breakpoints times `p_nom`, data
      prep. A process with no curve has no rows
    dims: [process, breakpoint]
    missing: absent
  Process_marginal_cost_curve_cost:
    description: >-
      the running cost at each breakpoint of a process's piecewise
      `marginal_cost` curve: zero at the first, then each segment's width in
      internal power times the `marginal_cost` at its upper breakpoint,
      summed, data prep. It is linopy's `Slopes(...).to_breakpoints`
      (`piecewise.py:310-312`)
    dims: [process, breakpoint]
    missing: absent
  Process_ramp_limit_up:
    description: most a process may raise its internal power between snapshots, per unit of nominal power. No value means no limit. The value at the later of the two snapshots applies, so the limit may change over time
    dims: [scenario, snapshot, process]
    missing: absent
  Process_ramp_limit_down:
    description: most a process may lower its internal power between snapshots, per unit of nominal power. No value means no limit. The value at the later of the two snapshots applies, so the limit may change over time
    dims: [scenario, snapshot, process]
    missing: absent
  Process_p_set:
    description: a given internal power schedule. A process without one has no row here
    dims: [scenario, snapshot, process]
    missing: absent
  Process_e_sum_min:
    description: least energy of its internal power over the horizon. It is minus infinity where no floor is meant
    dims: [scenario, process]
  Process_e_sum_max:
    description: most energy of its internal power over the horizon. It is infinity where no cap is meant
    dims: [scenario, process]
  Process_p_nom_min:
    description: least nominal power an extendable process may be built at
    dims: [scenario, process]
  Process_p_nom_max:
    description: most nominal power an extendable process may be built at
    dims: [scenario, process]
  Process_capital_cost:
    description: >-
      cost of one unit of nominal power for the modelled horizon (PyPSA's
      `periodized_cost`), data prep. It is `overnight_cost` as an annuity over
      `lifetime` at `discount_rate`, times `nyears`, where `overnight_cost` is
      given, and `capital_cost` where it is not. Both add `fom_cost`
      (`components.py:1157-1178`, `costs.py:102-203`)
    dims: [scenario, process]
  Process_capital_cost_curve_nom:
    description: >-
      the nominal internal power at each breakpoint of a process's piecewise
      `capital_cost` curve: PyPSA's `p_nom` breakpoints, data prep. A process
      with no curve has no rows
    dims: [process, breakpoint]
    missing: absent
  Process_capital_cost_curve_cost:
    description: >-
      the cost of the build at each breakpoint of a process's piecewise
      `capital_cost` curve: zero at the first, then each segment's width in
      nominal internal power times the `capital_cost` at its upper breakpoint,
      summed, data prep. It is linopy's `Slopes(...).to_breakpoints`
      (`piecewise.py:310-312`). The curve is already periodized, so data prep
      refuses `overnight_cost` beside it, as PyPSA does
      (`optimize.py:427-434`)
    dims: [process, breakpoint]
    missing: absent
  Process_p_nom_set:
    description: a given nominal power for an extendable process. One without a value has no row here
    dims: [process]
    missing: absent
  Process_committable:
    description: whether internal power is gated by an on/off status decision
    dims: [process]
    dtype: bool
  Process_ramp_limit_start_up:
    description: most internal power in the snapshot a process starts, per unit of nominal power. No value means no limit
    dims: [scenario, process]
    missing: absent
  Process_ramp_limit_shut_down:
    description: most internal power in the snapshot before a process stops, per unit of nominal power. No value means no limit
    dims: [scenario, process]
    missing: absent
  Process_min_up_time:
    description: least snapshots a process stays on once started
    dims: [scenario, process]
    dtype: int
  Process_min_down_time:
    description: least snapshots a process stays off once stopped
    dims: [scenario, process]
    dtype: int
  Process_status_initial:
    description: >-
      one where the process was on before the first snapshot, zero where off.
      It is PyPSA's `up_time_before > 0` for a committable process, and one for
      a process that is not, whose ramp rows PyPSA starts from on
      (`constraints.py:323`), data prep
    dims: [scenario, process]
  Process_p_init:
    description: >-
      the internal power a process brought into the horizon (PyPSA's
      `p_init`), read only where the process came in running. No value means
      it is unknown, and the process then has no ramp row at the first
      snapshot
    dims: [scenario, process]
    missing: 0
  Process_up_time_brought_in:
    description: >-
      one while the up time a process brought into the horizon is still
      running, zero after. It is PyPSA's start `up_time_before` snapshots
      before the first, counted while `min_up_time` has not passed since
      (`constraints.py:302-323`, `:677-678`), data prep
    dims: [scenario, snapshot, process]
  Process_down_time_brought_in:
    description: >-
      one while the down time a process brought into the horizon is still
      running, zero after. It is PyPSA's stop `down_time_before` snapshots
      before the first, counted while `min_down_time` has not passed since
      (`constraints.py:302-323`, `:677-678`), data prep
    dims: [scenario, snapshot, process]
  Process_start_up_cost:
    description: cost of one start in this snapshot
    dims: [scenario, snapshot, process]
  Process_shut_down_cost:
    description: cost of one stop in this snapshot
    dims: [scenario, snapshot, process]
  Process_stand_by_cost:
    description: cost of one snapshot spent on
    dims: [scenario, snapshot, process]
  Process_p_nom_mod:
    description: the module size a build comes in whole numbers of. No value means the build is continuous
    dims: [process]
    missing: absent
  Process_modules_installed:
    description: >-
      how many whole modules a committable build has in place, data prep. It
      is `Process_p_nom / Process_p_nom_mod` where a fixed build is modular,
      and one where it is not. PyPSA refuses a fixed modular build whose
      nominal power is not a whole number of modules
    dims: [scenario, process]
  Process_big_m:
    description: >-
      the bound a committed extendable process's big-M rows release it by,
      data prep. It is the build cap `p_nom_max` times the highest `p_max_pu`,
      where the cap is finite and positive. Elsewhere it is
      `committable_big_m` times the highest `p_max_pu`
      (`components.py:1082-1152`). Without that keyword, it is ten times the
      largest of the peak total load and the component's largest finite
      `p_nom` and `p_nom_max`. Where there is none of them, it is 1e6. Below
      the internal power a solve wants, it caps that internal power
    dims: [scenario, process]
    missing: absent
  Process_p_min_pu_nonneg:
    description: >-
      true where none of the process's own minimums-per-unit is negative. It
      is PyPSA's per-unit `(p_min_pu >= 0).all()` over every snapshot and
      scenario, data prep
    dims: [process]
    dtype: bool
  Process_maintainable:
    description: >-
      whether a process must be taken off for maintenance within the horizon:
      in any scenario, as PyPSA takes the union over them
      (`components.py:1000-1003`)
    dims: [process]
    dtype: bool
  Process_maintenance_pu:
    description: the share of the build a maintenance event takes off
    dims: [scenario, process]
  Process_maintenance_events:
    description: how many maintenance events occur within the horizon
    dims: [scenario, process]
    dtype: int
  Process_maintenance_duration:
    description: >-
      the hours of generator weightings one maintenance event covers, PyPSA's
      `maintenance_duration`. It has no value where the process is not
      maintainable. No row contains it. In data prep you turn it into
      `Process_maintenance_cover` and `Process_maintenance_start_blocked`. The
      assumptions state that it fits the horizon
    dims: [scenario, process]
    missing: absent
  Process_maintenance_start_blocked:
    description: >-
      true where no maintenance event may start, data prep. The snapshots it
      would cover there run past the end of the horizon or into one the
      process is not active in. It is PyPSA's `active & ~valid`, from
      `maintenance_duration` and the generator weightings
    dims: [scenario, snapshot, process]
    dtype: bool
  Load_p_set:
    description: demand
    dims: [scenario, snapshot, load]
  Load_sign:
    description: >-
      the sign a load's demand enters its bus's balance with. It is PyPSA's
      `sign`, `-1` unless given, `1` for a load that feeds its bus. PyPSA
      refuses one that differs by scenario (`constants.py:46`)
    dims: [load]
  Load_active:
    description: >-
      whether a load is active in the network, PyPSA's `active`. A load has no
      build year and no lifetime, so the flag is the same in every snapshot.
      PyPSA refuses one that differs by scenario (`constants.py:54`)
    dims: [load]
    dtype: bool
  scenario_weight:
    description: PyPSA's `scenario_weightings.weight` — the probability of a future
    dims: [scenario]
  CVaR_omega:
    description: PyPSA's `risk_preference['omega']` — the share of operating cost priced at the tail rather than in expectation. `CVaR_omega` has a value only where a risk preference is set. Without a risk preference, the file has no CVaR variables or rows. With `omega = 0`, PyPSA builds them, and the optimum is the risk-neutral one
    dims: []
    missing: 0
  CVaR_alpha:
    description: PyPSA's `risk_preference['alpha']` — the confidence level. The tail is the other `1 - alpha` of the probability. `CVaR_alpha` has a value exactly where `CVaR_omega` has one
    dims: []
    missing: absent
  period_weight_objective:
    description: >-
      PyPSA's `investment_period_weightings.objective` — what a period's cost
