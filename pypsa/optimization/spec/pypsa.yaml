      whether each investment period closes on itself instead of carrying its
      charge on to the next. It overrides `cyclic_state_of_charge` and
      `state_of_charge_initial_per_period`. PyPSA reads it only under
      `multi_investment_periods`. Otherwise you feed false in data prep
    dims: [scenario, storage_unit]
    dtype: bool
  StorageUnit_state_of_charge_initial_per_period:
    description: >-
      whether each investment period opens on the initial charge instead of
      carrying the previous period's. PyPSA reads it only under
      `multi_investment_periods`. Otherwise you feed false in data prep
    dims: [scenario, storage_unit]
    dtype: bool
  StorageUnit_opens_late:
    description: >-
      whether a snapshot is the first a storage unit is active in, where that is
      not the first of the horizon, data prep. It is PyPSA's `active.cumsum()
      == 1` over the snapshots it is active in, past the first snapshot. It is
      false in a run where every unit is active throughout
    dims: [snapshot, storage_unit]
    dtype: bool
  StorageUnit_inactive_snapshots:
    description: >-
      how many snapshots a storage unit is not active in. It is PyPSA's
      `(~active).sum()`, data prep. A cyclic unit reaches back this many
      snapshots further, so it closes on the last snapshot it is active in
    dims: [storage_unit]
    dtype: int
  StorageUnit_marginal_cost:
    description: cost of one unit of dispatch
    dims: [scenario, snapshot, storage_unit]
  StorageUnit_marginal_cost_quadratic:
    description: cost of the square of one unit of dispatch. Storing is not charged
    dims: [scenario, snapshot, storage_unit]
  StorageUnit_marginal_cost_curve_p:
    description: >-
      the dispatch at each breakpoint of a storage unit's piecewise
      `marginal_cost` curve: PyPSA's `p_dispatch_pu` breakpoints times
      `p_nom`, data prep. A storage unit with no curve has no rows
    dims: [storage_unit, breakpoint]
    missing: absent
  StorageUnit_marginal_cost_curve_cost:
    description: >-
      the running cost at each breakpoint of a storage unit's piecewise
      `marginal_cost` curve: zero at the first, then each segment's width in
      dispatch times the `marginal_cost` at its upper breakpoint, summed, data
      prep. It is linopy's `Slopes(...).to_breakpoints`
      (`piecewise.py:310-312`)
    dims: [storage_unit, breakpoint]
    missing: absent
  StorageUnit_marginal_cost_storage:
    description: cost of one unit of charge held over one snapshot
    dims: [scenario, snapshot, storage_unit]
  StorageUnit_spill_cost:
    description: cost of one unit of inflow passed on unused
    dims: [scenario, snapshot, storage_unit]
  StorageUnit_p_set:
    description: a given net dispatch schedule. A unit without one has no row here
    dims: [scenario, snapshot, storage_unit]
    missing: absent
  StorageUnit_p_dispatch_set:
    description: a given dispatch schedule. A unit without one has no row here
    dims: [scenario, snapshot, storage_unit]
    missing: absent
  StorageUnit_p_store_set:
    description: a given charging schedule. A unit without one has no row here
    dims: [scenario, snapshot, storage_unit]
    missing: absent
  StorageUnit_state_of_charge_set:
    description: a given charge schedule. A unit without one has no row here
    dims: [scenario, snapshot, storage_unit]
    missing: absent
  Store_e_nom:
    description: nominal energy capacity
    dims: [scenario, store]
  Store_e_nom_extendable:
    description: whether the nominal energy capacity is a decision
    dims: [store]
    dtype: bool
  Store_e_nom_mod:
    description: the module size a build comes in whole numbers of. No value means the build is continuous
    dims: [store]
    missing: absent
  Store_e_min_pu:
    description: "least energy held, per unit of nominal capacity: negative for a store that may go short"
    dims: [scenario, snapshot, store]
  Store_e_max_pu:
    description: most energy held, per unit of nominal capacity
    dims: [scenario, snapshot, store]
  Store_sign:
    description: >-
      the sign the power a store delivers enters its bus's balance with. It is
      PyPSA's `sign`, `1` unless given. PyPSA refuses one that differs by
      scenario (`constants.py:46`)
    dims: [store]
  Store_retention:
    description: share of energy kept over a snapshot. It is PyPSA's `(1 - standing_loss) ** elapsed hours`, data prep
    dims: [scenario, snapshot, store]
  Store_e_initial:
    description: energy held before the first snapshot
    dims: [scenario, store]
  Store_e_cyclic:
    description: whether the horizon closes on itself instead of opening on the initial energy
    dims: [scenario, store]
    dtype: bool
  Store_e_cyclic_per_period:
    description: >-
      whether each investment period closes on itself instead of carrying its
      energy on to the next. It overrides `e_cyclic` and
      `e_initial_per_period`. PyPSA reads it only under
      `multi_investment_periods`. Otherwise you feed false in data prep
    dims: [scenario, store]
    dtype: bool
  Store_e_initial_per_period:
    description: >-
      whether each investment period opens on the initial energy instead of
      carrying the previous period's. PyPSA reads it only under
      `multi_investment_periods`. Otherwise you feed false in data prep
    dims: [scenario, store]
    dtype: bool
  Store_opens_late:
    description: >-
      whether a snapshot is the first a store is active in, where that is not the
      first of the horizon, data prep. It is PyPSA's `active.cumsum() == 1`
      over the snapshots it is active in, past the first snapshot. It is false in
      a run where every store is active throughout
    dims: [snapshot, store]
    dtype: bool
  Store_inactive_snapshots:
    description: >-
      how many snapshots a store is not active in. It is PyPSA's
      `(~active).sum()`, data prep. A cyclic store reaches back this many
      snapshots further, so it closes on the last snapshot it is active in
    dims: [store]
    dtype: int
  Store_marginal_cost:
    description: cost of one unit of power delivered
    dims: [scenario, snapshot, store]
  Store_marginal_cost_quadratic:
    description: cost of the square of the net power delivered, so charging costs as much as delivering
    dims: [scenario, snapshot, store]
  Store_marginal_cost_curve_p:
    description: >-
      the power at each breakpoint of a store's piecewise `marginal_cost`
      curve: PyPSA's `p_pu` breakpoints times `e_nom`, not the power rating
      `e_nom / max_hours` that bounds `p`, data prep. A store with no curve
      has no rows
    dims: [store, breakpoint]
    missing: absent
  Store_marginal_cost_curve_cost:
    description: >-
      the running cost at each breakpoint of a store's piecewise
      `marginal_cost` curve: zero at the first, then each segment's width in
      power times the `marginal_cost` at its upper breakpoint, summed, data
      prep. It is linopy's `Slopes(...).to_breakpoints`
      (`piecewise.py:310-312`). A curve that starts below zero, in charging,
      costs more than nothing at zero power
    dims: [store, breakpoint]
    missing: absent
  Store_marginal_cost_storage:
    description: cost of one unit of energy held over one snapshot
    dims: [scenario, snapshot, store]
  Store_e_set:
    description: a given energy schedule. A store without one has no row here
    dims: [scenario, snapshot, store]
    missing: absent
  Store_p_set:
    description: a given schedule of power delivered. A store without one has no row here
    dims: [scenario, snapshot, store]
    missing: absent
  Store_max_hours:
    description: >-
      energy capacity, as hours of discharge at the power rating. The rating is
      `e_nom / max_hours`. No value means PyPSA's default of infinity, and the
      store's power is then unbounded
    dims: [scenario, store]
    missing: absent
  Store_p_min_pu:
    description: >-
      most charging, per unit of the power rating, negated. It is PyPSA's
      `p_min_pu`, `-1` unless given, read only where `max_hours` has a value
    dims: [scenario, snapshot, store]
  Store_p_max_pu:
    description: >-
      most discharge, per unit of the power rating. It is PyPSA's `p_max_pu`,
      `1` unless given, read only where `max_hours` has a value
    dims: [scenario, snapshot, store]
  Store_efficiency_store:
    description: share of the power drawn from the bus that becomes energy held
    dims: [scenario, snapshot, store]
  Store_efficiency_dispatch:
    description: share of the energy drawn down that reaches the bus
    dims: [scenario, snapshot, store]
  Store_inflow:
    description: energy arriving per hour, a river into a reservoir
    dims: [scenario, snapshot, store]
  Store_spill_cost:
    description: cost of one unit of inflow passed on unused
    dims: [scenario, snapshot, store]
  Store_marginal_cost_dispatch:
    description: cost of one unit of discharge, `p + p_store`
    dims: [scenario, snapshot, store]
  Store_marginal_cost_store:
    description: cost of one unit of charging, `p_store`
    dims: [scenario, snapshot, store]
  Store_split_dispatch:
    description: >-
      whether a store charges through `p_store` apart from its net dispatch
      `p`. It is PyPSA's `split_dispatch()`: true where an efficiency differs
      from one, a cost applies to one direction only, or `cycles_max` is
      finite, in any snapshot (`stores.py:88-116`), data prep. Where it is
      false, `p_store` is held at zero and the charging bound applies to `p`
    dims: [scenario, store]
    dtype: bool
  Store_e_sum_min:
    description: least energy of its net dispatch over the horizon. It is minus infinity where no floor is meant
    dims: [scenario, store]
  Store_e_sum_max:
    description: most energy of its net dispatch over the horizon. It is infinity where no cap is meant
    dims: [scenario, store]
  Store_cycles_max:
    description: >-
      most equivalent full cycles over the horizon: discharge divided by
      `e_nom`. No value means PyPSA's default of infinity, and no limit
    dims: [scenario, store]
    missing: absent
  Line_s_nom:
    description: nominal apparent power
    dims: [scenario, line]
  Line_s_nom_extendable:
    description: whether the nominal apparent power is a decision
    dims: [line]
    dtype: bool
  Line_s_nom_mod:
    description: the module size a build comes in whole numbers of. No value means the build is continuous
    dims: [line]
    missing: absent
  Line_s_max_pu:
    description: most flow either way, per unit of nominal apparent power
    dims: [scenario, snapshot, line]
  Line_s_nom_min:
    description: least nominal apparent power an extendable line may be built at
    dims: [scenario, line]
  Line_s_nom_max:
    description: most nominal apparent power an extendable line may be built at
    dims: [scenario, line]
  Line_capital_cost:
    description: >-
      cost of one unit of nominal apparent power for the modelled horizon
      (PyPSA's `periodized_cost`), data prep. It is `overnight_cost` as an
      annuity over `lifetime` at `discount_rate`, times `nyears`, where
      `overnight_cost` is given, and `capital_cost` where it is not. Both add
      `fom_cost` (`components.py:1157-1178`, `costs.py:102-203`)
    dims: [scenario, line]
  Line_capital_cost_curve_nom:
    description: >-
      the nominal apparent power at each breakpoint of a line's piecewise
      `capital_cost` curve: PyPSA's `s_nom` breakpoints, data prep. A line
      with no curve has no rows
    dims: [line, breakpoint]
    missing: absent
  Line_capital_cost_curve_cost:
    description: >-
      the cost of the build at each breakpoint of a line's piecewise
      `capital_cost` curve: zero at the first, then each segment's width in
      nominal apparent power times the `capital_cost` at its upper breakpoint,
      summed, data prep. It is linopy's `Slopes(...).to_breakpoints`
      (`piecewise.py:310-312`). The curve is already periodized, so data prep
      refuses `overnight_cost` beside it, as PyPSA does
      (`optimize.py:427-434`)
    dims: [line, breakpoint]
    missing: absent
  Line_s_nom_set:
    description: a given nominal apparent power for an extendable line. One without a value has no row here
    dims: [line]
    missing: absent
  Line_s_set:
    description: a given flow schedule. A line without one has no row here
    dims: [scenario, snapshot, line]
    missing: absent
  Line_v_ang_max:
    description: >-
      the most the voltage angle difference across a line may be either way,
      in degrees. It is PyPSA's `v_ang_max`. Infinite, and so no row, by
      default. A line whose carrier is not AC has no row either. The
      deprecated `v_ang_min` is ignored, as PyPSA ignores it with a
      `DeprecationWarning` (`constraints.py:1797-1804`)
    dims: [scenario, line]
    missing: absent
  Line_x_pu_eff:
    description: >-
      the line's effective series reactance. It is PyPSA's `x_pu_eff`, `x`
      over the square of its bus's nominal voltage, data prep
    dims: [scenario, line]
  Cycle_in_basis:
    description: >-
      whether a period's cycle basis reaches the cycle label, data prep. A
      label beyond the basis of the period has no Kirchhoff voltage law row
    dims: [period, cycle]
    dtype: bool
  Line_cycle_weight:
    description: >-
      the line's series impedance, signed by its orientation in the cycle: the
      cycle basis, data prep. A line in no cycle has no row. PyPSA builds the
      cycle basis from the first scenario (`networks.py:1430-1437`), and
      refuses a `v_nom`, `x_pu_eff` or `r_pu_eff` that differs by scenario
      (`constants.py:33-35`). So the weight is the same in every scenario
    dims: [period, line, cycle]
    missing: absent
  Line_BODF:
    description: >-
      the share of an outaged branch's flow a line takes on when that branch
      goes out (PyPSA's `BODF`), data prep. It comes from the PTDF of the
      sub-network the period's active branches form. A row exists only where
      the line and the outage are active in the period and share a
      sub-network. It is -1 at the outaged line itself. PyPSA takes the factors
      of the first scenario (`abstract.py:652`), and refuses impedances that
      differ by scenario (`constants.py:33-35`). So the factors are the same in
      every scenario
    dims: [period, line, outage]
    missing: absent
  transmission_losses:
    description: >-
      whether the network dissipates transmission losses (PyPSA's
      `transmission_losses` read as a flag). Its mode, tangents or secants,
      only decides how you fill the `segment` axis in data prep. The rows are
      the same. False with no segments is a lossless run. A
      security-constrained run over a network with passive branches builds no
      loss. PyPSA hands the keyword not to `create_model`
      (`abstract.py:645-650`) but to the solver (`:549`), so you feed false
      there in data prep
    dims: []
    dtype: bool
  Line_loss_max:
    description: the loss at a line's rating. It is PyPSA's `r_pu_eff * (s_max_pu * s_nom_max)**2`, data prep
    dims: [scenario, snapshot, line]
  Line_loss_slope:
    description: >-
      the slope of a cut to the loss curve, data prep. It is a tangent's `2 *
      r_pu_eff * p_k` at its segment's flow, or a secant's `r_pu_eff * (p_k +
      p_k+1)` between consecutive breakpoints
    dims: [scenario, snapshot, line, segment]
  Line_loss_offset:
    description: >-
      where that cut meets the loss axis: a tangent's `loss_k - slope_k *
      p_k`, a secant's `-r_pu_eff * p_k * p_k+1`, negative, data prep
    dims: [scenario, snapshot, line, segment]
  Transformer_s_nom:
    description: nominal apparent power
    dims: [scenario, transformer]
  Transformer_s_nom_extendable:
    description: whether the nominal apparent power is a decision
    dims: [transformer]
    dtype: bool
  Transformer_s_nom_mod:
    description: the module size a build comes in whole numbers of. No value means the build is continuous
    dims: [transformer]
    missing: absent
  Transformer_s_max_pu:
    description: most flow either way, per unit of nominal apparent power
    dims: [scenario, snapshot, transformer]
  Transformer_s_nom_min:
    description: least nominal apparent power an extendable transformer may be built at
    dims: [scenario, transformer]
  Transformer_s_nom_max:
    description: most nominal apparent power an extendable transformer may be built at
    dims: [scenario, transformer]
  Transformer_capital_cost:
    description: >-
      cost of one unit of nominal apparent power for the modelled horizon
      (PyPSA's `periodized_cost`), data prep. It is `overnight_cost` as an
      annuity over `lifetime` at `discount_rate`, times `nyears`, where
      `overnight_cost` is given, and `capital_cost` where it is not. Both add
      `fom_cost` (`components.py:1157-1178`, `costs.py:102-203`)
    dims: [scenario, transformer]
  Transformer_capital_cost_curve_nom:
    description: >-
      the nominal apparent power at each breakpoint of a transformer's
      piecewise `capital_cost` curve: PyPSA's `s_nom` breakpoints, data prep.
      A transformer with no curve has no rows
    dims: [transformer, breakpoint]
    missing: absent
  Transformer_capital_cost_curve_cost:
    description: >-
      the cost of the build at each breakpoint of a transformer's piecewise
      `capital_cost` curve: zero at the first, then each segment's width in
      nominal apparent power times the `capital_cost` at its upper breakpoint,
      summed, data prep. It is linopy's `Slopes(...).to_breakpoints`
      (`piecewise.py:310-312`). The curve is already periodized, so data prep
      refuses `overnight_cost` beside it, as PyPSA does
      (`optimize.py:427-434`)
    dims: [transformer, breakpoint]
    missing: absent
  Transformer_s_nom_set:
    description: a given nominal apparent power for an extendable transformer. One without a value has no row here
    dims: [transformer]
    missing: absent
  Transformer_s_set:
    description: a given flow schedule. A transformer without one has no row here
    dims: [scenario, snapshot, transformer]
    missing: absent
  Transformer_v_ang_max:
    description: >-
      the most the voltage angle difference across a transformer, its phase
      shift included, may be either way, in degrees. It is PyPSA's
      `v_ang_max`. Infinite, and so no row, by default. The deprecated
      `v_ang_min` is ignored, as a line's
    dims: [scenario, transformer]
    missing: absent
  Transformer_x_pu_eff:
    description: >-
      the transformer's effective series reactance. It is PyPSA's `x_pu_eff`,
      `x` over its `s_nom` times its tap ratio, data prep
    dims: [scenario, transformer]
  Transformer_cycle_weight:
    description: >-
      the transformer's effective series reactance, `x` times its tap ratio,
      signed by its orientation in the cycle. It is PyPSA's `x_pu_eff`, the
      cycle basis, data prep. A transformer in no cycle has no row. It is the
      same in every scenario, as a line's
    dims: [period, transformer, cycle]
    missing: absent
  Transformer_BODF:
    description: >-
      the share of an outaged branch's flow a transformer takes on when that
      branch goes out, as a line's. A row only where the transformer and the
      outage are active in the period and share a sub-network. It is the same
      in every scenario, as a line's
    dims: [period, transformer, outage]
    missing: absent
  Transformer_phase_shift_weight:
    description: >-
      a fixed transformer's phase shift in radians at each snapshot, signed by
      its orientation in the cycle, data prep. It is a constant added to the
      cycle sum. It is zero for a varying transformer, whose shift is a
      decision instead. The constant and the variable term thus never both
      count a shift. A transformer with no shift or in no cycle of its
      snapshot's period has no row
    dims: [scenario, snapshot, transformer, cycle]
    missing: absent
  Transformer_phase_shift_varying:
    description: >-
      whether a transformer's phase shift is a decision (PyPSA's
      `phase_shift_min < phase_shift_max`, read as a flag in data prep). False
      is a fixed shift, set by `phase_shift`. It may differ by scenario, as
      PyPSA reads it per scenario (`variables.py:446-456`)
    dims: [scenario, transformer]
    dtype: bool
  Transformer_phase_shift_min:
    description: >-
      the least a varying transformer's phase shift may take, in degrees. It
      is PyPSA's `phase_shift_min`. Where it is below `phase_shift_max` the
      shift is a decision, otherwise the transformer keeps its fixed
      `phase_shift`
    dims: [scenario, transformer]
  Transformer_phase_shift_max:
    description: >-
      the most a varying transformer's phase shift may take, in degrees. It is
      PyPSA's `phase_shift_max`. Equal to `phase_shift_min` for a fixed
      transformer
    dims: [scenario, transformer]
  Transformer_phase_shift_fixed:
    description: >-
      a fixed transformer's phase shift at each snapshot, in degrees. It is
      PyPSA's `phase_shift`, zero by default. A varying transformer's shift is
      a decision instead
    dims: [scenario, snapshot, transformer]
  Transformer_phase_shift_cycle_weight:
    description: >-
      the cycle sign for a varying transformer's phase shift, times π/180 so a
      shift in degrees enters the cycle sum in radians, data prep. It is zero
      for a fixed transformer or one in no cycle
    dims: [scenario, period, transformer, cycle]
  Transformer_loss_max:
    description: >-
      the loss at a transformer's rating (PyPSA's `r_pu_eff * (s_max_pu *
      s_nom_max)**2`), data prep. Its `r_pu_eff` is the resistance over the
      given `s_nom` times the tap ratio
    dims: [scenario, snapshot, transformer]
  Transformer_loss_slope:
    description: >-
      the slope of a cut to a transformer's loss curve, data prep. It is a
      tangent's `2 * r_pu_eff * p_k` or a secant's `r_pu_eff * (p_k + p_k+1)`,
      as a line's. It uses the transformer's own `r_pu_eff` and rating
    dims: [scenario, snapshot, transformer, segment]
  Transformer_loss_offset:
    description: >-
      where that cut meets the loss axis: a tangent's `loss_k - slope_k *
      p_k`, a secant's `-r_pu_eff * p_k * p_k+1`, negative, data prep
    dims: [scenario, snapshot, transformer, segment]
  GlobalConstraint_type:
    description: >-
      which formula the row takes: `primary_energy`, `operational_limit`,
      `transmission_volume_expansion_limit`,
      `transmission_expansion_cost_limit`, `tech_capacity_expansion_limit` or
      `flow_based`
    dims: [global_constraint]
    dtype: str
  GlobalConstraint_sense:
    description: >-
      the row's sense in each scenario: `<=`, `>=` or `==`. PyPSA reads a
      row's sense per scenario (`global_constraints.py:576`, `:779`, `:859-864`)
    dims: [scenario, global_constraint]
    dtype: str
  GlobalConstraint_constant:
    description: >-
      the constant the total is held against. What a variable cannot represent
      is folded in here in data prep. That is an initial charge, times its
      period's years for each counted period where the storage reopens per
      period, or a non-extendable build. PyPSA reads it per scenario
      (`global_constraints.py:577`, `:780`, `:859-864`)
    dims: [scenario, global_constraint]
  GlobalConstraint_counts_snapshot:
    description: >-
      whether a row counts a snapshot in a scenario (PyPSA's
      `investment_period`), data prep. It is every snapshot where the row
      states no period, and only that period's where it states one. A row that
      states a period the run does not model has no label here, as PyPSA skips
      it (`global_constraints.py:388`). PyPSA reads the column only under
      `multi_investment_periods`. It fails on a row that states a period
      without it (`global_constraints.py:380-385`)
    dims: [scenario, global_constraint, snapshot]
    dtype: bool
    missing: false
  GlobalConstraint_ram:
    description: >-
      the remaining available margin of a `flow_based` row, one critical
      network element (CNEC). It may differ by snapshot. No value drops the
      row in that snapshot (`flow_based.py:201`)
    dims: [scenario, snapshot, global_constraint]
    missing: absent
  GlobalConstraint_zonal_ptdf:
    description: >-
      the zonal power transfer distribution factor of a `flow_based` row for a
      zone bus: PyPSA's `ptdf_<bus>` column read long, data prep. It may differ
      by snapshot. No value is zero, as PyPSA fills it
    dims: [scenario, snapshot, global_constraint, bus]
    missing: 0
  GlobalConstraint_link_ptdf:
    description: >-
      the factor of a `flow_based` row for a corridor link, whose flow enters
      the row: PyPSA's `ptdf_<link>` column read long, data prep. No value is
      zero
    dims: [scenario, snapshot, global_constraint, link]
    missing: 0
  Bus_flow_based_zone:
    description: >-
      whether a bus is a zone of a flow-based domain: some `flow_based` row
      has its `ptdf_<bus>` column, data prep
    dims: [bus]
    dtype: bool
  Generator_primary_energy_weight:
    description: >-
      the constrained attribute per unit of energy at the bus: the carrier's
      `co2_emissions` over the generator's efficiency at the snapshot, data
      prep. A generator with a piecewise `efficiency` curve has the bare
      attribute, as the curve gives its primary energy. A generator of an
      unweighted carrier has no row
    dims: [scenario, global_constraint, snapshot, generator]
    missing: absent
  StorageUnit_primary_energy_weight:
    description: the constrained attribute per unit of charge depleted, data prep. An unweighted unit has no row
    dims: [scenario, global_constraint, storage_unit]
    missing: absent
  Store_primary_energy_weight:
    description: the constrained attribute per unit of energy depleted, data prep. An unweighted store has no row
    dims: [scenario, global_constraint, store]
    missing: absent
  Generator_operational_limit_weight:
    description: one where the generator is in the row's set, data prep. One outside it has no row
    dims: [scenario, global_constraint, generator]
    missing: absent
  StorageUnit_operational_limit_weight:
    description: one where the storage unit is in the row's set, data prep. One outside it has no row
    dims: [scenario, global_constraint, storage_unit]
    missing: absent
  Store_operational_limit_weight:
    description: one where the store is in the row's set, data prep. One outside it has no row
    dims: [scenario, global_constraint, store]
    missing: absent
  Line_volume_weight:
    description: >-
      the line's length in each scenario where its carrier is in the row's set
      (`global_constraints.py:882-883`), data prep. A line outside it, or one
      that is not active in the row's `investment_period`, has no row
    dims: [scenario, global_constraint, line]
    missing: absent
  Link_volume_weight:
    description: >-
      the link's length in each scenario where its carrier is in the row's set
      (`global_constraints.py:882-883`), data prep. A link outside it, or one
      that is not active in the row's `investment_period`, has no row
    dims: [scenario, global_constraint, link]
    missing: absent
  Line_expansion_cost_weight:
    description: >-
      the line's capital cost where its carrier is in the row's set, data
      prep. Where the row states no `investment_period` under
      `multi_investment_periods`, it is times the objective weights of the
      periods the line is active in. A line outside the set, or one that is not
      active in the row's period, has no row. The capital cost is PyPSA's
      `capital_cost` property, which is `Line_capital_cost` without `fom_cost`
      (`components.py:1182-1200`, `global_constraints.py:905-914`)
    dims: [scenario, global_constraint, line]
    missing: absent
  Link_expansion_cost_weight:
    description: >-
      the link's capital cost where its carrier is in the row's set, data
      prep. Where the row states no `investment_period` under
      `multi_investment_periods`, it is times the objective weights of the
      periods the link is active in. A link outside the set, or one that is not
      active in the row's period, has no row. The capital cost is PyPSA's
      `capital_cost` property, which is `Link_capital_cost` without `fom_cost`
      (`components.py:1182-1200`, `global_constraints.py:905-914`)
    dims: [scenario, global_constraint, link]
    missing: absent
  Generator_tech_capacity_weight:
    description: >-
      one where the generator is in the row's carrier-and-bus set, data prep.
      One outside it, or one that is not active in the row's
      `investment_period`, has no row
    dims: [global_constraint, generator]
    missing: absent
  Link_tech_capacity_weight:
    description: >-
      one where the link is in the row's carrier-and-bus set, data prep. One
      outside it, or one that is not active in the row's `investment_period`,
      has no row
    dims: [global_constraint, link]
    missing: absent
  Line_tech_capacity_weight:
    description: >-
      one where the line is in the row's carrier-and-bus set, data prep. One
      outside it, or one that is not active in the row's `investment_period`,
      has no row
    dims: [global_constraint, line]
    missing: absent
  StorageUnit_tech_capacity_weight:
    description: >-
      one where the storage unit is in the row's carrier-and-bus set, data
      prep. One outside it, or one that is not active in the row's
      `investment_period`, has no row
    dims: [global_constraint, storage_unit]
    missing: absent
  Store_tech_capacity_weight:
    description: >-
      one where the store is in the row's carrier-and-bus set, data prep. One
      outside it, or one that is not active in the row's `investment_period`,
      has no row
    dims: [global_constraint, store]
    missing: absent
  Process_tech_capacity_weight:
    description: >-
      one where the process is in the row's carrier-and-bus set, data prep.
      One outside it, or one that is not active in the row's
      `investment_period`, has no row
    dims: [global_constraint, process]
    missing: absent

relations:
  snapshot_period:
    description: the investment period a snapshot falls in
    key: snapshot
    values: period
  Bus_flow_based_domain:
    description: >-
      the flow-based domain a zone bus belongs to: the domain whose rows set
      the bus's `ptdf_<bus>` column, data prep. A bus that is no zone has no
      row
    key: bus
    values: flow_based_domain
    missing: absent
  Generator_carrier:
    description: the carrier a generator converts from
    key: generator
    values: carrier
  Generator_bus:
    description: the bus a generator sits on
    key: generator
    values: bus
  Link_carrier:
    description: the carrier a link converts from
    key: link
    values: carrier
  Link_bus0:
    description: the bus a link leaves
    key: link
    values: bus
  Link_output_link:
    description: the link an output port belongs to
    key: link_output
    values: link
  Link_output_bus:
    description: >-
      the bus an output port delivers to. It is PyPSA's `bus1`, `bus2`, …
      columns. A link of three output ports is three labels here rather than a
      third relation, so the file states any number of them
    key: link_output
    values: bus
  Process_carrier:
    description: the carrier a process converts from
    key: process
    values: carrier
  Process_output_process:
    description: the process a port belongs to
    key: process_output
    values: process
  Process_output_bus:
    description: >-
      the bus a port draws from or delivers to. It is PyPSA's `bus0`, `bus1`,
      … columns. A process of three ports is three labels here rather than a
      third relation, so the file states any number of them
    key: process_output
    values: bus
  Load_bus:
    description: the bus a load sits on
    key: load
    values: bus
  StorageUnit_carrier:
    description: the carrier a storage unit converts from
    key: storage_unit
    values: carrier
  StorageUnit_bus:
    description: the bus a storage unit sits on
    key: storage_unit
    values: bus
  Line_carrier:
    description: the carrier a line carries
    key: line
    values: carrier
  Line_bus0:
    description: the bus a line's flow is measured at
    key: line
    values: bus
  Line_bus1:
    description: the bus at a line's other end
    key: line
    values: bus
  Store_carrier:
    description: the carrier a store holds
    key: store
    values: carrier
  Store_bus:
    description: the bus a store sits on
    key: store
    values: bus
  Transformer_bus0:
    description: the bus a transformer's flow is measured at
    key: transformer
    values: bus
  Transformer_bus1:
    description: the bus at a transformer's other end
    key: transformer
    values: bus
  Outage_line:
    description: the line an outage takes out. An outage of a transformer has no row
    key: outage
    values: line
    missing: absent
  Outage_transformer:
    description: the transformer an outage takes out. An outage of a line has no row
    key: outage
    values: transformer
    missing: absent
  Generator_maintenance_cover:
    description: >-
      the snapshots a maintenance event covers, by the snapshot it starts in,
      data prep. In a scenario, they are the start and the snapshots after it,
      until their generator weightings reach that scenario's
      `maintenance_duration`. A generator that is not maintainable has no rows
    key: { scenario: scenario, generator: generator, start: snapshot, covered: snapshot }
    missing: absent
  Link_maintenance_cover:
    description: >-
      the snapshots a maintenance event covers, by the snapshot it starts in,
      data prep. In a scenario, they are the start and the snapshots after it,
      until their generator weightings reach that scenario's
      `maintenance_duration`. A link that is not maintainable has no rows
    key: { scenario: scenario, link: link, start: snapshot, covered: snapshot }
    missing: absent
  Process_maintenance_cover:
    description: >-
      the snapshots a maintenance event covers, by the snapshot it starts in,
      data prep. In a scenario, they are the start and the snapshots after it,
      until their generator weightings reach that scenario's
      `maintenance_duration`. A process that is not maintainable has no rows
    key: { scenario: scenario, process: process, start: snapshot, covered: snapshot }
    missing: absent

variables:
  Generator_p:
    description: "`Generator-p` — output of a generator in a snapshot"
    dims: [scenario, snapshot, generator]
    where: Generator_active
  Generator_marginal_cost_piecewise:
    description: >-
      `Generator-marginal_cost_piecewise` — the running cost of a generator
      that pays along a curve, held above the curve
    dims: [scenario, snapshot, generator]
    where: Generator_marginal_cost_curve AND Generator_active
  Generator_p_primary_piecewise:
    description: >-
      `Generator-p_primary_piecewise` — the primary energy a generator with a
      part-load `efficiency` curve draws for its output. PyPSA states it where
      the network has a `primary_energy` row
    dims: [scenario, snapshot, generator]
    where: Generator_efficiency_curve AND Generator_active
  Link_p:
    description: >-
      `Link-p` — PyPSA's `p0`, the flow measured at the `Link_bus0` end. A
      positive value withdraws there and injects at every bus the link's
      output ports deliver to
    dims: [scenario, snapshot, link]
    where: Link_active
  Link_marginal_cost_piecewise:
    description: >-
      `Link-marginal_cost_piecewise` — the running cost of a link that pays
      along a curve, held above the curve
    dims: [scenario, snapshot, link]
    where: Link_marginal_cost_curve AND Link_active
  Link_p_piecewise:
    description: >-
      `Link-p{port}_piecewise` — what a link delivers to an output port that
      follows a part-load `efficiency` curve, before the port's delay. PyPSA
      names one variable per port number
    dims: [scenario, snapshot, link_output]
    where: Link_efficiency_curve AND at(Link_active, by=Link_output_link[link])
  Process_p:
    description: >-
      `Process-p` — PyPSA's internal power `p`. A positive value drives every
      port at its own rate, withdrawing where the rate is negative and
      injecting where it is positive
    dims: [scenario, snapshot, process]
    where: Process_active
  Process_marginal_cost_piecewise:
    description: >-
      `Process-marginal_cost_piecewise` — the running cost of a process that
      pays along a curve, held above the curve
    dims: [scenario, snapshot, process]
    where: Process_marginal_cost_curve AND Process_active
  Process_p_piecewise:
    description: >-
      `Process-p{port}_piecewise` — what a process transfers at a port that
      follows a part-load `rate` curve, before the port's delay. PyPSA names
      one variable per port number
    dims: [scenario, snapshot, process_output]
    where: Process_rate_curve AND at(Process_active, by=Process_output_process[process])
  StorageUnit_p_dispatch:
    description: "`StorageUnit-p_dispatch` — power delivered to the bus"
    dims: [scenario, snapshot, storage_unit]
    where: StorageUnit_active
  StorageUnit_marginal_cost_piecewise:
    description: >-
      `StorageUnit-marginal_cost_piecewise` — the running cost of a storage
      unit that pays along a curve, held above the curve
    dims: [scenario, snapshot, storage_unit]
    where: StorageUnit_marginal_cost_curve AND StorageUnit_active
  StorageUnit_p_store:
    description: "`StorageUnit-p_store` — power drawn from the bus into charge"
    dims: [scenario, snapshot, storage_unit]
    where: StorageUnit_active
  StorageUnit_state_of_charge:
    description: "`StorageUnit-state_of_charge` — energy held at the end of a snapshot"
    dims: [scenario, snapshot, storage_unit]
    where: StorageUnit_active
  StorageUnit_spill:
    description: >-
      `StorageUnit-spill` — inflow passed on unused. It is zero where there is
      no inflow, so the balance keeps its row there. The bounds are PyPSA's,
      on the variable rather than as rows
    dims: [scenario, snapshot, storage_unit]
    where: "StorageUnit_inflow > 0 AND StorageUnit_active"
    missing: 0
    bounds:
      lower: 0
      upper: StorageUnit_inflow
  Store_e:
    description: "`Store-e` — energy held at the end of a snapshot"
    dims: [scenario, snapshot, store]
    where: Store_active
  Store_p:
    description: "`Store-p` — net power delivered to the bus. Charging is negative"
    dims: [scenario, snapshot, store]
    where: Store_active
  Store_marginal_cost_piecewise:
    description: >-
      `Store-marginal_cost_piecewise` — the running cost of a store that pays
      along a curve, held above the curve
    dims: [scenario, snapshot, store]
    where: Store_marginal_cost_curve AND Store_active
  Store_p_store:
    description: >-
      `Store-p_store` — power drawn from the bus to charge, so that `p +
      p_store` is the discharge. It is held at zero by its rows where the store
      does not split its dispatch
    dims: [scenario, snapshot, store]
    where: Store_active
  Store_spill:
    description: >-
      `Store-spill` — inflow passed on unused. It is zero where there is no
      inflow, so the balance keeps its row there. The bounds are PyPSA's, on
      the variable rather than as rows
    dims: [scenario, snapshot, store]
    where: "Store_inflow > 0 AND Store_active"
    missing: 0
    bounds:
      lower: 0
      upper: Store_inflow
  FlowBased_net_position:
    description: >-
      `FlowBased-net_position` — what a zone bus exports to the flow-based
      domain, unbounded. It leaves the zone's nodal balance
      (`flow_based.py:207-234`). A bus that is no zone has none
    dims: [scenario, snapshot, bus]
    where: Bus_flow_based_zone
    missing: 0
  Generator_n_mod:
    description: "`Generator-n_mod` — how many modules of an extendable modular build. A unit that is not active has none"
    dims: [generator]
    where: Generator_p_nom_extendable AND Generator_p_nom_mod > 0 AND Generator_active_asset
    domain: integer
    bounds:
      lower: 0
  Generator_status:
    description: >-
      `Generator-status` — how much of a committable unit is on. It is an
      integer the rows below cap at one, or at the module count where the
      build is modular
    dims: [scenario, snapshot, generator]
    where: Generator_committed
    domain: integer
    bounds:
      lower: 0
  Generator_start_up:
    description: "`Generator-start_up` — how much of a committable unit turns on this snapshot, capped as the status is"
    dims: [scenario, snapshot, generator]
    where: Generator_committed
    domain: integer
    bounds:
      lower: 0
  Generator_shut_down:
    description: "`Generator-shut_down` — how much of a committable unit turns off this snapshot, capped as the status is"
    dims: [scenario, snapshot, generator]
    where: Generator_committed
    domain: integer
    bounds:
      lower: 0
  Generator_maintenance:
    description: >-
      `Generator-maintenance` — whether a maintainable generator is in maintenance:
      continuous, and one exactly where an event covers the snapshot
    dims: [scenario, snapshot, generator]
    where: Generator_maintainable AND Generator_active
    missing: 0
    bounds:
      lower: 0
      upper: 1
  Generator_maintenance_start:
    description: "`Generator-maintenance_start` — whether a maintenance event starts in this snapshot"
    dims: [scenario, snapshot, generator]
    where: Generator_maintainable AND Generator_active
    missing: 0
    domain: binary
  Generator_maintenance_capacity:
    description: >-
      `Generator-maintenance_capacity` — the chosen build while in
      maintenance, zero otherwise: the product the `maintcap` rows linearise
    dims: [scenario, snapshot, generator]
    where: Generator_maint_ext
    missing: 0
    bounds:
      lower: 0
  Generator_maintenance_status:
    description: >-
      `Generator-maintenance_status` — the status while in maintenance, zero
      otherwise: the product the `maint-status` rows linearise, so a unit in
      maintenance may also be off
    dims: [scenario, snapshot, generator]
    where: >-
      Generator_maintainable
      AND Generator_committed
      AND NOT (Generator_p_nom_extendable AND NOT (Generator_p_nom_mod > 0))
    missing: 0
    bounds:
      lower: 0
  Link_n_mod:
    description: "`Link-n_mod` — how many modules of an extendable modular build. A unit that is not active has none"
    dims: [link]
    where: Link_p_nom_extendable AND Link_p_nom_mod > 0 AND Link_active_asset
    domain: integer
    bounds:
      lower: 0
  Link_status:
    description: >-
      `Link-status` — how much of a committable link is on. It is an integer
      the rows below cap at one, or at the module count where the build is
      modular
    dims: [scenario, snapshot, link]
    where: Link_committed
    domain: integer
    bounds:
      lower: 0
  Link_start_up:
    description: "`Link-start_up` — how much of a committable link turns on this snapshot, capped as the status is"
    dims: [scenario, snapshot, link]
    where: Link_committed
    domain: integer
    bounds:
      lower: 0
  Link_shut_down:
    description: "`Link-shut_down` — how much of a committable link turns off this snapshot, capped as the status is"
    dims: [scenario, snapshot, link]
    where: Link_committed
    domain: integer
    bounds:
      lower: 0
  Link_maintenance:
    description: >-
      `Link-maintenance` — whether a maintainable link is in maintenance:
      continuous, and one exactly where an event covers the snapshot
    dims: [scenario, snapshot, link]
    where: Link_maintainable AND Link_active
    missing: 0
    bounds:
      lower: 0
      upper: 1
  Link_maintenance_start:
    description: "`Link-maintenance_start` — whether a maintenance event starts in this snapshot"
    dims: [scenario, snapshot, link]
    where: Link_maintainable AND Link_active
    missing: 0
    domain: binary
  Link_maintenance_capacity:
    description: >-
      `Link-maintenance_capacity` — the chosen build while in maintenance,
      zero otherwise: the product the `maintcap` rows linearise
    dims: [scenario, snapshot, link]
    where: Link_maint_ext
    missing: 0
    bounds:
      lower: 0
  Link_maintenance_status:
    description: >-
      `Link-maintenance_status` — the status while in maintenance, zero
      otherwise: the product the `maint-status` rows linearise, so a unit in
      maintenance may also be off
    dims: [scenario, snapshot, link]
    where: Link_maintainable AND Link_committed AND NOT (Link_p_nom_extendable AND NOT (Link_p_nom_mod > 0))
    missing: 0
    bounds:
      lower: 0
  Process_n_mod:
    description: "`Process-n_mod` — how many modules of an extendable modular build. A unit that is not active has none"
    dims: [process]
    where: Process_p_nom_extendable AND Process_p_nom_mod > 0 AND Process_active_asset
    domain: integer
    bounds:
      lower: 0
  Process_status:
    description: >-
      `Process-status` — how much of a committable process is on. It is an
      integer the rows below cap at one, or at the module count where the
      build is modular
    dims: [scenario, snapshot, process]
    where: Process_committed
    domain: integer
    bounds:
      lower: 0
  Process_start_up:
    description: "`Process-start_up` — how much of a committable process turns on this snapshot, capped as the status is"
    dims: [scenario, snapshot, process]
    where: Process_committed
    domain: integer
    bounds:
      lower: 0
  Process_shut_down:
    description: "`Process-shut_down` — how much of a committable process turns off this snapshot, capped as the status is"
    dims: [scenario, snapshot, process]
    where: Process_committed
    domain: integer
    bounds:
      lower: 0
  Process_maintenance:
    description: >-
      `Process-maintenance` — whether a maintainable process is in maintenance:
      continuous, and one exactly where an event covers the snapshot
    dims: [scenario, snapshot, process]
    where: Process_maintainable AND Process_active
    missing: 0
    bounds:
      lower: 0
      upper: 1
  Process_maintenance_start:
    description: "`Process-maintenance_start` — whether a maintenance event starts in this snapshot"
    dims: [scenario, snapshot, process]
    where: Process_maintainable AND Process_active
    missing: 0
    domain: binary
  Process_maintenance_capacity:
    description: >-
      `Process-maintenance_capacity` — the chosen build while in maintenance,
      zero otherwise: the product the `maintcap` rows linearise
    dims: [scenario, snapshot, process]
    where: Process_maint_ext
    missing: 0
    bounds:
      lower: 0
  Process_maintenance_status:
    description: >-
      `Process-maintenance_status` — the status while in maintenance, zero
      otherwise: the product the `maint-status` rows linearise, so a unit in
      maintenance may also be off
    dims: [scenario, snapshot, process]
    where: >-
      Process_maintainable
      AND Process_committed
      AND NOT (Process_p_nom_extendable AND NOT (Process_p_nom_mod > 0))
    missing: 0
    bounds:
      lower: 0
  Line_s:
    description: >-
      `Line-s` — PyPSA's `p0`, the flow measured at the `Line_bus0` end: a
      positive value withdraws there and injects at `Line_bus1`, lossless
    dims: [scenario, snapshot, line]
    where: Line_active
  Line_loss:
    description: >-
      `Line-loss` — what a line dissipates carrying its flow, pushed down by
      the cost and held up by the cuts. Absent, and zero in the balance, where
      the network is lossless
    dims: [scenario, snapshot, line]
    where: Line_lossy
    missing: 0
    bounds:
      lower: 0
  Transformer_s:
    description: >-
      `Transformer-s` — PyPSA's `p0`, the flow measured at the
      `Transformer_bus0` end: a positive value withdraws there and injects at
      `Transformer_bus1`, lossless
    dims: [scenario, snapshot, transformer]
    where: Transformer_active
  Transformer_loss:
    description: >-
      `Transformer-loss` — what a transformer dissipates carrying its flow, as
      a line does. Absent, and zero in the balance, where the network is
      lossless
    dims: [scenario, snapshot, transformer]
    where: Transformer_lossy
    missing: 0
    bounds:
      lower: 0
  Transformer_phase_shift:
    description: >-
      `Transformer-phase_shift` — a phase-shifting transformer's voltage angle
      shift in degrees, chosen per snapshot to redistribute the flows around
      its cycles without moving active power. Absent, and zero in the cycle
      sum, where the shift is fixed
    dims: [scenario, snapshot, transformer]
    where: Transformer_phase_shift_varying AND Transformer_active
    missing: 0
    bounds:
      lower: Transformer_phase_shift_min
      upper: Transformer_phase_shift_max
  Line_s_nom_ext:
    description: >-
      `Line-s_nom` — nominal apparent power where it is a decision, for a line
      that is active. A fixed build is the parameter of the same PyPSA name
    dims: [line]
    where: Line_s_nom_extendable AND Line_active_asset
  Line_capital_cost_piecewise:
    description: >-
      `Line-capital_cost_piecewise` — the cost of the build of an extendable
      line that pays along a curve, held above the curve
    dims: [line]
    where: Line_capital_cost_curve
  Line_n_mod:
    description: "`Line-n_mod` — how many modules of an extendable modular build. A unit that is not active has none"
    dims: [line]
    where: Line_s_nom_extendable AND Line_s_nom_mod > 0 AND Line_active_asset
    domain: integer
    bounds:
      lower: 0
  Generator_p_nom_ext:
    description: >-
      `Generator-p_nom` — nominal power where it is a decision, for a
      generator that is active. A fixed build is the parameter of the same
      PyPSA name
    dims: [generator]
    where: Generator_p_nom_extendable AND Generator_active_asset
  Generator_capital_cost_piecewise:
    description: >-
      `Generator-capital_cost_piecewise` — the cost of the build of an
      extendable generator that pays along a curve, held above the curve
    dims: [generator]
    where: Generator_capital_cost_curve
  Link_p_nom_ext:
    description: >-
      `Link-p_nom` — nominal power where it is a decision, for a link that is
      active. A fixed build is the parameter of the same PyPSA name
    dims: [link]
    where: Link_p_nom_extendable AND Link_active_asset
  Link_capital_cost_piecewise:
    description: >-
      `Link-capital_cost_piecewise` — the cost of the build of an extendable
      link that pays along a curve, held above the curve
    dims: [link]
    where: Link_capital_cost_curve
  Process_p_nom_ext:
    description: >-
      `Process-p_nom` — nominal internal power where it is a decision, for a
      process that is active. A fixed build is the parameter of the same PyPSA
      name
    dims: [process]
    where: Process_p_nom_extendable AND Process_active_asset
  Process_capital_cost_piecewise:
    description: >-
      `Process-capital_cost_piecewise` — the cost of the build of an extendable
      process that pays along a curve, held above the curve
    dims: [process]
    where: Process_capital_cost_curve
  Transformer_s_nom_ext:
    description: >-
      `Transformer-s_nom` — nominal apparent power where it is a decision, for
      a transformer that is active. A fixed build is the parameter of the same
      PyPSA name
    dims: [transformer]
    where: Transformer_s_nom_extendable AND Transformer_active_asset
  Transformer_capital_cost_piecewise:
    description: >-
      `Transformer-capital_cost_piecewise` — the cost of the build of an
      extendable transformer that pays along a curve, held above the curve
    dims: [transformer]
    where: Transformer_capital_cost_curve
  Transformer_n_mod:
    description: "`Transformer-n_mod` — how many modules of an extendable modular build. A unit that is not active has none"
    dims: [transformer]
    where: Transformer_s_nom_extendable AND Transformer_s_nom_mod > 0 AND Transformer_active_asset
    domain: integer
    bounds:
      lower: 0
  StorageUnit_p_nom_ext:
    description: >-
