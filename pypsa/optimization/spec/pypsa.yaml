      storage unit that is active. A fixed build is the parameter of the same
      PyPSA name
    dims: [storage_unit]
    where: StorageUnit_p_nom_extendable AND StorageUnit_active_asset
  StorageUnit_capital_cost_piecewise:
    description: >-
      `StorageUnit-capital_cost_piecewise` — the cost of the build of an
      extendable storage unit that pays along a curve, held above the curve
    dims: [storage_unit]
    where: StorageUnit_capital_cost_curve
  StorageUnit_n_mod:
    description: "`StorageUnit-n_mod` — how many modules of an extendable modular build. A unit that is not active has none"
    dims: [storage_unit]
    where: StorageUnit_p_nom_extendable AND StorageUnit_p_nom_mod > 0 AND StorageUnit_active_asset
    domain: integer
    bounds:
      lower: 0
  Store_e_nom_ext:
    description: >-
      `Store-e_nom` — nominal capacity where it is a decision, for a store
      that is active. A fixed build is the parameter of the same PyPSA name
    dims: [store]
    where: Store_e_nom_extendable AND Store_active_asset
  Store_capital_cost_piecewise:
    description: >-
