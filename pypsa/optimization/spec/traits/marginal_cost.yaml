given:
  parameters:
    CVaR_omega: {dims: []}
    COMPONENT_NOM: {dims: [scenario, DIM]}
    COMPONENT_NOM_extendable: {dims: [DIM], dtype: bool}
    COMPONENT_active: {dims: [snapshot, DIM], dtype: bool}
    COMPONENT_active_asset: {dims: [DIM], dtype: bool}
    COMPONENT_marginal_cost_curve_cost: {dims: [DIM, breakpoint]}
    COMPONENT_marginal_cost_curve_p: {dims: [DIM, breakpoint]}
    period_weight_objective: {dims: [period]}
    snapshot_weightings_objective: {dims: [snapshot]}
  variables:
    COMPONENT_POWER: {dims: [scenario, snapshot, DIM]}

dimensions:
  scenario: {}
  snapshot: {dtype: str, ordered: true}
  DIM: {}
  period: {dtype: int, ordered: true}
  breakpoint: {dtype: int, ordered: true}

relations:
  snapshot_period: {key: snapshot, values: period}

macros:
  COMPONENT_operating_cost:
    description: a cost per snapshot, weighted by the snapshot's hours and its period, summed
    args: [cost]
    template: >-
      sum(sum((cost * snapshot_weightings_objective) * at(period_weight_objective,
      by=snapshot_period[period]), over=DIM), over=snapshot)

parameters:
  COMPONENT_p_min_pu:
    description: least power, per unit of nominal power
    dims: [scenario, snapshot, DIM]
  COMPONENT_p_max_pu:
    description: most power, per unit of nominal power
    dims: [scenario, snapshot, DIM]
  COMPONENT_p_set:
    description: a given power schedule. No value means no row
    dims: [scenario, snapshot, DIM]
    missing: absent
  COMPONENT_marginal_cost:
    description: cost of one unit of energy dispatched
    dims: [scenario, snapshot, DIM]
  COMPONENT_marginal_cost_quadratic:
    description: cost of the square of one unit of energy dispatched
    dims: [scenario, snapshot, DIM]

variables:
  COMPONENT_marginal_cost_piecewise:
    name: COMPONENT-marginal_cost_piecewise
    description: the running cost of a unit with a `marginal_cost` curve
    dims: [scenario, snapshot, DIM]
    where: COMPONENT_marginal_cost_curve AND COMPONENT_active

expressions:
  COMPONENT_running_cost:
    description: the cost read off the `marginal_cost` curve where there is one, power times `marginal_cost` otherwise
    dims: [scenario, snapshot, DIM]
    cases:
      curve:
        when: COMPONENT_marginal_cost_curve
        expression: COMPONENT_marginal_cost_piecewise
    otherwise: COMPONENT_POWER * COMPONENT_marginal_cost
  COMPONENT_opex:
    expression: >-
      COMPONENT_operating_cost(COMPONENT_running_cost)
      + COMPONENT_operating_cost((COMPONENT_POWER * COMPONENT_POWER) * COMPONENT_marginal_cost_quadratic)

conditions:
  COMPONENT_marginal_cost_curve:
    description: an active asset with a piecewise `marginal_cost` curve
    condition: count(COMPONENT_marginal_cost_curve_p, over=breakpoint) > 0 AND COMPONENT_active_asset
  COMPONENT_marginal_cost_curve_bends_down:
    description: a breakpoint where the `marginal_cost` curve gets less steep
    condition: >-
      COMPONENT_marginal_cost_curve_p
      AND shift(COMPONENT_marginal_cost_curve_p, along=breakpoint, offset=1)
      AND shift(COMPONENT_marginal_cost_curve_p, along=breakpoint, offset=-1)
      AND (COMPONENT_marginal_cost_curve_cost - shift(COMPONENT_marginal_cost_curve_cost, along=breakpoint, offset=1, edge=0))
      * (shift(COMPONENT_marginal_cost_curve_p, along=breakpoint, offset=-1, edge=0) - COMPONENT_marginal_cost_curve_p)
      > (shift(COMPONENT_marginal_cost_curve_cost, along=breakpoint, offset=-1, edge=0) - COMPONENT_marginal_cost_curve_cost)
      * (COMPONENT_marginal_cost_curve_p - shift(COMPONENT_marginal_cost_curve_p, along=breakpoint, offset=1, edge=0))

assumptions:
  COMPONENT_marginal_cost_curve_on_a_fixed_build:
    holds: "NOT COMPONENT_NOM_extendable AND COMPONENT_NOM > 0 AND COMPONENT_NOM < inf"
    where: "COMPONENT_marginal_cost_curve"
    description: a `marginal_cost` curve needs a fixed, positive, finite nominal capacity
  COMPONENT_marginal_cost_quadratic_without_risk_preference:
    holds: COMPONENT_marginal_cost_quadratic == 0
    where: CVaR_omega
    description: "`marginal_cost_quadratic` is zero where a risk preference is set"
