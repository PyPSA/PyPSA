given:
  parameters:
    COMPONENT_NOM: {dims: [scenario, UNIT]}
    COMPONENT_NOM_extendable: {dims: [UNIT], dtype: bool}
    COMPONENT_NOM_mod: {dims: [UNIT]}
    COMPONENT_activity_mask: {dims: [snapshot, UNIT], dtype: bool}
    COMPONENT_maintenance_pu: {dims: [scenario, UNIT]}
    COMPONENT_p_max_pu: {dims: [scenario, snapshot, UNIT]}
    COMPONENT_p_min_pu: {dims: [scenario, snapshot, UNIT]}
    period_weighting_objective: {dims: [period]}
    snapshot_weighting_objective: {dims: [snapshot]}
  variables:
    COMPONENT_NOM_ext: {dims: [UNIT]}
    COMPONENT_maintenance_capacity: {dims: [scenario, snapshot, UNIT]}
    COMPONENT_maintenance_status: {dims: [scenario, snapshot, UNIT]}
    COMPONENT_marginal_cost_piecewise: {dims: [scenario, snapshot, UNIT]}
    COMPONENT_n_mod: {dims: [UNIT]}
    COMPONENT_p: {dims: [scenario, snapshot, UNIT]}
  conditions:
    COMPONENT_marginal_cost_curve: {dims: [UNIT]}
    COMPONENT_marginal_cost_convex: {dims: []}
    COMPONENT_modular: {dims: [UNIT]}

dimensions:
  scenario: {}
  snapshot: {dtype: str, ordered: true}
  UNIT: {}
  period: {dtype: int, ordered: true}
  breakpoint: {dtype: int, ordered: true}

parameters:
  COMPONENT_committable:
    description: whether an on/off status decision gates the power
    dims: [UNIT]
    dtype: bool
  COMPONENT_start_up_cost:
    description: cost of one start in this snapshot
    dims: [scenario, snapshot, UNIT]
  COMPONENT_shut_down_cost:
    description: cost of one stop in this snapshot
    dims: [scenario, snapshot, UNIT]
  COMPONENT_stand_by_cost:
    description: cost of one snapshot spent on
    dims: [scenario, snapshot, UNIT]
  COMPONENT_min_up_time:
    description: least snapshots a unit stays on once started
    dims: [scenario, UNIT]
    dtype: int
  COMPONENT_min_down_time:
    description: least snapshots a unit stays off once stopped
    dims: [scenario, UNIT]
    dtype: int
  COMPONENT_status_initial:
    description: >-
      one where the unit was on before the first snapshot, zero where off. A
      unit that is not committable counts as on
    dims: [scenario, UNIT]
  COMPONENT_status_solved:
    description: >-
      whether an earlier window solved the status before the first snapshot, as
      a count of modules, rather than it being rebuilt from the up and down times
    dims: []
    dtype: bool
  COMPONENT_up_time_brought_in:
    description: one while the up time the unit brought into the horizon still runs
    dims: [scenario, snapshot, UNIT]
  COMPONENT_down_time_brought_in:
    description: one while the down time the unit brought into the horizon still runs
    dims: [scenario, snapshot, UNIT]
  COMPONENT_modules_installed:
    description: >-
      whole modules of a fixed modular build, its nominal capacity over the module size, and one
      where the build is not modular
    dims: [scenario, UNIT]
  COMPONENT_big_m:
    description: >-
      the bound the big-M rows of a committable extendable unit release: the
      largest power the unit could reach
    dims: [scenario, UNIT]
    missing: absent
  COMPONENT_p_min_pu_nonneg:
    description: true where no `p_min_pu` of the unit is negative, in any snapshot and scenario
    dims: [UNIT]
    dtype: bool
  COMPONENT_marginal_cost_curve_p:
    description: >-
      the power at each breakpoint of the piecewise `marginal_cost` curve: the
      per-unit breakpoints times nominal capacity. No curve means no rows
    dims: [UNIT, breakpoint]
    missing: absent
  COMPONENT_marginal_cost_curve_cost:
    description: >-
      the running cost at each breakpoint: zero at the first, then summed over
      the segments, each its width times the `marginal_cost` at its upper end
    dims: [UNIT, breakpoint]
    missing: absent

relations:
  snapshot_period: {key: snapshot, values: period}

macros:
  COMPONENT_operating_cost:
    description: a cost per snapshot, weighted by the snapshot's hours and its period, summed
    args: [cost]
    template: >-
      sum(sum((cost * snapshot_weighting_objective) * at(period_weighting_objective,
      by=snapshot_period[period]), over=UNIT), over=snapshot)

variables:
  COMPONENT_status:
    name: COMPONENT-status
    description: how many modules of a committable unit are on; one module where it is not modular
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_committed
    domain: integer
    bounds:
      lower: 0
  COMPONENT_start_up:
    name: COMPONENT-start_up
    description: how many modules start in this snapshot
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_committed
    domain: integer
    bounds:
      lower: 0
  COMPONENT_shut_down:
    name: COMPONENT-shut_down
    description: how many modules stop in this snapshot
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_committed
    domain: integer
    bounds:
      lower: 0

expressions:
  COMPONENT_previous_status:
    description: >-
      the status a unit carries into a snapshot. It is off at the first
      snapshot of a unit that becomes active later
    dims: [scenario, snapshot, UNIT]
    cases:
      opening_late:
        when: position(snapshot) > 0 AND NOT shift(COMPONENT_activity_mask, along=snapshot, offset=1)
        expression: 0
    otherwise: COMPONENT_status_carried_over
  COMPONENT_status_carried_over:
    description: the initial status at the first snapshot, the previous status after it
    dims: [scenario, snapshot, UNIT]
    cases:
      opening:
        when: position(snapshot) == 0
        expression: COMPONENT_status_initial
    otherwise: shift(COMPONENT_status, along=snapshot, offset=1)
  COMPONENT_modules:
    description: >-
      how many modules the status counts: the chosen number for an extendable
      modular build, the installed number otherwise
    dims: [scenario, UNIT]
    cases:
      chosen:
        when: COMPONENT_NOM_extendable AND COMPONENT_modular
        expression: COMPONENT_n_mod
    otherwise: COMPONENT_modules_installed
  COMPONENT_NOM_committed:
    description: the capacity one status counts for in the ramp rows; one module, or the whole build
    dims: [scenario, UNIT]
    cases:
      modular_build:
        when: COMPONENT_modular
        expression: COMPONENT_NOM_mod
    otherwise: COMPONENT_NOM
  COMPONENT_ramp_previous_status:
    description: >-
      the status the ramp rows carry into a snapshot. A fixed modular unit that
      came in on before the network's first snapshot has all its modules on
    dims: [scenario, snapshot, UNIT]
    cases:
      opening_modules:
        when: >-
          position(snapshot) == 0 AND NOT COMPONENT_status_solved AND NOT COMPONENT_NOM_extendable AND COMPONENT_modular
        expression: COMPONENT_status_initial * COMPONENT_modules_installed
    otherwise: COMPONENT_previous_status
  COMPONENT_commitment_opex:
    expression: >-
      COMPONENT_operating_cost(COMPONENT_status * COMPONENT_stand_by_cost)
      + sum(sum((COMPONENT_start_up * COMPONENT_start_up_cost) * at(period_weighting_objective,
      by=snapshot_period[period]), over=UNIT), over=snapshot)
      + sum(sum((COMPONENT_shut_down * COMPONENT_shut_down_cost) * at(period_weighting_objective,
      by=snapshot_period[period]), over=UNIT), over=snapshot)

conditions:
  COMPONENT_committed:
    description: a committable unit, in a snapshot it is active in
    condition: COMPONENT_committable AND COMPONENT_activity_mask
  COMPONENT_com_ext:
    description: >-
      a committed unit with an extendable build that is not modular. Its status
      is held against the chosen build by big-M rows
    condition: COMPONENT_committed AND COMPONENT_NOM_extendable AND NOT COMPONENT_modular
  COMPONENT_marginal_cost_as_lp:
    description: >-
      true where every `marginal_cost` curve of the component is convex and no
      unit with a curve is committable: then the curves are stated as segment
      lines, else by incremental segments
    condition: >-
      COMPONENT_marginal_cost_convex
      AND count(COMPONENT_marginal_cost_curve AND COMPONENT_committable, over=UNIT) == 0

piecewise:
  COMPONENT_marginal_cost_lp:
    name: COMPONENT-marginal_cost_piecewise
    scaling: objective
    description: the running cost is at least the `marginal_cost` curve at the power, by segment lines
    along: breakpoint
    dims: [scenario, snapshot, UNIT]
    where: >-
      COMPONENT_marginal_cost_as_lp AND COMPONENT_marginal_cost_curve AND COMPONENT_activity_mask
      AND COMPONENT_marginal_cost_curve_p
    method: lp
    links:
      p: ["COMPONENT_p", "COMPONENT_marginal_cost_curve_p"]
      cost: ["COMPONENT_marginal_cost_piecewise", "COMPONENT_marginal_cost_curve_cost", ">="]
  COMPONENT_marginal_cost_incremental:
    name: COMPONENT-marginal_cost_piecewise
    scaling: objective
    description: >-
      the running cost is at least the `marginal_cost` curve at the power, by
      segments filled in order; the status gates the curve of a committable unit
    along: breakpoint
    dims: [scenario, snapshot, UNIT]
    where: >-
      NOT COMPONENT_marginal_cost_as_lp AND COMPONENT_marginal_cost_curve AND COMPONENT_activity_mask
      AND COMPONENT_marginal_cost_curve_p
    method: incremental
    activity: COMPONENT_status
    links:
      p: ["COMPONENT_p", "COMPONENT_marginal_cost_curve_p"]
      cost: ["COMPONENT_marginal_cost_piecewise", "COMPONENT_marginal_cost_curve_cost", ">="]

constraints:
  COMPONENT_com_p_lower:
    name: COMPONENT-com-p-lower
    description: a committed unit runs at least at its minimum while on
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_committed AND NOT COMPONENT_NOM_extendable AND NOT COMPONENT_modular
    expression: >-
      COMPONENT_p >=
      COMPONENT_p_min_pu * COMPONENT_NOM * (COMPONENT_status - COMPONENT_maintenance_pu * COMPONENT_maintenance_status)
  COMPONENT_com_p_upper:
    name: COMPONENT-com-p-upper
    description: a committed unit runs at most at its maximum while on, and not at all while off
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_committed AND NOT COMPONENT_NOM_extendable AND NOT COMPONENT_modular
    expression: >-
      COMPONENT_p <=
      COMPONENT_p_max_pu * COMPONENT_NOM * (COMPONENT_status - COMPONENT_maintenance_pu * COMPONENT_maintenance_status)
  COMPONENT_com_mod_p_lower:
    name: COMPONENT-com-mod-p-lower
    description: a committed modular unit runs at least at the minimum of its modules on
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_committed AND COMPONENT_modular
    expression: >-
      COMPONENT_p >=
      COMPONENT_p_min_pu * COMPONENT_NOM_mod
      * (COMPONENT_status - COMPONENT_maintenance_pu * COMPONENT_maintenance_status)
  COMPONENT_com_mod_p_upper:
    name: COMPONENT-com-mod-p-upper
    description: a committed modular unit runs at most at the maximum of its modules on
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_committed AND COMPONENT_modular
    expression: >-
      COMPONENT_p <=
      COMPONENT_p_max_pu * COMPONENT_NOM_mod
      * (COMPONENT_status - COMPONENT_maintenance_pu * COMPONENT_maintenance_status)
  COMPONENT_com_ext_p_upper_cap:
    name: COMPONENT-com-ext-p-upper-cap
    description: a committed extendable unit runs at most at its maximum of the chosen build
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_com_ext
    expression: >-
      COMPONENT_p <=
      COMPONENT_p_max_pu * (COMPONENT_NOM_ext - COMPONENT_maintenance_pu * COMPONENT_maintenance_capacity)
  COMPONENT_com_ext_p_upper_bigM:
    name: COMPONENT-com-ext-p-upper-bigM
    description: a committed extendable unit does not run while off
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_com_ext
    expression: COMPONENT_p <= COMPONENT_big_m * COMPONENT_status
  COMPONENT_com_ext_p_lower:
    name: COMPONENT-com-ext-p-lower
    description: a committed extendable unit runs at least at its minimum of the chosen build while on
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_com_ext
    expression: >-
      COMPONENT_p >=
      COMPONENT_p_min_pu * (COMPONENT_NOM_ext - COMPONENT_maintenance_pu * COMPONENT_maintenance_capacity)
      + COMPONENT_big_m * COMPONENT_status - COMPONENT_big_m
  COMPONENT_com_ext_p_lower_nonneg:
    name: COMPONENT-com-ext-p-lower-nonneg
    description: the power of a committed extendable unit is not negative where its `p_min_pu` never is
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_com_ext AND COMPONENT_p_min_pu_nonneg
    expression: COMPONENT_p >= 0
  COMPONENT_status_p_fixed_upper:
    name: COMPONENT-status-p-fixed-upper
    scaling: none
    description: the status is at most the modules installed
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_committed AND NOT (COMPONENT_NOM_extendable AND COMPONENT_modular)
    expression: COMPONENT_status <= COMPONENT_modules_installed
  COMPONENT_start_up_p_fixed_upper:
    name: COMPONENT-start_up-p-fixed-upper
    scaling: none
    description: the starts are at most the modules installed
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_committed AND NOT (COMPONENT_NOM_extendable AND COMPONENT_modular)
    expression: COMPONENT_start_up <= COMPONENT_modules_installed
  COMPONENT_shut_down_p_fixed_upper:
    name: COMPONENT-shut_down-p-fixed-upper
    scaling: none
    description: the stops are at most the modules installed
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_committed AND NOT (COMPONENT_NOM_extendable AND COMPONENT_modular)
    expression: COMPONENT_shut_down <= COMPONENT_modules_installed
  COMPONENT_status_NOM_variable_upper:
    name: COMPONENT-status-NOM-variable-upper
    scaling: none
    description: the status is at most the modules built
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_committed AND COMPONENT_NOM_extendable AND COMPONENT_modular
    expression: COMPONENT_status <= COMPONENT_n_mod
  COMPONENT_start_up_NOM_variable_upper:
    name: COMPONENT-start_up-NOM-variable-upper
    scaling: none
    description: the starts are at most the modules built
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_committed AND COMPONENT_NOM_extendable AND COMPONENT_modular
    expression: COMPONENT_start_up <= COMPONENT_n_mod
  COMPONENT_shut_down_NOM_variable_upper:
    name: COMPONENT-shut_down-NOM-variable-upper
    scaling: none
    description: the stops are at most the modules built
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_committed AND COMPONENT_NOM_extendable AND COMPONENT_modular
    expression: COMPONENT_shut_down <= COMPONENT_n_mod
  COMPONENT_com_transition_start_up:
    name: COMPONENT-com-transition-start-up
    scaling: none
    description: a module that turns on starts
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_committed
    expression: COMPONENT_start_up >= COMPONENT_status - COMPONENT_previous_status
  COMPONENT_com_transition_shut_down:
    name: COMPONENT-com-transition-shut-down
    scaling: none
    description: a module that turns off stops
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_committed
    expression: COMPONENT_shut_down >= COMPONENT_previous_status - COMPONENT_status
  COMPONENT_com_up_time:
    name: COMPONENT-com-up-time
    scaling: none
    description: a module started within the minimum up time is still on
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_committed AND COMPONENT_min_up_time > 0
    expression: >-
      sum_back(COMPONENT_start_up, along=snapshot, window=COMPONENT_min_up_time)
      + COMPONENT_up_time_brought_in <= COMPONENT_status
  COMPONENT_com_down_time:
    name: COMPONENT-com-down-time
    scaling: none
    description: a module stopped within the minimum down time is still off
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_committed AND COMPONENT_min_down_time > 0
    expression: >-
      sum_back(COMPONENT_shut_down, along=snapshot, window=COMPONENT_min_down_time)
      + COMPONENT_down_time_brought_in <= COMPONENT_modules - COMPONENT_status

assumptions:
  COMPONENT_big_m_where_committed_and_extendable:
    holds: COMPONENT_big_m
    where: COMPONENT_com_ext
    description: a committed extendable unit that is not modular has a big M
