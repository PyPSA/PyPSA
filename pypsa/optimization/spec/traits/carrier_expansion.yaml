parameters:
  ${C}_first_active:
    description: one in the first period the asset is active in, zero elsewhere
    dims: [period, "${c}"]
  ${C}_tech_capacity_weight:
    description: >-
      one where the asset is in the row's carrier-and-bus set. No row outside it,
      or where the asset is not active in the row's period
    dims: [global_constraint, "${c}"]
    missing: absent

relations:
  ${C}_carrier:
    description: the asset's carrier
    key: ${c}
    values: carrier

expressions:
  ${C}_tech_capacity_expansion:
    expression: sum(${C}_${nom}_ext * ${C}_tech_capacity_weight, over=${c})
  ${C}_additions:
    expression: sum(${C}_${nom}_ext * ${C}_first_active, over=${c}, by=${C}_carrier[carrier])
