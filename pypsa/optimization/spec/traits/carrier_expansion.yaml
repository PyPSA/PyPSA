given:
  variables:
    COMPONENT_BASE_nom_ext: {dims: [DIM]}

dimensions:
  DIM: {}
  global_constraint: {}
  period: {dtype: int, ordered: true}
  carrier: {}

parameters:
  COMPONENT_first_active:
    description: one in the first period the asset is active in, zero elsewhere
    dims: [period, DIM]
  COMPONENT_tech_capacity_weight:
    description: >-
      one where the asset is in the row's carrier-and-bus set. No row outside it,
      or where the asset is not active in the row's period
    dims: [global_constraint, DIM]
    missing: absent

relations:
  COMPONENT_carrier:
    description: the asset's carrier
    key: DIM
    values: carrier

expressions:
  COMPONENT_tech_capacity_expansion:
    expression: sum(COMPONENT_BASE_nom_ext * COMPONENT_tech_capacity_weight, over=DIM)
  COMPONENT_additions:
    expression: sum(COMPONENT_BASE_nom_ext * COMPONENT_first_active, over=DIM, by=COMPONENT_carrier[carrier])
