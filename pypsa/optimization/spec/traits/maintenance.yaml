given:
  parameters:
    Unit_NOM_extendable: {dims: [UNIT], dtype: bool}
    Unit_NOM_max: {dims: [scenario, UNIT]}
    Unit_NOM_min: {dims: [scenario, UNIT]}
    Unit_NOM_mod: {dims: [UNIT]}
    Unit_active: {dims: [snapshot, UNIT], dtype: bool}
    Unit_committable: {dims: [UNIT], dtype: bool}
    Unit_modules_installed: {dims: [scenario, UNIT]}
    snapshot_weightings_generators: {dims: [snapshot]}
  variables:
    Unit_NOM_ext: {dims: [UNIT]}
    Unit_status: {dims: [scenario, snapshot, UNIT]}
  conditions:
    Unit_committed: {dims: [snapshot, UNIT]}

dimensions:
  scenario: {}
  snapshot: {dtype: str, ordered: true}
  UNIT: {}

parameters:
  Unit_maintainable:
    description: whether the unit must go into maintenance within the horizon, in any scenario
    dims: [UNIT]
    dtype: bool
  Unit_maintenance_pu:
    description: the share of the build a maintenance event takes off
    dims: [scenario, UNIT]
  Unit_maintenance_events:
    description: how many maintenance events take place within the horizon
    dims: [scenario, UNIT]
    dtype: int
  Unit_maintenance_duration:
    description: >-
      the hours, in `snapshot_weightings.generators`, one event covers. No row
      uses it; it enters through `maintenance_cover` and
      `maintenance_start_blocked`
    dims: [scenario, UNIT]
    missing: absent
  Unit_maintenance_start_blocked:
    description: >-
      true where no event may start, because it would run past the horizon or
      into a snapshot the unit is not active in
    dims: [scenario, snapshot, UNIT]
    dtype: bool

relations:
  Unit_maintenance_cover:
    description: the snapshots an event covers, by the snapshot it starts in
    key:
      scenario: scenario
      UNIT: UNIT
      start: snapshot
      covered: snapshot
    missing: absent

variables:
  Unit_maintenance:
    name: Unit-maintenance
    description: one where an event covers the snapshot, zero otherwise
    dims: [scenario, snapshot, UNIT]
    where: Unit_maintainable AND Unit_active
    missing: 0
    bounds:
      lower: 0
      upper: 1
  Unit_maintenance_start:
    name: Unit-maintenance_start
    description: whether an event starts in this snapshot
    dims: [scenario, snapshot, UNIT]
    where: Unit_maintainable AND Unit_active
    missing: 0
    domain: binary
  Unit_maintenance_capacity:
    name: Unit-maintenance_capacity
    description: the chosen build while in maintenance, zero otherwise
    dims: [scenario, snapshot, UNIT]
    where: Unit_maint_ext
    missing: 0
    bounds:
      lower: 0
  Unit_maintenance_status:
    name: Unit-maintenance_status
    description: the status while in maintenance, zero otherwise
    dims: [scenario, snapshot, UNIT]
    where: >-
      Unit_maintainable AND Unit_committed AND NOT (Unit_NOM_extendable AND
      NOT (Unit_NOM_mod > 0))
    missing: 0
    bounds:
      lower: 0

expressions:
  Unit_maintenance_modules:
    description: >-
      the most modules that can be on in maintenance: the build cap in modules
      where extendable, the modules installed where fixed
    dims: [scenario, UNIT]
    cases:
      extendable:
        when: Unit_NOM_extendable
        expression: Unit_NOM_max / Unit_NOM_mod
    otherwise: Unit_modules_installed

conditions:
  Unit_maint_ext:
    description: >-
      a maintainable extendable unit, active in the snapshot, that is not both
      committable and modular
    condition: >-
      Unit_maintainable AND Unit_NOM_extendable AND NOT (Unit_committable AND
      Unit_NOM_mod > 0) AND Unit_active

constraints:
  Unit_maint_event_count:
    name: Unit-maint-event-count
    description: the unit has its number of events within the horizon
    dims: [scenario, UNIT]
    where: Unit_maintainable
    expression: sum(Unit_maintenance_start, over=snapshot) == Unit_maintenance_events
  Unit_maint_window:
    name: Unit-maint-window
    description: the unit is in maintenance exactly where an event covers the snapshot; events do not overlap
    dims: [scenario, snapshot, UNIT]
    where: Unit_maintainable AND Unit_active
    expression: >-
      Unit_maintenance == sum(Unit_maintenance_start, over=start,
      by=Unit_maintenance_cover[covered])
  Unit_maint_start_horizon:
    name: Unit-maint-start-horizon
    description: no event starts where it cannot run its whole duration
    dims: [scenario, snapshot, UNIT]
    where: Unit_maintainable AND Unit_active AND Unit_maintenance_start_blocked
    expression: Unit_maintenance_start == 0
  Unit_maintcap_upper:
    name: Unit-maintcap_upper
    description: >-
      the build in maintenance is at most the chosen build, and at most the
      build less its floor out of maintenance
    dims: [scenario, snapshot, UNIT]
    where: Unit_maint_ext
    expression: >-
      Unit_maintenance_capacity <= Unit_NOM_ext - Unit_NOM_min * (1 -
      Unit_maintenance)
  Unit_maintcap_upper_nommax:
    name: Unit-maintcap_upper_nommax
    description: out of maintenance, no build is taken off
    dims: [scenario, snapshot, UNIT]
    where: Unit_maint_ext
    expression: Unit_maintenance_capacity <= Unit_NOM_max * Unit_maintenance
  Unit_maintcap_lower_nommax:
    name: Unit-maintcap_lower_nommax
    description: in maintenance, the whole chosen build is taken off
    dims: [scenario, snapshot, UNIT]
    where: Unit_maint_ext
    expression: >-
      Unit_maintenance_capacity >= Unit_NOM_ext - Unit_NOM_max * (1 -
      Unit_maintenance)
  Unit_maintcap_lower_nommin:
    name: Unit-maintcap_lower_nommin
    description: in maintenance, at least the floor of the build is taken off
    dims: [scenario, snapshot, UNIT]
    where: Unit_maint_ext AND Unit_NOM_min > 0
    expression: Unit_maintenance_capacity >= Unit_NOM_min * Unit_maintenance
  Unit_maint_status_le_status:
    name: Unit-maint-status-le-status
    description: the status in maintenance is at most the status
    dims: [scenario, snapshot, UNIT]
    where: >-
      Unit_maintainable AND Unit_committed AND NOT Unit_NOM_extendable AND
      NOT (Unit_NOM_mod > 0)
    expression: Unit_maintenance_status <= Unit_status
  Unit_maint_status_le_maint:
    name: Unit-maint-status-le-maint
    description: out of maintenance, the status in maintenance is zero
    dims: [scenario, snapshot, UNIT]
    where: >-
      Unit_maintainable AND Unit_committed AND NOT Unit_NOM_extendable AND
      NOT (Unit_NOM_mod > 0)
    expression: Unit_maintenance_status <= Unit_maintenance
  Unit_maint_status_lb:
    name: Unit-maint-status-lb
    description: on and in maintenance, the status in maintenance is one
    dims: [scenario, snapshot, UNIT]
    where: >-
      Unit_maintainable AND Unit_committed AND NOT Unit_NOM_extendable AND
      NOT (Unit_NOM_mod > 0)
    expression: Unit_maintenance_status >= Unit_status + Unit_maintenance - 1
  Unit_maint_modstatus_le_status:
    name: Unit-maint-modstatus-le-status
    description: the modules on in maintenance are at most the modules on
    dims: [scenario, snapshot, UNIT]
    where: Unit_maintainable AND Unit_committed AND Unit_NOM_mod > 0
    expression: Unit_maintenance_status <= Unit_status
  Unit_maint_modstatus_le_maint:
    name: Unit-maint-modstatus-le-maint
    description: out of maintenance, no module is on in maintenance
    dims: [scenario, snapshot, UNIT]
    where: Unit_maintainable AND Unit_committed AND Unit_NOM_mod > 0
    expression: Unit_maintenance_status <= Unit_maintenance_modules * Unit_maintenance
  Unit_maint_modstatus_lb:
    name: Unit-maint-modstatus-lb
    description: in maintenance, every module on is on in maintenance
    dims: [scenario, snapshot, UNIT]
    where: Unit_maintainable AND Unit_committed AND Unit_NOM_mod > 0
    expression: >-
      Unit_maintenance_status >= Unit_status - Unit_maintenance_modules * (1 -
      Unit_maintenance)

assumptions:
  Unit_maintenance_events_positive:
    holds: Unit_maintenance_events > 0
    where: Unit_maintainable
    description: a maintainable unit has at least one event
  Unit_maintenance_duration_positive:
    holds: Unit_maintenance_duration > 0
    where: Unit_maintainable
    description: an event lasts longer than zero
  Unit_maintenance_duration_fits_the_horizon:
    holds: Unit_maintenance_duration <= sum(snapshot_weightings_generators, over=snapshot)
    where: Unit_maintainable
    description: one event fits into the horizon
  Unit_maintenance_events_fit_the_horizon:
    holds: >-
      Unit_maintenance_duration * Unit_maintenance_events <=
      sum(snapshot_weightings_generators, over=snapshot)
    where: Unit_maintainable
    description: all events together fit into the horizon
  Unit_maintenance_build_cap_is_finite:
    holds: Unit_NOM_max < inf
    where: Unit_maintainable AND Unit_NOM_extendable
    description: a maintainable extendable unit has a finite largest nominal capacity
