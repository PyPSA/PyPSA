given:
  parameters:
    COMPONENT_NOM_extendable: {dims: [UNIT], dtype: bool}
    COMPONENT_NOM_max: {dims: [UNIT]}
    COMPONENT_NOM_min: {dims: [UNIT]}
    COMPONENT_NOM_mod: {dims: [UNIT]}
    COMPONENT_active: {dims: [snapshot, UNIT], dtype: bool}
    COMPONENT_committable: {dims: [UNIT], dtype: bool}
    COMPONENT_modules_installed: {dims: [scenario, UNIT]}
    snapshot_weightings_generators: {dims: [snapshot]}
  variables:
    COMPONENT_NOM_ext: {dims: [UNIT]}
    COMPONENT_status: {dims: [scenario, snapshot, UNIT]}
  conditions:
    COMPONENT_committed: {dims: [snapshot, UNIT]}

dimensions:
  scenario: {}
  snapshot: {dtype: str, ordered: true}
  UNIT: {}

parameters:
  COMPONENT_maintainable:
    description: whether the unit must go into maintenance within the horizon, in any scenario
    dims: [UNIT]
    dtype: bool
  COMPONENT_maintenance_pu:
    description: the share of the build a maintenance event takes off
    dims: [scenario, UNIT]
  COMPONENT_maintenance_events:
    description: how many maintenance events take place within the horizon
    dims: [scenario, UNIT]
    dtype: int
  COMPONENT_maintenance_duration:
    description: >-
      the hours, in `snapshot_weightings.generators`, one event covers. No row
      uses it; it enters through `maintenance_cover` and
      `maintenance_start_blocked`
    dims: [scenario, UNIT]
    missing: absent
  COMPONENT_maintenance_start_blocked:
    description: >-
      true where no event may start, because it would run past the horizon or
      into a snapshot the unit is not active in
    dims: [scenario, snapshot, UNIT]
    dtype: bool

relations:
  COMPONENT_maintenance_cover:
    description: the snapshots an event covers, by the snapshot it starts in
    key:
      scenario: scenario
      UNIT: UNIT
      start: snapshot
      covered: snapshot
    missing: absent

variables:
  COMPONENT_maintenance:
    name: COMPONENT-maintenance
    description: one where an event covers the snapshot, zero otherwise
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_maintainable AND COMPONENT_active
    missing: 0
    bounds:
      lower: 0
      upper: 1
  COMPONENT_maintenance_start:
    name: COMPONENT-maintenance_start
    description: whether an event starts in this snapshot
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_maintainable AND COMPONENT_active
    missing: 0
    domain: binary
  COMPONENT_maintenance_capacity:
    name: COMPONENT-maintenance_capacity
    description: the chosen build while in maintenance, zero otherwise
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_maint_ext
    missing: 0
    bounds:
      lower: 0
  COMPONENT_maintenance_status:
    name: COMPONENT-maintenance_status
    description: the status while in maintenance, zero otherwise
    dims: [scenario, snapshot, UNIT]
    where: >-
      COMPONENT_maintainable AND COMPONENT_committed AND NOT (COMPONENT_NOM_extendable AND
      NOT (COMPONENT_NOM_mod > 0))
    missing: 0
    bounds:
      lower: 0

expressions:
  COMPONENT_maintenance_modules:
    description: >-
      the most modules that can be on in maintenance: the build cap in modules
      where extendable, the modules installed where fixed
    dims: [scenario, UNIT]
    cases:
      extendable:
        when: COMPONENT_NOM_extendable
        expression: COMPONENT_NOM_max / COMPONENT_NOM_mod
    otherwise: COMPONENT_modules_installed

conditions:
  COMPONENT_maint_ext:
    description: >-
      a maintainable extendable unit, active in the snapshot, that is not both
      committable and modular
    condition: >-
      COMPONENT_maintainable AND COMPONENT_NOM_extendable AND NOT (COMPONENT_committable AND
      COMPONENT_NOM_mod > 0) AND COMPONENT_active

constraints:
  COMPONENT_maint_event_count:
    name: COMPONENT-maint-event-count
    scaling: none
    description: the unit has its number of events within the horizon
    dims: [scenario, UNIT]
    where: COMPONENT_maintainable
    expression: sum(COMPONENT_maintenance_start, over=snapshot) == COMPONENT_maintenance_events
  COMPONENT_maint_window:
    name: COMPONENT-maint-window
    scaling: none
    description: the unit is in maintenance exactly where an event covers the snapshot; events do not overlap
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_maintainable AND COMPONENT_active
    expression: >-
      COMPONENT_maintenance == sum(COMPONENT_maintenance_start, over=start,
      by=COMPONENT_maintenance_cover[covered])
  COMPONENT_maint_start_horizon:
    name: COMPONENT-maint-start-horizon
    scaling: none
    description: no event starts where it cannot run its whole duration
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_maintainable AND COMPONENT_active AND COMPONENT_maintenance_start_blocked
    expression: COMPONENT_maintenance_start == 0
  COMPONENT_maintcap_upper:
    name: COMPONENT-maintcap_upper
    description: >-
      the build in maintenance is at most the chosen build, and at most the
      build less its floor out of maintenance
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_maint_ext
    expression: >-
      COMPONENT_maintenance_capacity <= COMPONENT_NOM_ext - COMPONENT_NOM_min * (1 -
      COMPONENT_maintenance)
  COMPONENT_maintcap_upper_nommax:
    name: COMPONENT-maintcap_upper_nommax
    description: out of maintenance, no build is taken off
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_maint_ext
    expression: COMPONENT_maintenance_capacity <= COMPONENT_NOM_max * COMPONENT_maintenance
  COMPONENT_maintcap_lower_nommax:
    name: COMPONENT-maintcap_lower_nommax
    description: in maintenance, the whole chosen build is taken off
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_maint_ext
    expression: >-
      COMPONENT_maintenance_capacity >= COMPONENT_NOM_ext - COMPONENT_NOM_max * (1 -
      COMPONENT_maintenance)
  COMPONENT_maintcap_lower_nommin:
    name: COMPONENT-maintcap_lower_nommin
    description: in maintenance, at least the floor of the build is taken off
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_maint_ext AND COMPONENT_NOM_min > 0
    expression: COMPONENT_maintenance_capacity >= COMPONENT_NOM_min * COMPONENT_maintenance
  COMPONENT_maint_status_le_status:
    name: COMPONENT-maint-status-le-status
    scaling: none
    description: the status in maintenance is at most the status
    dims: [scenario, snapshot, UNIT]
    where: >-
      COMPONENT_maintainable AND COMPONENT_committed AND NOT COMPONENT_NOM_extendable AND
      NOT (COMPONENT_NOM_mod > 0)
    expression: COMPONENT_maintenance_status <= COMPONENT_status
  COMPONENT_maint_status_le_maint:
    name: COMPONENT-maint-status-le-maint
    scaling: none
    description: out of maintenance, the status in maintenance is zero
    dims: [scenario, snapshot, UNIT]
    where: >-
      COMPONENT_maintainable AND COMPONENT_committed AND NOT COMPONENT_NOM_extendable AND
      NOT (COMPONENT_NOM_mod > 0)
    expression: COMPONENT_maintenance_status <= COMPONENT_maintenance
  COMPONENT_maint_status_lb:
    name: COMPONENT-maint-status-lb
    scaling: none
    description: on and in maintenance, the status in maintenance is one
    dims: [scenario, snapshot, UNIT]
    where: >-
      COMPONENT_maintainable AND COMPONENT_committed AND NOT COMPONENT_NOM_extendable AND
      NOT (COMPONENT_NOM_mod > 0)
    expression: COMPONENT_maintenance_status >= COMPONENT_status + COMPONENT_maintenance - 1
  COMPONENT_maint_modstatus_le_status:
    name: COMPONENT-maint-modstatus-le-status
    scaling: none
    description: the modules on in maintenance are at most the modules on
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_maintainable AND COMPONENT_committed AND COMPONENT_NOM_mod > 0
    expression: COMPONENT_maintenance_status <= COMPONENT_status
  COMPONENT_maint_modstatus_le_maint:
    name: COMPONENT-maint-modstatus-le-maint
    scaling: none
    description: out of maintenance, no module is on in maintenance
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_maintainable AND COMPONENT_committed AND COMPONENT_NOM_mod > 0
    expression: COMPONENT_maintenance_status <= COMPONENT_maintenance_modules * COMPONENT_maintenance
  COMPONENT_maint_modstatus_lb:
    name: COMPONENT-maint-modstatus-lb
    scaling: none
    description: in maintenance, every module on is on in maintenance
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_maintainable AND COMPONENT_committed AND COMPONENT_NOM_mod > 0
    expression: >-
      COMPONENT_maintenance_status >= COMPONENT_status - COMPONENT_maintenance_modules * (1 -
      COMPONENT_maintenance)

assumptions:
  COMPONENT_maintenance_events_positive:
    holds: COMPONENT_maintenance_events > 0
    where: COMPONENT_maintainable
    description: a maintainable unit has at least one event
  COMPONENT_maintenance_duration_positive:
    holds: COMPONENT_maintenance_duration > 0
    where: COMPONENT_maintainable
    description: an event lasts longer than zero
  COMPONENT_maintenance_duration_fits_the_horizon:
    holds: COMPONENT_maintenance_duration <= sum(snapshot_weightings_generators, over=snapshot)
    where: COMPONENT_maintainable
    description: one event fits into the horizon
  COMPONENT_maintenance_events_fit_the_horizon:
    holds: >-
      COMPONENT_maintenance_duration * COMPONENT_maintenance_events <=
      sum(snapshot_weightings_generators, over=snapshot)
    where: COMPONENT_maintainable
    description: all events together fit into the horizon
  COMPONENT_maintenance_build_cap_is_finite:
    holds: COMPONENT_NOM_max < inf
    where: COMPONENT_maintainable AND COMPONENT_NOM_extendable
    description: a maintainable extendable unit has a finite largest nominal capacity
