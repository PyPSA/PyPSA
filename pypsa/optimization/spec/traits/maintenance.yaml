parameters:
  ${C}_maintainable:
    description: whether the unit must go into maintenance within the horizon, in any scenario
    dims: ["${c}"]
    dtype: bool
  ${C}_maintenance_pu:
    description: the share of the build a maintenance event takes off
    dims: [scenario, "${c}"]
  ${C}_maintenance_events:
    description: how many maintenance events take place within the horizon
    dims: [scenario, "${c}"]
    dtype: int
  ${C}_maintenance_duration:
    description: >-
      the hours, in `snapshot_weightings.generators`, one event covers. No row
      uses it; it enters through `maintenance_cover` and
      `maintenance_start_blocked`
    dims: [scenario, "${c}"]
    missing: absent
  ${C}_maintenance_start_blocked:
    description: >-
      true where no event may start, because it would run past the horizon or
      into a snapshot the unit is not active in
    dims: [scenario, snapshot, "${c}"]
    dtype: bool

relations:
  ${C}_maintenance_cover:
    description: the snapshots an event covers, by the snapshot it starts in
    key:
      scenario: scenario
      ${c}: ${c}
      start: snapshot
      covered: snapshot
    missing: absent

variables:
  ${C}_maintenance:
    name: ${C}-maintenance
    description: one where an event covers the snapshot, zero otherwise
    dims: [scenario, snapshot, "${c}"]
    where: ${C}_maintainable AND ${C}_active
    missing: 0
    bounds:
      lower: 0
      upper: 1
  ${C}_maintenance_start:
    name: ${C}-maintenance_start
    description: whether an event starts in this snapshot
    dims: [scenario, snapshot, "${c}"]
    where: ${C}_maintainable AND ${C}_active
    missing: 0
    domain: binary
  ${C}_maintenance_capacity:
    name: ${C}-maintenance_capacity
    description: the chosen build while in maintenance, zero otherwise
    dims: [scenario, snapshot, "${c}"]
    where: ${C}_maint_ext
    missing: 0
    bounds:
      lower: 0
  ${C}_maintenance_status:
    name: ${C}-maintenance_status
    description: the status while in maintenance, zero otherwise
    dims: [scenario, snapshot, "${c}"]
    where: >-
      ${C}_maintainable AND ${C}_committed AND NOT (${C}_${nom}_extendable AND
      NOT (${C}_${nom}_mod > 0))
    missing: 0
    bounds:
      lower: 0

expressions:
  ${C}_maintenance_modules:
    description: >-
      the most modules that can be on in maintenance: the build cap in modules
      where extendable, the modules installed where fixed
    dims: [scenario, "${c}"]
    cases:
      extendable:
        when: ${C}_${nom}_extendable
        expression: ${C}_${nom}_max / ${C}_${nom}_mod
    otherwise: ${C}_modules_installed

conditions:
  ${C}_maint_ext:
    description: >-
      a maintainable extendable unit, active in the snapshot, that is not both
      committable and modular
    condition: >-
      ${C}_maintainable AND ${C}_${nom}_extendable AND NOT (${C}_committable AND
      ${C}_${nom}_mod > 0) AND ${C}_active

constraints:
  ${C}_maint_event_count:
    name: ${C}-maint-event-count
    description: the unit has its number of events within the horizon
    dims: [scenario, "${c}"]
    where: ${C}_maintainable
    expression: sum(${C}_maintenance_start, over=snapshot) == ${C}_maintenance_events
  ${C}_maint_window:
    name: ${C}-maint-window
    description: the unit is in maintenance exactly where an event covers the snapshot; events do not overlap
    dims: [scenario, snapshot, "${c}"]
    where: ${C}_maintainable AND ${C}_active
    expression: >-
      ${C}_maintenance == sum(${C}_maintenance_start, over=start,
      by=${C}_maintenance_cover[covered])
  ${C}_maint_start_horizon:
    name: ${C}-maint-start-horizon
    description: no event starts where it cannot run its whole duration
    dims: [scenario, snapshot, "${c}"]
    where: ${C}_maintainable AND ${C}_active AND ${C}_maintenance_start_blocked
    expression: ${C}_maintenance_start == 0
  ${C}_maintcap_upper:
    name: ${C}-maintcap_upper
    description: >-
      the build in maintenance is at most the chosen build, and at most the
      build less its floor out of maintenance
    dims: [scenario, snapshot, "${c}"]
    where: ${C}_maint_ext
    expression: >-
      ${C}_maintenance_capacity <= ${C}_${nom}_ext - ${C}_${nom}_min * (1 -
      ${C}_maintenance)
  ${C}_maintcap_upper_nommax:
    name: ${C}-maintcap_upper_nommax
    description: out of maintenance, no build is taken off
    dims: [scenario, snapshot, "${c}"]
    where: ${C}_maint_ext
    expression: ${C}_maintenance_capacity <= ${C}_${nom}_max * ${C}_maintenance
  ${C}_maintcap_lower_nommax:
    name: ${C}-maintcap_lower_nommax
    description: in maintenance, the whole chosen build is taken off
    dims: [scenario, snapshot, "${c}"]
    where: ${C}_maint_ext
    expression: >-
      ${C}_maintenance_capacity >= ${C}_${nom}_ext - ${C}_${nom}_max * (1 -
      ${C}_maintenance)
  ${C}_maintcap_lower_nommin:
    name: ${C}-maintcap_lower_nommin
    description: in maintenance, at least the floor of the build is taken off
    dims: [scenario, snapshot, "${c}"]
    where: ${C}_maint_ext AND ${C}_${nom}_min > 0
    expression: ${C}_maintenance_capacity >= ${C}_${nom}_min * ${C}_maintenance
  ${C}_maint_status_le_status:
    name: ${C}-maint-status-le-status
    description: the status in maintenance is at most the status
    dims: [scenario, snapshot, "${c}"]
    where: >-
      ${C}_maintainable AND ${C}_committed AND NOT ${C}_${nom}_extendable AND
      NOT (${C}_${nom}_mod > 0)
    expression: ${C}_maintenance_status <= ${C}_status
  ${C}_maint_status_le_maint:
    name: ${C}-maint-status-le-maint
    description: out of maintenance, the status in maintenance is zero
    dims: [scenario, snapshot, "${c}"]
    where: >-
      ${C}_maintainable AND ${C}_committed AND NOT ${C}_${nom}_extendable AND
      NOT (${C}_${nom}_mod > 0)
    expression: ${C}_maintenance_status <= ${C}_maintenance
  ${C}_maint_status_lb:
    name: ${C}-maint-status-lb
    description: on and in maintenance, the status in maintenance is one
    dims: [scenario, snapshot, "${c}"]
    where: >-
      ${C}_maintainable AND ${C}_committed AND NOT ${C}_${nom}_extendable AND
      NOT (${C}_${nom}_mod > 0)
    expression: ${C}_maintenance_status >= ${C}_status + ${C}_maintenance - 1
  ${C}_maint_modstatus_le_status:
    name: ${C}-maint-modstatus-le-status
    description: the modules on in maintenance are at most the modules on
    dims: [scenario, snapshot, "${c}"]
    where: ${C}_maintainable AND ${C}_committed AND ${C}_${nom}_mod > 0
    expression: ${C}_maintenance_status <= ${C}_status
  ${C}_maint_modstatus_le_maint:
    name: ${C}-maint-modstatus-le-maint
    description: out of maintenance, no module is on in maintenance
    dims: [scenario, snapshot, "${c}"]
    where: ${C}_maintainable AND ${C}_committed AND ${C}_${nom}_mod > 0
    expression: ${C}_maintenance_status <= ${C}_maintenance_modules * ${C}_maintenance
  ${C}_maint_modstatus_lb:
    name: ${C}-maint-modstatus-lb
    description: in maintenance, every module on is on in maintenance
    dims: [scenario, snapshot, "${c}"]
    where: ${C}_maintainable AND ${C}_committed AND ${C}_${nom}_mod > 0
    expression: >-
      ${C}_maintenance_status >= ${C}_status - ${C}_maintenance_modules * (1 -
      ${C}_maintenance)

assumptions:
  ${C}_maintenance_events_positive:
    holds: ${C}_maintenance_events > 0
    where: ${C}_maintainable
    description: a maintainable unit has at least one event
  ${C}_maintenance_duration_positive:
    holds: ${C}_maintenance_duration > 0
    where: ${C}_maintainable
    description: an event lasts longer than zero
  ${C}_maintenance_duration_fits_the_horizon:
    holds: ${C}_maintenance_duration <= sum(snapshot_weightings_generators, over=snapshot)
    where: ${C}_maintainable
    description: one event fits into the horizon
  ${C}_maintenance_events_fit_the_horizon:
    holds: >-
      ${C}_maintenance_duration * ${C}_maintenance_events <=
      sum(snapshot_weightings_generators, over=snapshot)
    where: ${C}_maintainable
    description: all events together fit into the horizon
  ${C}_maintenance_build_cap_is_finite:
    holds: ${C}_${nom}_max < inf
    where: ${C}_maintainable AND ${C}_${nom}_extendable
    description: a maintainable extendable unit has a finite `${nom}_max`
