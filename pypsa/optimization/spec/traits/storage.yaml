parameters:
  ${C}_efficiency_store:
    description: share of the power taken from the bus that is stored
    dims: [scenario, snapshot, "${c}"]
  ${C}_efficiency_dispatch:
    description: share of the stored energy taken out that reaches the bus
    dims: [scenario, snapshot, "${c}"]
  ${C}_retention:
    description: share of the stored energy kept over a snapshot, from `standing_loss` and the snapshot's hours
    dims: [scenario, snapshot, "${c}"]
  ${C}_inflow:
    description: energy flowing in per hour, such as a river into a reservoir
    dims: [scenario, snapshot, "${c}"]
  ${C}_spill_cost:
    description: cost of one unit of inflow spilled
    dims: [scenario, snapshot, "${c}"]
  ${C}_marginal_cost_storage:
    description: cost of one unit of energy stored over one hour
    dims: [scenario, snapshot, "${c}"]
  ${C}_${level}_initial:
    description: energy stored before the first snapshot
    dims: [scenario, "${c}"]
  ${C}_${level}_initial_per_period:
    description: whether each investment period starts again from the initial energy
    dims: [scenario, "${c}"]
    dtype: bool
  ${C}_${cyclic}:
    description: whether the horizon ends on the energy it starts with, instead of the initial one
    dims: [scenario, "${c}"]
    dtype: bool
  ${C}_${cyclic}_per_period:
    description: whether each investment period ends on the energy it starts with; it overrides the two other flags
    dims: [scenario, "${c}"]
    dtype: bool
  ${C}_opens_late:
    description: true at the first snapshot of an asset that becomes active after the first snapshot of the horizon
    dims: [snapshot, "${c}"]
    dtype: bool
  ${C}_inactive_snapshots:
    description: how many snapshots of the horizon the asset is not active in
    dims: ["${c}"]
    dtype: int
  ${C}_primary_energy_weight:
    description: >-
      the constrained carrier attribute per unit of energy stored. No row where
      the carrier has no weight
    dims: [scenario, global_constraint, "${c}"]
    missing: absent

variables:
  ${C}_p_store:
    name: ${C}-p_store
    description: power taken from the bus to store
    dims: [scenario, snapshot, "${c}"]
    where: ${C}_active
  ${C}_spill:
    name: ${C}-spill
    description: inflow spilled; zero where there is no inflow
    dims: [scenario, snapshot, "${c}"]
    where: ${C}_inflow > 0 AND ${C}_active
    missing: 0
    bounds:
      lower: 0
      upper: ${C}_inflow

expressions:
  ${C}_level_carried_in:
    description: >-
      the energy stored at the start of a snapshot: the previous level less the
      standing loss, the last level where the horizon or period is cyclic, the
      initial level where it opens
    dims: [scenario, snapshot, "${c}"]
    cases:
      cyclic:
        when: >-
          ${C}_${cyclic} AND NOT ${C}_${cyclic}_per_period
          AND NOT ${C}_${level}_initial_per_period
          AND (position(snapshot) == 0 OR ${C}_opens_late)
        expression: >-
          ${C}_retention
          * shift(shift(${C}_${level}, along=snapshot, offset=1, edge='wrap'), along=snapshot, offset=${C}_inactive_snapshots, edge='wrap')
      opening:
        when: >-
          NOT ${C}_${cyclic} AND NOT ${C}_${cyclic}_per_period
          AND NOT ${C}_${level}_initial_per_period
          AND (position(snapshot) == 0 OR ${C}_opens_late)
        expression: ${C}_${level}_initial
      period_cyclic:
        when: ${C}_${cyclic}_per_period
        expression: >-
          ${C}_retention
          * shift(${C}_${level}, along=snapshot, offset=1, edge='wrap', within=snapshot_period[period])
      period_opening:
        when: >-
          ${C}_${level}_initial_per_period AND NOT ${C}_${cyclic}_per_period
          AND position(snapshot, within=snapshot_period[period]) == 0
        expression: ${C}_${level}_initial
    otherwise: ${C}_retention * shift(${C}_${level}, along=snapshot, offset=1)
  ${C}_last_counted_active:
    description: one at the last snapshot a global constraint counts while the asset is active
    dims: [scenario, global_constraint, snapshot, "${c}"]
    cases:
      last:
        when: >-
          GlobalConstraint_counts_snapshot AND ${C}_active
          AND NOT shift(GlobalConstraint_counts_snapshot AND ${C}_active, along=snapshot, offset=-1)
        expression: 1
    otherwise: 0
  ${C}_closing_weight:
    description: >-
      what the closing level counts for in a global constraint: the period's
      years at each period's end where the level restarts per period, one at
      the last counted snapshot otherwise
    dims: [scenario, global_constraint, snapshot, "${c}"]
    cases:
      per_period:
        when: ${C}_${level}_initial_per_period AND GlobalConstraint_counts_snapshot AND position(snapshot, within=snapshot_period[period]) == -1
        expression: at(period_weight_years, by=snapshot_period[period])
      carried_over:
        when: NOT ${C}_${level}_initial_per_period
        expression: ${C}_last_counted_active
    otherwise: 0
  ${C}_primary_energy:
    expression: >-
      -sum(sum((${C}_${level} * ${C}_closing_weight) * ${C}_primary_energy_weight, over=snapshot), over=${c})
  ${C}_operational_limit:
    expression: >-
      -sum(sum((${C}_${level} * ${C}_closing_weight) * ${C}_operational_limit_weight, over=snapshot), over=${c})
  ${C}_storage_opex:
    expression: >-
      ${C}_operating_cost(${C}_${level} * ${C}_marginal_cost_storage)
      + ${C}_operating_cost(${C}_spill * ${C}_spill_cost)

conditions:
  ${C}_marginal_cost_as_lp:
    description: >-
      true where every `marginal_cost` curve of the component is convex: then
      the curves are stated as segment lines, else by incremental segments
    condition: >-
      count(${C}_marginal_cost_curve AND count(${C}_marginal_cost_curve_bends_down, over=breakpoint) > 0, over=${c}) == 0

piecewise:
  ${C}_marginal_cost_incremental:
    name: ${C}-marginal_cost_piecewise
    description: >-
      the running cost is at least the `marginal_cost` curve at the power, by
      segments filled in order; no status gates it
    along: breakpoint
    dims: [scenario, snapshot, "${c}"]
    where: NOT ${C}_marginal_cost_as_lp AND ${C}_marginal_cost_curve AND ${C}_active AND ${C}_marginal_cost_curve_p
    method: incremental
    links:
      p: ["${C}_${p}", "${C}_marginal_cost_curve_p"]
      cost: ["${C}_marginal_cost_piecewise", "${C}_marginal_cost_curve_cost", ">="]

constraints:
  ${C}_fix_p_store_lower:
    name: ${C}-fix-p_store-lower
    description: a fixed asset stores no negative power
    dims: [scenario, snapshot, "${c}"]
    where: NOT ${C}_${nom}_extendable AND ${C}_active
    expression: ${C}_p_store >= 0
  ${C}_ext_p_store_lower:
    name: ${C}-ext-p_store-lower
    description: an extendable asset stores no negative power
    dims: [scenario, snapshot, "${c}"]
    where: ${C}_${nom}_extendable AND ${C}_active
    expression: ${C}_p_store >= 0

assumptions:
  ${C}_stands_in_one_run:
    holds: >-
      count(${C}_active AND NOT shift(${C}_active, along=snapshot, offset=1),
      over=snapshot) <= 1
    description: the snapshots an asset is active in are one unbroken run
  ${C}_opens_late_only_where_it_opens:
    holds: >-
      ${C}_active AND NOT shift(${C}_active, along=snapshot, offset=1) AND
      position(snapshot) > 0
    where: ${C}_opens_late
    description: "`opens_late` marks only the first active snapshot after the first of the horizon"
  ${C}_opens_late_where_it_opens:
    holds: ${C}_opens_late
    where: >-
      ${C}_active AND NOT shift(${C}_active, along=snapshot, offset=1) AND
      position(snapshot) > 0
    description: "`opens_late` marks every first active snapshot after the first of the horizon"
  ${C}_primary_energy_carried_over_has_unit_years:
    holds: "period_weight_years == 1"
    where: "${C}_primary_energy_weight AND NOT ${C}_${level}_initial_per_period"
    description: a level carried over between periods counts in a `primary_energy` row only where each period weighs one year
  ${C}_operational_limit_carried_over_has_unit_years:
    holds: "at(period_weight_years == 1, by=snapshot_period[period])"
    where: "${C}_operational_limit_weight AND NOT ${C}_${level}_initial_per_period AND GlobalConstraint_counts_snapshot"
    description: a level carried over between periods counts in an `operational_limit` row only where each period weighs one year
