parameters:
  ${C}_${nom}_mod:
    description: >-
      the module size a build comes in whole numbers of. No value means the
      build is continuous
    dims: ["${c}"]
    missing: absent
  ${C}_active_asset:
    description: >-
      whether a ${unit} is one of PyPSA's `active_assets`, by its `active` flag
      alone, without build year and lifetime. A unit that is active in no
      snapshot of the horizon still counts. PyPSA refuses one that differs by
      scenario (`constants.py:54`)
    dims: ["${c}"]
    dtype: bool
  ${C}_capital_weight:
    description: >-
      the sum of period weights a ${unit} is active in. It is PyPSA's `active *
      period_weighting`, summed, data prep
    dims: ["${c}"]

variables:
  ${C}_n_mod:
    description: >-
      `${C}-n_mod` — how many modules of an extendable modular build. A unit
      that is not active has none
    dims: ["${c}"]
    where: ${C}_${nom}_extendable AND ${C}_${nom}_mod > 0 AND ${C}_active_asset
    domain: integer
    bounds:
      lower: 0
  ${C}_capital_cost_piecewise:
    description: >-
      `${C}-capital_cost_piecewise` — the cost of the build of an extendable
      ${unit} that pays along a curve, held above the curve
    dims: ["${c}"]
    where: ${C}_capital_cost_curve

expressions:
  ${C}_${nom}_rated:
    description: >-
      the given build a fixed ${unit}'s limits are taken against. It is zero for
      an unrated ${unit}, one whose `${nom}` is infinite: its limit is a row
      only where the per-unit value is zero, and the row bounds at zero
      (`constraints.py:129-140`)
    dims: [scenario, "${c}"]
    cases:
      unrated:
        when: ${C}_${nom} == inf
        expression: 0
    otherwise: ${C}_${nom}
  ${C}_build_cost:
    description: >-
      what the build of an extendable ${unit} costs: the value read off its
      piecewise curve where it has one, and its linear `capital_cost` otherwise.
      A curve replaces the linear cost, as PyPSA drops the unit from that term
      (`optimize.py:404-446`)
    dims: [scenario, "${c}"]
    cases:
      curve:
        when: ${C}_capital_cost_curve
        expression: ${C}_capital_cost_piecewise
    otherwise: ${C}_${nom}_ext * ${C}_capital_cost
  ${C}_capex:
    expression: sum(scenario_weight * ${C}_build_cost * ${C}_capital_weight)

conditions:
  ${C}_capital_cost_curve:
    description: >-
      a ${unit} whose build pays along a piecewise `capital_cost` curve: an
      extendable one of PyPSA's `active_assets` with curve data
      (`optimize.py:404-421`, `piecewise.py:230-257`)
    condition: >-
      count(${C}_capital_cost_curve_nom, over=breakpoint) > 0 AND
      ${C}_${nom}_extendable AND ${C}_active_asset
  ${C}_capital_cost_as_lp:
    description: >-
      linopy's choice of method for all ${unit} build cost curves at once
      (`method="auto"`): the segment lines where every curve is convex, the
      incremental rows otherwise. PyPSA calls linopy once per component, so this
      choice is apart from every other component's. A build has no status, so no
      gate (`optimize.py:412-421`)
    condition: >-
      count(${C}_capital_cost_curve AND
      count(${C}_capital_cost_curve_bends_down, over=breakpoint) > 0, over=${c})
      == 0

constraints:
  ${C}_ext_${nom}_lower:
    description: >-
      `${C}-ext-${nom}-lower` — the chosen build is at least its floor in every
      scenario
    dims: [scenario, "${c}"]
    where: ${C}_${nom}_extendable AND ${C}_active_asset
    expression: ${C}_${nom}_ext >= ${C}_${nom}_min
  ${C}_ext_${nom}_upper:
    description: >-
      `${C}-ext-${nom}-upper` — the chosen build is at most its cap in every
      scenario. A cap of infinity is no row
    dims: [scenario, "${c}"]
    where: ${C}_${nom}_extendable AND ${C}_active_asset AND ${C}_${nom}_max
    expression: ${C}_${nom}_ext <= ${C}_${nom}_max
  ${C}_${nom}_set:
    description: >-
      `${C}-${nom}_set` — the chosen build pinned in every scenario, wherever a
      value is given
    dims: [scenario, "${c}"]
    where: ${C}_${nom}_extendable AND ${C}_active_asset AND ${C}_${nom}_set
    expression: ${C}_${nom}_ext == ${C}_${nom}_set
  ${C}_${nom}_modularity:
    description: "`${C}-${nom}_modularity` — the chosen build is a whole number of modules"
    dims: ["${c}"]
    where: ${C}_${nom}_extendable AND ${C}_${nom}_mod > 0 AND ${C}_active_asset
    expression: ${C}_${nom}_ext == ${C}_${nom}_mod * ${C}_n_mod
