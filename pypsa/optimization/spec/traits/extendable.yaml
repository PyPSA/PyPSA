given:
  parameters:
    scenario_weight: {dims: [scenario]}

dimensions:
  scenario: {}
  snapshot: {dtype: str, ordered: true}
  UNIT: {}
  breakpoint: {dtype: int, ordered: true}

parameters:
  Unit_active:
    description: whether the asset is active in the snapshot's period, by build year and lifetime
    dims: [snapshot, UNIT]
    dtype: bool
  Unit_active_asset:
    description: >-
      whether the asset is active by its `active` flag alone, whatever its build
      year and lifetime
    dims: [UNIT]
    dtype: bool
  Unit_NOM:
    description: nominal capacity
    dims: [scenario, UNIT]
  Unit_NOM_extendable:
    description: whether the nominal capacity is a decision
    dims: [UNIT]
    dtype: bool
  Unit_NOM_min:
    description: least nominal capacity of an extendable asset
    dims: [scenario, UNIT]
  Unit_NOM_max:
    description: most nominal capacity of an extendable asset
    dims: [scenario, UNIT]
  Unit_NOM_set:
    description: a given nominal capacity of an extendable asset. No value means no row
    dims: [scenario, UNIT]
    missing: absent
  Unit_NOM_mod:
    description: the module size the build comes in whole numbers of. No value means a continuous build
    dims: [UNIT]
    missing: absent
  Unit_capital_cost:
    description: >-
      cost of one unit of nominal capacity over the modelled horizon: the
      annuity of `overnight_cost`, or `capital_cost`, plus `fom_cost`
    dims: [scenario, UNIT]
  Unit_overnight_cost:
    description: the overnight cost of one unit of nominal capacity. No value means no row
    dims: [UNIT]
    missing: absent
  Unit_capital_weight:
    description: the summed weights of the periods the asset is active in
    dims: [UNIT]
  Unit_capital_cost_curve_nom:
    description: the nominal capacity at each breakpoint of the piecewise `capital_cost` curve. No curve means no rows
    dims: [UNIT, breakpoint]
    missing: absent
  Unit_capital_cost_curve_cost:
    description: >-
      the build cost at each breakpoint: zero at the first, then summed over
      the segments, each its width times the `capital_cost` at its upper end
    dims: [UNIT, breakpoint]
    missing: absent

variables:
  Unit_NOM_ext:
    name: Unit-NOM
    description: the nominal capacity of an extendable asset
    dims: [UNIT]
    where: Unit_NOM_extendable AND Unit_active_asset
  Unit_n_mod:
    name: Unit-n_mod
    description: the number of modules of an extendable modular asset
    dims: [UNIT]
    where: Unit_NOM_extendable AND Unit_NOM_mod > 0 AND Unit_active_asset
    domain: integer
    bounds:
      lower: 0
  Unit_capital_cost_piecewise:
    name: Unit-capital_cost_piecewise
    description: the build cost of an asset with a `capital_cost` curve
    dims: [UNIT]
    where: Unit_capital_cost_curve

expressions:
  Unit_NOM_rated:
    description: >-
      the given nominal capacity, and zero where it is infinite. Then a limit is
      a row only where the per-unit value is zero
    dims: [scenario, UNIT]
    cases:
      unrated:
        when: Unit_NOM == inf
        expression: 0
    otherwise: Unit_NOM
  Unit_build_cost:
    description: the cost read off the `capital_cost` curve where there is one, build times `capital_cost` otherwise
    dims: [scenario, UNIT]
    cases:
      curve:
        when: Unit_capital_cost_curve
        expression: Unit_capital_cost_piecewise
    otherwise: Unit_NOM_ext * Unit_capital_cost
  Unit_capex:
    expression: sum(scenario_weight * Unit_build_cost * Unit_capital_weight)

conditions:
  Unit_capital_cost_curve:
    description: an extendable active asset with a piecewise `capital_cost` curve
    condition: >-
      count(Unit_capital_cost_curve_nom, over=breakpoint) > 0 AND
      Unit_NOM_extendable AND Unit_active_asset
  Unit_capital_cost_curve_bends_down:
    description: a breakpoint where the `capital_cost` curve gets less steep
    condition: >-
      Unit_capital_cost_curve_nom
      AND shift(Unit_capital_cost_curve_nom, along=breakpoint, offset=1)
      AND shift(Unit_capital_cost_curve_nom, along=breakpoint, offset=-1)
      AND (Unit_capital_cost_curve_cost - shift(Unit_capital_cost_curve_cost, along=breakpoint, offset=1, edge=0))
      * (shift(Unit_capital_cost_curve_nom, along=breakpoint, offset=-1, edge=0) - Unit_capital_cost_curve_nom)
      > (shift(Unit_capital_cost_curve_cost, along=breakpoint, offset=-1, edge=0) - Unit_capital_cost_curve_cost)
      * (Unit_capital_cost_curve_nom - shift(Unit_capital_cost_curve_nom, along=breakpoint, offset=1, edge=0))
  Unit_capital_cost_as_lp:
    description: >-
      true where every `capital_cost` curve of the component is convex: then
      the curves are stated as segment lines, else by incremental segments
    condition: >-
      count(Unit_capital_cost_curve AND
      count(Unit_capital_cost_curve_bends_down, over=breakpoint) > 0, over=UNIT)
      == 0

piecewise:
  Unit_capital_cost_lp:
    name: Unit-capital_cost_piecewise
    description: the build cost is at least the `capital_cost` curve at the build, by segment lines
    along: breakpoint
    dims: [UNIT]
    where: Unit_capital_cost_as_lp AND Unit_capital_cost_curve AND Unit_capital_cost_curve_nom
    method: lp
    links:
      NOM: ["Unit_NOM_ext", "Unit_capital_cost_curve_nom"]
      cost: ["Unit_capital_cost_piecewise", "Unit_capital_cost_curve_cost", ">="]
  Unit_capital_cost_incremental:
    name: Unit-capital_cost_piecewise
    description: the build cost is at least the `capital_cost` curve at the build, by segments filled in order
    along: breakpoint
    dims: [UNIT]
    where: NOT Unit_capital_cost_as_lp AND Unit_capital_cost_curve AND Unit_capital_cost_curve_nom
    method: incremental
    links:
      NOM: ["Unit_NOM_ext", "Unit_capital_cost_curve_nom"]
      cost: ["Unit_capital_cost_piecewise", "Unit_capital_cost_curve_cost", ">="]

constraints:
  Unit_ext_NOM_lower:
    name: Unit-ext-NOM-lower
    description: the chosen build is at least the floor
    dims: [scenario, UNIT]
    where: Unit_NOM_extendable AND Unit_active_asset
    expression: Unit_NOM_ext >= Unit_NOM_min
  Unit_ext_NOM_upper:
    name: Unit-ext-NOM-upper
    description: the chosen build is at most the cap; an infinite cap means no row
    dims: [scenario, UNIT]
    where: Unit_NOM_extendable AND Unit_active_asset AND Unit_NOM_max
    expression: Unit_NOM_ext <= Unit_NOM_max
  Unit_NOM_set:
    name: Unit-NOM_set
    description: the chosen build equals the given one
    dims: [scenario, UNIT]
    where: Unit_NOM_extendable AND Unit_active_asset AND Unit_NOM_set
    expression: Unit_NOM_ext == Unit_NOM_set
  Unit_NOM_modularity:
    name: Unit-NOM_modularity
    description: the chosen build is a whole number of modules
    dims: [UNIT]
    where: Unit_NOM_extendable AND Unit_NOM_mod > 0 AND Unit_active_asset
    expression: Unit_NOM_ext == Unit_NOM_mod * Unit_n_mod

assumptions:
  Unit_capital_cost_curve_without_overnight_cost:
    holds: NOT Unit_overnight_cost
    where: Unit_capital_cost_curve
    description: an asset with a `capital_cost` curve has no `overnight_cost`, as the curve is already periodized
