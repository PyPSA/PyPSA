given:
  parameters:
    scenario_weight: {dims: [scenario]}

dimensions:
  scenario: {}
  snapshot: {dtype: str, ordered: true}
  DIM: {}
  breakpoint: {dtype: int, ordered: true}

parameters:
  COMPONENT_active:
    description: whether the asset is active in the snapshot's period, by build year and lifetime
    dims: [snapshot, DIM]
    dtype: bool
  COMPONENT_active_asset:
    description: >-
      whether the asset is active by its `active` flag alone, whatever its build
      year and lifetime
    dims: [DIM]
    dtype: bool
  COMPONENT_NOM:
    description: nominal capacity
    dims: [scenario, DIM]
  COMPONENT_NOM_extendable:
    description: whether the nominal capacity is a decision
    dims: [DIM]
    dtype: bool
  COMPONENT_NOM_min:
    description: least nominal capacity of an extendable asset
    dims: [scenario, DIM]
  COMPONENT_NOM_max:
    description: most nominal capacity of an extendable asset
    dims: [scenario, DIM]
  COMPONENT_NOM_set:
    description: a given nominal capacity of an extendable asset. No value means no row
    dims: [scenario, DIM]
    missing: absent
  COMPONENT_NOM_mod:
    description: the module size the build comes in whole numbers of. No value means a continuous build
    dims: [DIM]
    missing: absent
  COMPONENT_capital_cost:
    description: >-
      cost of one unit of nominal capacity over the modelled horizon: the
      annuity of `overnight_cost`, or `capital_cost`, plus `fom_cost`
    dims: [scenario, DIM]
  COMPONENT_overnight_cost:
    description: the overnight cost of one unit of nominal capacity. No value means no row
    dims: [DIM]
    missing: absent
  COMPONENT_capital_weight:
    description: the summed weights of the periods the asset is active in
    dims: [DIM]
  COMPONENT_capital_cost_curve_nom:
    description: the nominal capacity at each breakpoint of the piecewise `capital_cost` curve. No curve means no rows
    dims: [DIM, breakpoint]
    missing: absent
  COMPONENT_capital_cost_curve_cost:
    description: >-
      the build cost at each breakpoint: zero at the first, then summed over
      the segments, each its width times the `capital_cost` at its upper end
    dims: [DIM, breakpoint]
    missing: absent

variables:
  COMPONENT_NOM_ext:
    name: COMPONENT-NOM
    description: the nominal capacity of an extendable asset
    dims: [DIM]
    where: COMPONENT_NOM_extendable AND COMPONENT_active_asset
  COMPONENT_n_mod:
    name: COMPONENT-n_mod
    description: the number of modules of an extendable modular asset
    dims: [DIM]
    where: COMPONENT_NOM_extendable AND COMPONENT_NOM_mod > 0 AND COMPONENT_active_asset
    domain: integer
    bounds:
      lower: 0
  COMPONENT_capital_cost_piecewise:
    name: COMPONENT-capital_cost_piecewise
    description: the build cost of an asset with a `capital_cost` curve
    dims: [DIM]
    where: COMPONENT_capital_cost_curve

expressions:
  COMPONENT_NOM_rated:
    description: >-
      the given nominal capacity, and zero where it is infinite. Then a limit is
      a row only where the per-unit value is zero
    dims: [scenario, DIM]
    cases:
      unrated:
        when: COMPONENT_NOM == inf
        expression: 0
    otherwise: COMPONENT_NOM
  COMPONENT_build_cost:
    description: the cost read off the `capital_cost` curve where there is one, build times `capital_cost` otherwise
    dims: [scenario, DIM]
    cases:
      curve:
        when: COMPONENT_capital_cost_curve
        expression: COMPONENT_capital_cost_piecewise
    otherwise: COMPONENT_NOM_ext * COMPONENT_capital_cost
  COMPONENT_capex:
    expression: sum(scenario_weight * COMPONENT_build_cost * COMPONENT_capital_weight)

conditions:
  COMPONENT_capital_cost_curve:
    description: an extendable active asset with a piecewise `capital_cost` curve
    condition: >-
      count(COMPONENT_capital_cost_curve_nom, over=breakpoint) > 0 AND
      COMPONENT_NOM_extendable AND COMPONENT_active_asset
  COMPONENT_capital_cost_curve_bends_down:
    description: a breakpoint where the `capital_cost` curve gets less steep
    condition: >-
      COMPONENT_capital_cost_curve_nom
      AND shift(COMPONENT_capital_cost_curve_nom, along=breakpoint, offset=1)
      AND shift(COMPONENT_capital_cost_curve_nom, along=breakpoint, offset=-1)
      AND (COMPONENT_capital_cost_curve_cost - shift(COMPONENT_capital_cost_curve_cost, along=breakpoint, offset=1, edge=0))
      * (shift(COMPONENT_capital_cost_curve_nom, along=breakpoint, offset=-1, edge=0) - COMPONENT_capital_cost_curve_nom)
      > (shift(COMPONENT_capital_cost_curve_cost, along=breakpoint, offset=-1, edge=0) - COMPONENT_capital_cost_curve_cost)
      * (COMPONENT_capital_cost_curve_nom - shift(COMPONENT_capital_cost_curve_nom, along=breakpoint, offset=1, edge=0))
  COMPONENT_capital_cost_as_lp:
    description: >-
      true where every `capital_cost` curve of the component is convex: then
      the curves are stated as segment lines, else by incremental segments
    condition: >-
      count(COMPONENT_capital_cost_curve AND
      count(COMPONENT_capital_cost_curve_bends_down, over=breakpoint) > 0, over=DIM)
      == 0

piecewise:
  COMPONENT_capital_cost_lp:
    name: COMPONENT-capital_cost_piecewise
    description: the build cost is at least the `capital_cost` curve at the build, by segment lines
    along: breakpoint
    dims: [DIM]
    where: COMPONENT_capital_cost_as_lp AND COMPONENT_capital_cost_curve AND COMPONENT_capital_cost_curve_nom
    method: lp
    links:
      NOM: ["COMPONENT_NOM_ext", "COMPONENT_capital_cost_curve_nom"]
      cost: ["COMPONENT_capital_cost_piecewise", "COMPONENT_capital_cost_curve_cost", ">="]
  COMPONENT_capital_cost_incremental:
    name: COMPONENT-capital_cost_piecewise
    description: the build cost is at least the `capital_cost` curve at the build, by segments filled in order
    along: breakpoint
    dims: [DIM]
    where: NOT COMPONENT_capital_cost_as_lp AND COMPONENT_capital_cost_curve AND COMPONENT_capital_cost_curve_nom
    method: incremental
    links:
      NOM: ["COMPONENT_NOM_ext", "COMPONENT_capital_cost_curve_nom"]
      cost: ["COMPONENT_capital_cost_piecewise", "COMPONENT_capital_cost_curve_cost", ">="]

constraints:
  COMPONENT_ext_NOM_lower:
    name: COMPONENT-ext-NOM-lower
    description: the chosen build is at least the floor
    dims: [scenario, DIM]
    where: COMPONENT_NOM_extendable AND COMPONENT_active_asset
    expression: COMPONENT_NOM_ext >= COMPONENT_NOM_min
  COMPONENT_ext_NOM_upper:
    name: COMPONENT-ext-NOM-upper
    description: the chosen build is at most the cap; an infinite cap means no row
    dims: [scenario, DIM]
    where: COMPONENT_NOM_extendable AND COMPONENT_active_asset AND COMPONENT_NOM_max
    expression: COMPONENT_NOM_ext <= COMPONENT_NOM_max
  COMPONENT_NOM_set:
    name: COMPONENT-NOM_set
    description: the chosen build equals the given one
    dims: [scenario, DIM]
    where: COMPONENT_NOM_extendable AND COMPONENT_active_asset AND COMPONENT_NOM_set
    expression: COMPONENT_NOM_ext == COMPONENT_NOM_set
  COMPONENT_NOM_modularity:
    name: COMPONENT-NOM_modularity
    description: the chosen build is a whole number of modules
    dims: [DIM]
    where: COMPONENT_NOM_extendable AND COMPONENT_NOM_mod > 0 AND COMPONENT_active_asset
    expression: COMPONENT_NOM_ext == COMPONENT_NOM_mod * COMPONENT_n_mod

assumptions:
  COMPONENT_capital_cost_curve_without_overnight_cost:
    holds: NOT COMPONENT_overnight_cost
    where: COMPONENT_capital_cost_curve
    description: an asset with a `capital_cost` curve has no `overnight_cost`, as the curve is already periodized
