parameters:
  Process_p_nom:
    description: nominal internal power
    dims: [scenario, process]
  Process_p_nom_extendable:
    description: whether the nominal internal power is a decision
    dims: [process]
    dtype: bool
  Process_p_min_pu:
    description: "least internal power, per unit of nominal power: negative for a process that runs both ways"
    dims: [scenario, snapshot, process]
  Process_p_max_pu:
    description: most internal power, per unit of nominal power
    dims: [scenario, snapshot, process]
  Process_rate:
    description: >-
      the energy a port draws or delivers per unit of internal power (PyPSA's
      `rate0`, `rate1`, … read long). It is negative where the port withdraws
      and positive where it injects. A link is a process whose `bus0` rate is
      minus one and whose output rates are its efficiencies. The rate at the
      snapshot the transfer arrives applies, so a delayed port transfers at
      its arrival snapshot's rate (`constraints.py:1575`)
    dims: [scenario, snapshot, process_output]
  Process_rate_curve_p:
    description: >-
      the internal power at each breakpoint of the piecewise `rate` curve of a
      port: PyPSA's `p_pu` breakpoints of `rate0`, `rate1`, … read long, times
      the process's `p_nom`, data prep. A port with no curve has no rows
    dims: [process_output, breakpoint]
    missing: absent
  Process_rate_curve_transfer:
    description: >-
      what a port transfers at each breakpoint of its piecewise
      `rate` curve: the internal power times the `rate` there, and zero where
      that product is undefined, data prep (`piecewise.py:314-316`). PyPSA
      refuses a curve of both signs (`io.py:2319-2324`)
    dims: [process_output, breakpoint]
    missing: absent
  Process_output_delay:
    description: >-
      time a port's transfer lags its process's internal power, in units of
      `snapshot_weightings.generators` (PyPSA's `delay0`, `delay1`, … read
      long). It is zero for a port that transfers at once. A port has the
      same delay in every scenario, as a link's port has
    dims: [process_output]
    dtype: int
  Process_marginal_cost:
    description: cost of one unit of internal power
    dims: [scenario, snapshot, process]
  Process_marginal_cost_quadratic:
    description: cost of the square of one unit of internal power
    dims: [scenario, snapshot, process]
  Process_marginal_cost_curve_p:
    description: >-
      the internal power at each breakpoint of a process's piecewise
      `marginal_cost` curve: PyPSA's `p_pu` breakpoints times `p_nom`, data
      prep. A process with no curve has no rows
    dims: [process, breakpoint]
    missing: absent
  Process_marginal_cost_curve_cost:
    description: >-
      the running cost at each breakpoint of a process's piecewise
      `marginal_cost` curve: zero at the first, then each segment's width in
      internal power times the `marginal_cost` at its upper breakpoint,
      summed, data prep. It is linopy's `Slopes(...).to_breakpoints`
      (`piecewise.py:310-312`)
    dims: [process, breakpoint]
    missing: absent
  Process_ramp_limit_up:
    description: most a process may raise its internal power between snapshots, per unit of nominal power. No value means no limit. The value at the later of the two snapshots applies, so the limit may change over time
    dims: [scenario, snapshot, process]
    missing: absent
  Process_ramp_limit_down:
    description: most a process may lower its internal power between snapshots, per unit of nominal power. No value means no limit. The value at the later of the two snapshots applies, so the limit may change over time
    dims: [scenario, snapshot, process]
    missing: absent
  Process_p_set:
    description: a given internal power schedule. A process without one has no row here
    dims: [scenario, snapshot, process]
    missing: absent
  Process_e_sum_min:
    description: least energy of its internal power over the horizon. It is minus infinity where no floor is meant
    dims: [scenario, process]
  Process_e_sum_max:
    description: most energy of its internal power over the horizon. It is infinity where no cap is meant
    dims: [scenario, process]
  Process_p_nom_min:
    description: least nominal power an extendable process may be built at
    dims: [scenario, process]
  Process_p_nom_max:
    description: most nominal power an extendable process may be built at
    dims: [scenario, process]
  Process_capital_cost:
    description: >-
      cost of one unit of nominal power for the modelled horizon (PyPSA's
      `periodized_cost`), data prep. It is `overnight_cost` as an annuity over
      `lifetime` at `discount_rate`, times `nyears`, where `overnight_cost` is
      given, and `capital_cost` where it is not. Both add `fom_cost`
      (`components.py:1157-1178`, `costs.py:102-203`)
    dims: [scenario, process]
  Process_capital_cost_curve_nom:
    description: >-
      the nominal internal power at each breakpoint of a process's piecewise
      `capital_cost` curve: PyPSA's `p_nom` breakpoints, data prep. A process
      with no curve has no rows
    dims: [process, breakpoint]
    missing: absent
  Process_capital_cost_curve_cost:
    description: >-
      the cost of the build at each breakpoint of a process's piecewise
      `capital_cost` curve: zero at the first, then each segment's width in
      nominal internal power times the `capital_cost` at its upper breakpoint,
      summed, data prep. It is linopy's `Slopes(...).to_breakpoints`
      (`piecewise.py:310-312`). The curve is already periodized, so data prep
      refuses `overnight_cost` beside it, as PyPSA does
      (`optimize.py:427-434`)
    dims: [process, breakpoint]
    missing: absent
  Process_p_nom_set:
    description: a given nominal power for an extendable process. One without a value has no row here
    dims: [scenario, process]
    missing: absent
  Process_committable:
    description: whether internal power is gated by an on/off status decision
    dims: [process]
    dtype: bool
  Process_ramp_limit_start_up:
    description: most internal power in the snapshot a process starts, per unit of nominal power. No value means no limit
    dims: [scenario, process]
    missing: absent
  Process_ramp_limit_shut_down:
    description: most internal power in the snapshot before a process stops, per unit of nominal power. No value means no limit
    dims: [scenario, process]
    missing: absent
  Process_min_up_time:
    description: least snapshots a process stays on once started
    dims: [scenario, process]
    dtype: int
  Process_min_down_time:
    description: least snapshots a process stays off once stopped
    dims: [scenario, process]
    dtype: int
  Process_status_initial:
    description: >-
      one where the process was on before the first snapshot, zero where off.
      It is PyPSA's `up_time_before > 0` for a committable process, and one for
      a process that is not, whose ramp rows PyPSA starts from on
      (`constraints.py:323`), data prep
    dims: [scenario, process]
  Process_p_init:
    description: >-
      the internal power a process brought into the horizon (PyPSA's
      `p_init`), read only where the process came in running. No value means
      it is unknown, and the process then has no ramp row at the first
      snapshot
    dims: [scenario, process]
    missing: 0
  Process_up_time_brought_in:
    description: >-
      one while the up time a process brought into the horizon is still
      running, zero after. It is PyPSA's start `up_time_before` snapshots
      before the first, counted while `min_up_time` has not passed since
      (`constraints.py:302-323`, `:677-678`), data prep
    dims: [scenario, snapshot, process]
  Process_down_time_brought_in:
    description: >-
      one while the down time a process brought into the horizon is still
      running, zero after. It is PyPSA's stop `down_time_before` snapshots
      before the first, counted while `min_down_time` has not passed since
      (`constraints.py:302-323`, `:677-678`), data prep
    dims: [scenario, snapshot, process]
  Process_big_m:
    description: >-
      the bound a committed extendable process's big-M rows release it by,
      data prep. It is the build cap `p_nom_max` times the highest `p_max_pu`,
      where the cap is finite and positive. Elsewhere it is
      `committable_big_m` times the highest `p_max_pu`
      (`components.py:1082-1152`). Without that keyword, it is ten times the
      largest of the peak total load and the component's largest finite
      `p_nom` and `p_nom_max`. Where there is none of them, it is 1e6. Below
      the internal power a solve wants, it caps that internal power
    dims: [scenario, process]
    missing: absent
  Process_active:
    description: whether a process is active in a snapshot's period. It is PyPSA's `active`, data prep
    dims: [snapshot, process]
    dtype: bool

relations:
  Process_carrier:
    description: the carrier a process converts from
    key: process
    values: carrier
  Process_output_process:
    description: the process a port belongs to
    key: process_output
    values: process
  Process_output_bus:
    description: >-
      the bus a port draws from or delivers to. It is PyPSA's `bus0`, `bus1`,
      … columns. A process of three ports is three labels here rather than a
      third relation, so the file states any number of them
    key: process_output
    values: bus
  Process_output_delay_source:
    description: >-
      the snapshot whose internal power a delayed port transfers at a
      snapshot, as for a link's port (PyPSA's `cyclic_delay0`,
      `cyclic_delay1`, … set the wrap)
    key: [process_output, snapshot]
    values: { source: snapshot }
    missing: absent

variables:
  Process_p:
    name: Process-p
    description: >-
      PyPSA's internal power `p`. A positive value drives every port at its own
      rate, withdrawing where the rate is negative and injecting where it is
      positive
    dims: [scenario, snapshot, process]
    where: Process_active
  Process_p_piecewise:
    name: Process-p{port}_piecewise
    description: >-
      what a process transfers at a port that follows a part-load `rate` curve,
      before the port's delay. PyPSA names one variable per port number
    dims: [scenario, snapshot, process_output]
    where: Process_rate_curve AND at(Process_active, by=Process_output_process[process])
  Process_status:
    name: Process-status
    description: >-
      how much of a committable process is on. It is an integer the rows below
      cap at one, or at the module count where the build is modular
    dims: [scenario, snapshot, process]
    where: Process_committed
    domain: integer
    bounds:
      lower: 0
  Process_start_up:
    name: Process-start_up
    description: how much of a committable process turns on this snapshot, capped as the status is
    dims: [scenario, snapshot, process]
    where: Process_committed
    domain: integer
    bounds:
      lower: 0
  Process_shut_down:
    name: Process-shut_down
    description: how much of a committable process turns off this snapshot, capped as the status is
    dims: [scenario, snapshot, process]
    where: Process_committed
    domain: integer
    bounds:
      lower: 0
  Process_p_nom_ext:
    name: Process-p_nom
    description: >-
      nominal internal power where it is a decision, for a process that is
      active. A fixed build is the parameter of the same PyPSA name
    dims: [process]
    where: Process_p_nom_extendable AND Process_active_asset

expressions:
  Process_ramp_up_rate:
    description: >-
      the ramp limit in a process's up row, PyPSA's `ramp_limit_up`. It is the
      full build where PyPSA has none, since a start-up ramp alone builds the
      row
    dims: [scenario, snapshot, process]
    cases:
      given: { when: Process_ramp_limit_up, expression: Process_ramp_limit_up }
    otherwise: 1
  Process_ramp_down_rate:
    description: >-
      the ramp limit in a process's down row, PyPSA's `ramp_limit_down`. It is
      the full build where PyPSA has none, since a shut-down ramp alone builds
      the row
    dims: [scenario, snapshot, process]
    cases:
      given: { when: Process_ramp_limit_down, expression: Process_ramp_limit_down }
    otherwise: 1
  Process_start_up_rate:
    description: >-
      the start-up ramp in a process's up row (PyPSA's `ramp_limit_start_up`),
      or the full build where it has none
    dims: [scenario, process]
    cases:
      given: { when: Process_ramp_limit_start_up, expression: Process_ramp_limit_start_up }
    otherwise: 1
  Process_shut_down_rate:
    description: >-
      the shut-down ramp in a process's down row (PyPSA's
      `ramp_limit_shut_down`), or the full build where it has none
    dims: [scenario, process]
    cases:
      given: { when: Process_ramp_limit_shut_down, expression: Process_ramp_limit_shut_down }
    otherwise: 1
  Process_modules:
    description: >-
      how many modules a committed process's status counts: the chosen number
      where the build is extendable and modular, and the modules installed
      otherwise (`constraints.py:656-661`)
    dims: [scenario, process]
    cases:
      chosen: { when: Process_p_nom_extendable AND Process_p_nom_mod > 0, expression: Process_n_mod }
    otherwise: Process_modules_installed
  Process_p_nom_committed:
    description: >-
      the build a committed process's ramp rows are taken against: one module
      where the build is modular, since its status counts modules, and the
      given build otherwise (`constraints.py:1131-1134`)
    dims: [scenario, process]
    cases:
      modular_build: { when: "Process_p_nom_mod > 0", expression: Process_p_nom_mod }
    otherwise: Process_p_nom
  Process_ramp_previous_status:
    description: >-
      the status a committed process's ramp rows carry into a snapshot. At the
      first snapshot, a fixed modular process that came in running has every
      module on, since the state it brought in is on or off
      (`constraints.py:1152-1157`). The transition and down-time rows count it as one module
      (PyPSA/PyPSA#2114). It is the state carried in otherwise
    dims: [scenario, snapshot, process]
    cases:
      opening_modules:
        when: "position(snapshot) == 0 AND NOT Process_p_nom_extendable AND Process_p_nom_mod > 0"
        expression: Process_status_initial * Process_modules_installed
    otherwise: Process_previous_status
  Process_ramp_up_allowance:
    description: >-
      how far a process may raise internal power between two snapshots. It is
      its ramp limit of the build while it stays on, plus its start-up ramp in
      the snapshot it turns on
    dims: [scenario, snapshot, process]
    cases:
      committed:
        when: Process_committable
        expression: >-
          Process_ramp_up_rate * Process_p_nom_committed * Process_ramp_previous_status
          + Process_start_up_rate * Process_p_nom_committed
          * (Process_status - Process_ramp_previous_status)
    otherwise: Process_ramp_up_rate * Process_p_nom_effective
  Process_ramp_down_allowance:
    description: >-
      how far a process may lower internal power between two snapshots. It is
      its ramp limit of the build while it stays on, plus its shut-down ramp
      in the snapshot it turns off
    dims: [scenario, snapshot, process]
    cases:
      committed:
        when: Process_committable
        expression: >-
          Process_ramp_down_rate * Process_p_nom_committed * Process_status
          + Process_shut_down_rate * Process_p_nom_committed
          * (Process_ramp_previous_status - Process_status)
    otherwise: Process_ramp_down_rate * Process_p_nom_effective
  Process_output_linear_arrival:
    description: >-
      what a process transfers at a port at a snapshot. It is its internal
      power at the port's delay source, multiplied by the port's rate at the
      snapshot the transfer arrives. A delayed port transfers nothing where it
      has no source. A port that does not delay (`delay` zero) transfers at
      once
    dims: [scenario, snapshot, process_output]
    cases:
      delayed:
        when: Process_output_delay > 0
        expression: at(at(Process_p, by=Process_output_process[process]), by=Process_output_delay_source[source]) * Process_rate
    otherwise: at(Process_p, by=Process_output_process[process]) * Process_rate
  Process_output_curve_arrival:
    description: >-
      what a process transfers at a port with a piecewise `rate` curve at a
      snapshot: the value read off the curve, delayed as the internal power
      of any other port is and not multiplied again
      (`constraints.py:1556-1576`)
    dims: [scenario, snapshot, process_output]
    cases:
      delayed:
        when: Process_output_delay > 0
        expression: at(Process_p_piecewise, by=Process_output_delay_source[source])
    otherwise: Process_p_piecewise
  Process_output_arrival:
    description: >-
      what a process transfers at a port at a snapshot: the value read off
      the port's piecewise `rate` curve where it has one, and its internal
      power times the port's `rate` otherwise
    dims: [scenario, snapshot, process_output]
    cases:
      curve: { when: Process_rate_curve, expression: Process_output_curve_arrival }
    otherwise: Process_output_linear_arrival
  Process_running_cost:
    description: >-
      what a process's internal power costs in a snapshot: the value read off
      its piecewise curve where it has one, and its linear `marginal_cost`
      otherwise. A curve replaces the linear cost, as PyPSA drops the unit
      from that term (`optimize.py:333-348`)
    dims: [scenario, snapshot, process]
    cases:
      curve: { when: Process_marginal_cost_curve, expression: Process_marginal_cost_piecewise }
    otherwise: Process_p * Process_marginal_cost
  Process_opex:
    expression: >-
      sum(sum((Process_running_cost * snapshot_weightings_objective) * at(period_weight_objective, by=snapshot_period[period]), over=process), over=snapshot)
      + sum(sum((((Process_p * Process_p) * Process_marginal_cost_quadratic) * snapshot_weightings_objective) * at(period_weight_objective, by=snapshot_period[period]), over=process), over=snapshot)
  Process_injection:
    expression: >-
      sum(Process_output_arrival, over=process_output, by=Process_output_bus[bus])

conditions:
  Process_marginal_cost_curve_bends_down:
    description: >-
      a breakpoint where a process's cost curve gets less steep: the segment
      after it rises less per unit of internal power than the one before
    condition: >-
      Process_marginal_cost_curve_p
      AND shift(Process_marginal_cost_curve_p, along=breakpoint, offset=1)
      AND shift(Process_marginal_cost_curve_p, along=breakpoint, offset=-1)
      AND (Process_marginal_cost_curve_cost - shift(Process_marginal_cost_curve_cost, along=breakpoint, offset=1, edge=0))
      * (shift(Process_marginal_cost_curve_p, along=breakpoint, offset=-1, edge=0) - Process_marginal_cost_curve_p)
      > (shift(Process_marginal_cost_curve_cost, along=breakpoint, offset=-1, edge=0) - Process_marginal_cost_curve_cost)
      * (Process_marginal_cost_curve_p - shift(Process_marginal_cost_curve_p, along=breakpoint, offset=1, edge=0))
  Process_marginal_cost_as_lp:
    description: >-
      linopy's choice of method for all process cost curves at once
      (`method="auto"`): the segment lines where every curve is convex and no
      process with a curve is committable, the incremental rows otherwise.
      PyPSA gates the curves by `Process-status` where one is committable, and
      linopy states no segment lines under a gate (`optimize.py:314-318`,
      `piecewise.py:200-224`)
    condition: >-
      count(Process_marginal_cost_curve AND count(Process_marginal_cost_curve_bends_down, over=breakpoint) > 0, over=process) == 0
      AND count(Process_marginal_cost_curve AND Process_committable, over=process) == 0
  Process_capital_cost_curve_bends_down:
    description: >-
      a breakpoint where a process's build cost curve gets less steep: the
      segment after it rises less per unit of nominal internal power than the
      one before
    condition: >-
      Process_capital_cost_curve_nom
      AND shift(Process_capital_cost_curve_nom, along=breakpoint, offset=1)
      AND shift(Process_capital_cost_curve_nom, along=breakpoint, offset=-1)
      AND (Process_capital_cost_curve_cost - shift(Process_capital_cost_curve_cost, along=breakpoint, offset=1, edge=0))
      * (shift(Process_capital_cost_curve_nom, along=breakpoint, offset=-1, edge=0) - Process_capital_cost_curve_nom)
      > (shift(Process_capital_cost_curve_cost, along=breakpoint, offset=-1, edge=0) - Process_capital_cost_curve_cost)
      * (Process_capital_cost_curve_nom - shift(Process_capital_cost_curve_nom, along=breakpoint, offset=1, edge=0))
  Process_rate_curve:
    description: >-
      a port whose `rate` follows a piecewise curve over the process's
      internal power, in place of one value (`constraints.py:1530-1576`)
    condition: count(Process_rate_curve_p, over=breakpoint) > 0

piecewise:
  Process_marginal_cost_lp:
    name: Process-marginal_cost_piecewise
    description: >-
      the running cost of a process with a curve is at least the curve at its
      internal power, stated as the line of each segment, where linopy chooses
      the segment lines
    along: breakpoint
    dims: [scenario, snapshot, process]
    where: Process_marginal_cost_as_lp AND Process_marginal_cost_curve AND Process_active AND Process_marginal_cost_curve_p
    method: lp
    links:
      p: [Process_p, Process_marginal_cost_curve_p]
      cost: [Process_marginal_cost_piecewise, Process_marginal_cost_curve_cost, ">="]
  Process_marginal_cost_incremental:
    name: Process-marginal_cost_piecewise
    description: >-
      the running cost of a process with a curve is at least the curve at its
      internal power, stated by segments filled in order and switched by the
      status of a committable process, where linopy chooses the incremental rows
    along: breakpoint
    dims: [scenario, snapshot, process]
    where: NOT Process_marginal_cost_as_lp AND Process_marginal_cost_curve AND Process_active AND Process_marginal_cost_curve_p
    method: incremental
    activity: Process_status
    links:
      p: [Process_p, Process_marginal_cost_curve_p]
      cost: [Process_marginal_cost_piecewise, Process_marginal_cost_curve_cost, ">="]
  Process_capital_cost_lp:
    name: Process-capital_cost_piecewise
    description: >-
      the cost of the build of a process with a curve is at least the curve at
      its nominal internal power, stated as the line of each segment, where
      linopy chooses the segment lines
    along: breakpoint
    dims: [process]
    where: Process_capital_cost_as_lp AND Process_capital_cost_curve AND Process_capital_cost_curve_nom
    method: lp
    links:
      p_nom: [Process_p_nom_ext, Process_capital_cost_curve_nom]
      cost: [Process_capital_cost_piecewise, Process_capital_cost_curve_cost, ">="]
  Process_capital_cost_incremental:
    name: Process-capital_cost_piecewise
    description: >-
      the cost of the build of a process with a curve is at least the curve at
      its nominal internal power, stated by segments filled in order, where
      linopy chooses the incremental rows
    along: breakpoint
    dims: [process]
    where: NOT Process_capital_cost_as_lp AND Process_capital_cost_curve AND Process_capital_cost_curve_nom
    method: incremental
    links:
      p_nom: [Process_p_nom_ext, Process_capital_cost_curve_nom]
      cost: [Process_capital_cost_piecewise, Process_capital_cost_curve_cost, ">="]
  Process_rate_incremental:
    name: Process-p{port}_piecewise
    description: >-
      what a process transfers at a port with a curve is the curve at its
      internal power, stated by segments filled in order and switched by the
      status of a committable process. PyPSA leaves the method to linopy, which
      states an equality by the incremental rows (`constraints.py:1541-1553`)
    along: breakpoint
    dims: [scenario, snapshot, process_output]
    where: Process_rate_curve AND at(Process_active, by=Process_output_process[process]) AND Process_rate_curve_p
    method: incremental
    activity: at(Process_status, by=Process_output_process[process])
    links:
      p: ["at(Process_p, by=Process_output_process[process])", Process_rate_curve_p]
      transfer: [Process_p_piecewise, Process_rate_curve_transfer]

constraints:
  Process_e_sum_min:
    name: Process-e_sum_min
    description: >-
      energy of the internal power over the horizon, each period weighted by its
      years, is at least its floor. A floor of minus infinity is no row
    dims: [scenario, process]
    where: Process_e_sum_min AND count(Process_active, over=snapshot) > 0
    expression: sum(Process_p * energy_limit_weight, over=snapshot) >= Process_e_sum_min
  Process_e_sum_max:
    name: Process-e_sum_max
    description: >-
      energy of the internal power over the horizon, each period weighted by its
      years, is at most its budget. A budget of infinity is no row
    dims: [scenario, process]
    where: Process_e_sum_max AND count(Process_active, over=snapshot) > 0
    expression: sum(Process_p * energy_limit_weight, over=snapshot) <= Process_e_sum_max
  Process_fix_p_lower:
    name: Process-fix-p-lower
    description: a fixed process runs at least its minimum, negative for the other way
    dims: [scenario, snapshot, process]
    where: not Process_p_nom_extendable AND not Process_committable AND Process_active AND (Process_p_nom < inf OR Process_p_min_pu == 0)
    expression: Process_p >= Process_p_min_pu * Process_p_nom_rated * (1 - Process_maintenance_pu * Process_maintenance)
  Process_fix_p_upper:
    name: Process-fix-p-upper
    description: a fixed process runs at most its nominal power
    dims: [scenario, snapshot, process]
    where: not Process_p_nom_extendable AND not Process_committable AND Process_active AND (Process_p_nom < inf OR Process_p_max_pu == 0)
    expression: Process_p <= Process_p_max_pu * Process_p_nom_rated * (1 - Process_maintenance_pu * Process_maintenance)
  Process_ext_p_lower:
    name: Process-ext-p-lower
    description: >-
      an extendable process runs at least its minimum of the chosen build,
      negative for the other way
    dims: [scenario, snapshot, process]
    where: Process_p_nom_extendable AND not Process_committable AND Process_active
    expression: Process_p >= Process_p_min_pu * (Process_p_nom_ext - Process_maintenance_pu * Process_maintenance_capacity)
  Process_ext_p_upper:
    name: Process-ext-p-upper
    description: an extendable process runs at most the chosen build
    dims: [scenario, snapshot, process]
    where: Process_p_nom_extendable AND not Process_committable AND Process_active
    expression: Process_p <= Process_p_max_pu * (Process_p_nom_ext - Process_maintenance_pu * Process_maintenance_capacity)
  Process_com_p_lower:
    name: Process-com-p-lower
    description: a committed process runs at least its minimum. Off, it runs at least nothing
    dims: [scenario, snapshot, process]
    where: Process_committed AND NOT Process_p_nom_extendable AND NOT (Process_p_nom_mod > 0)
    expression: Process_p >= Process_p_min_pu * Process_p_nom * (Process_status - Process_maintenance_pu * Process_maintenance_status)
  Process_com_p_upper:
    name: Process-com-p-upper
    description: a committed process runs at most what is available. Off, it runs at most nothing
    dims: [scenario, snapshot, process]
    where: Process_committed AND NOT Process_p_nom_extendable AND NOT (Process_p_nom_mod > 0)
    expression: Process_p <= Process_p_max_pu * Process_p_nom * (Process_status - Process_maintenance_pu * Process_maintenance_status)
  Process_com_transition_start_up:
    name: Process-com-transition-start-up
    description: >-
      turning on is a start, counted against the state the process carried into
      the snapshot
    dims: [scenario, snapshot, process]
    where: Process_committed
    expression: Process_start_up >= Process_status - Process_previous_status
  Process_com_transition_shut_down:
    name: Process-com-transition-shut-down
    description: >-
      turning off is a stop, counted against the state the process carried into
      the snapshot
    dims: [scenario, snapshot, process]
    where: Process_committed
    expression: Process_shut_down >= Process_previous_status - Process_status
  Process_com_up_time:
    name: Process-com-up-time
    description: >-
      a process started within its own minimum up time is still on. The up time
      it brought into the horizon counts as a start before the first snapshot
    dims: [scenario, snapshot, process]
    where: Process_committed AND Process_min_up_time > 0
    expression: >-
      sum_back(Process_start_up, along=snapshot, window=Process_min_up_time)
      + Process_up_time_brought_in <= Process_status
  Process_com_down_time:
    name: Process-com-down-time
    description: >-
      a process stopped within its own minimum down time is still off, and so
      are the modules of a modular process that stopped. The down time it
      brought into the horizon counts as one stop before the first snapshot,
      also where the process is modular and all its modules stopped
      (`constraints.py:656-683`, PyPSA/PyPSA#2114)
    dims: [scenario, snapshot, process]
    where: Process_committed AND Process_min_down_time > 0
    expression: >-
      sum_back(Process_shut_down, along=snapshot, window=Process_min_down_time)
      + Process_down_time_brought_in <= Process_modules - Process_status
  Process_p_ramp_limit_up_run_big_m:
    name: Process-p-ramp_limit_up-run-bigM
    description: >-
      a committed extendable process raises internal power no faster than its
      limit of the chosen build. The big M releases the row in the snapshot it
      turns on
    dims: [scenario, snapshot, process]
    where: Process_com_ext AND (Process_ramp_limit_up OR Process_ramp_limit_start_up) AND Process_ramps_from_previous
    expression: >-
      Process_p - Process_previous_p <=
      Process_ramp_up_rate * Process_p_nom_ext
      + Process_big_m - Process_big_m * Process_previous_status
  Process_p_ramp_limit_up_start_big_m:
    name: Process-p-ramp_limit_up-start-bigM
    description: >-
      in the snapshot it turns on, a committed extendable process ramps no
      further than its start-up ramp of the chosen build. The big M releases the
      row everywhere else
    dims: [scenario, snapshot, process]
    where: Process_com_ext AND (Process_ramp_limit_up OR Process_ramp_limit_start_up) AND Process_ramps_from_previous
    expression: >-
      Process_p - Process_previous_p <=
      Process_start_up_rate * Process_p_nom_ext
      + Process_big_m - Process_big_m * Process_start_up
  Process_p_ramp_limit_down_run_big_m:
    name: Process-p-ramp_limit_down-run-bigM
    description: >-
      a committed extendable process lowers internal power no faster than its
      limit of the chosen build. The big M releases the row in the snapshot it
      turns off
    dims: [scenario, snapshot, process]
    where: >-
      Process_com_ext
      AND (Process_ramp_limit_down OR Process_ramp_limit_shut_down)
      AND Process_ramps_from_previous
    expression: >-
      Process_p - Process_previous_p >=
      -Process_ramp_down_rate * Process_p_nom_ext
      - Process_big_m + Process_big_m * Process_status
  Process_p_ramp_limit_down_shut_big_m:
    name: Process-p-ramp_limit_down-shut-bigM
    description: >-
      in the snapshot it turns off, a committed extendable process ramps no
      further than its shut-down ramp of the chosen build. The big M releases
      the row everywhere else
    dims: [scenario, snapshot, process]
    where: >-
      Process_com_ext
      AND (Process_ramp_limit_down OR Process_ramp_limit_shut_down)
      AND Process_ramps_from_previous
    expression: >-
      Process_previous_p - Process_p <=
      Process_shut_down_rate * Process_p_nom_ext
      + Process_big_m - Process_big_m * Process_shut_down
  Process_com_ext_p_upper_cap:
    name: Process-com-ext-p-upper-cap
    description: >-
      a committed extendable process runs at most what is available of the
      chosen build, whatever its status
    dims: [scenario, snapshot, process]
    where: Process_com_ext
    expression: Process_p <= Process_p_max_pu * (Process_p_nom_ext - Process_maintenance_pu * Process_maintenance_capacity)
  Process_com_ext_p_upper_big_m:
    name: Process-com-ext-p-upper-bigM
    description: off, a process does not run. On, the big M is no bound
    dims: [scenario, snapshot, process]
    where: Process_com_ext
    expression: Process_p <= Process_big_m * Process_status
  Process_com_ext_p_lower:
    name: Process-com-ext-p-lower
    description: >-
      a committed extendable process runs at least its minimum of the chosen
      build. Off, the big M releases the row
    dims: [scenario, snapshot, process]
    where: Process_com_ext
    expression: >-
      Process_p >=
      Process_p_min_pu * (Process_p_nom_ext - Process_maintenance_pu * Process_maintenance_capacity)
      + Process_big_m * Process_status - Process_big_m
  Process_com_ext_p_lower_nonneg:
    name: Process-com-ext-p-lower-nonneg
    description: >-
      where no minimum-per-unit is negative, internal power is also plainly
      non-negative, a row the big-M lower cannot assert while the process is off
    dims: [scenario, snapshot, process]
    where: Process_com_ext AND Process_p_min_pu_nonneg
    expression: Process_p >= 0
  Process_com_mod_p_lower:
    name: Process-com-mod-p-lower
    description: >-
      a committed modular process runs at least its minimum of one module,
      whether the build is fixed or a decision
    dims: [scenario, snapshot, process]
    where: Process_committed AND Process_p_nom_mod > 0
    expression: Process_p >= Process_p_min_pu * Process_p_nom_mod * (Process_status - Process_maintenance_pu * Process_maintenance_status)
  Process_com_mod_p_upper:
    name: Process-com-mod-p-upper
    description: >-
      a committed modular process runs at most one module's share, whether the
      build is fixed or a decision
    dims: [scenario, snapshot, process]
    where: Process_committed AND Process_p_nom_mod > 0
    expression: Process_p <= Process_p_max_pu * Process_p_nom_mod * (Process_status - Process_maintenance_pu * Process_maintenance_status)
  Process_status_p_nom_variable_upper:
    name: Process-status-p_nom-variable-upper
    description: a modular process is on only where a module is built
    dims: [scenario, snapshot, process]
    where: Process_committed AND Process_p_nom_extendable AND Process_p_nom_mod > 0
    expression: Process_status <= Process_n_mod
  Process_start_up_p_nom_variable_upper:
    name: Process-start_up-p_nom-variable-upper
    description: a modular process starts only where a module is built
    dims: [scenario, snapshot, process]
    where: Process_committed AND Process_p_nom_extendable AND Process_p_nom_mod > 0
    expression: Process_start_up <= Process_n_mod
  Process_shut_down_p_nom_variable_upper:
    name: Process-shut_down-p_nom-variable-upper
    description: a modular process stops only where a module is built
    dims: [scenario, snapshot, process]
    where: Process_committed AND Process_p_nom_extendable AND Process_p_nom_mod > 0
    expression: Process_shut_down <= Process_n_mod
  Process_p_ramp_limit_up:
    name: Process-p-ramp_limit_up
    description: >-
      a process raises internal power no faster than its ramp limit of the
      build. A committed one raises it no further than its start-up ramp in the
      snapshot it turns on. A process that came into the horizon running has a
      row at the first snapshot only where `p_init` gives the internal power it
      brought in. No process has one at the start of a later investment period,
      nor does any process a big M releases instead
    dims: [scenario, snapshot, process]
    where: >-
      (Process_ramp_limit_up OR Process_ramp_limit_start_up)
      AND NOT (Process_committable AND Process_p_nom_extendable AND NOT (Process_p_nom_mod > 0))
      AND Process_ramps_from_previous
      AND Process_active
    expression: Process_p - Process_previous_p <= Process_ramp_up_allowance
  Process_p_ramp_limit_down:
    name: Process-p-ramp_limit_down
    description: >-
      a process lowers internal power no faster than its ramp limit of the
      build. A committed one lowers it no further than its shut-down ramp in the
      snapshot it turns off. A process that came into the horizon running has a
      row at the first snapshot only where `p_init` gives the internal power it
      brought in. No process has one at the start of a later investment period,
      nor does any process a big M releases instead
    dims: [scenario, snapshot, process]
    where: >-
      (Process_ramp_limit_down OR Process_ramp_limit_shut_down)
      AND NOT (Process_committable AND Process_p_nom_extendable AND NOT (Process_p_nom_mod > 0))
      AND Process_ramps_from_previous
      AND Process_active
    expression: Process_previous_p - Process_p <= Process_ramp_down_allowance
  Process_p_set:
    name: Process-p_set
    description: internal power pinned to the given schedule, wherever one is given
    dims: [scenario, snapshot, process]
    where: Process_p_set AND Process_active
    expression: Process_p == Process_p_set

assumptions:
  Process_marginal_cost_curve_on_a_fixed_build:
    holds: "NOT Process_p_nom_extendable AND Process_p_nom > 0 AND Process_p_nom < inf"
    where: "Process_marginal_cost_curve"
    description: >-
      a process's cost curve is given per unit of a fixed, positive, finite
      `p_nom`, which scales it to internal power. PyPSA refuses an extendable
      unit and a zero, missing or infinite `p_nom` (`piecewise.py:284-304`),
      and takes a negative one, which the file does not state
