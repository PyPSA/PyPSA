parameters:
  Process_rate_curve_transfer:
    description: >-
      what a port delivers at each breakpoint of its `rate` curve: `p` times
      `rate`, and zero where that is undefined
    dims: [Process, port, breakpoint]
    missing: absent

piecewise:
  Process_rate_incremental:
    name: Process-p_piecewise
    description: >-
      what a port delivers equals its `rate` curve at `p`, by segments filled in
      order; the status gates the curve of a committable process
    along: breakpoint
    dims: [scenario, snapshot, Process, port]
    where: Process_rate_curve AND at(Process_active, by=Process_port_Process[owner]) AND Process_rate_curve_p
    method: incremental
    activity: at(Process_status, by=Process_port_Process[owner])
    links:
      p: ["at(Process_p, by=Process_port_Process[owner])", Process_rate_curve_p]
      transfer: [Process_p_piecewise, Process_rate_curve_transfer]
