given:
  expressions:
    Cycle_angle_sum: {dims: [scenario, snapshot, cycle]}
  parameters:
    deg2rad: {dims: []}

expressions:
  Line_angle_sum:
    expression: sum(Line_s * at(Line_cycle_weight, by=snapshot_period[period]), over=Line)
    adds_to: Cycle_angle_sum

constraints:
  Line_v_ang_lower:
    name: Line-v_ang-lower
    description: an AC line carries at least the flow of the most negative angle difference
    dims: [scenario, snapshot, Line]
    where: Line_v_ang_max AND Line_carrier == 'AC' AND Line_active
    expression: Line_s >= -Line_v_ang_max * deg2rad / Line_x_pu_eff
  Line_v_ang_upper:
    name: Line-v_ang-upper
    description: an AC line carries at most the flow of the largest angle difference
    dims: [scenario, snapshot, Line]
    where: Line_v_ang_max AND Line_carrier == 'AC' AND Line_active
    expression: Line_s <= Line_v_ang_max * deg2rad / Line_x_pu_eff
