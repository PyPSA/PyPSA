parameters:
  Load_p_set:
    description: demand
    dims: [scenario, snapshot, Load]
  Load_active:
    description: the attribute `active`; a load has no build year or lifetime
    dims: [Load]
    dtype: bool

expressions:
  Load_demand:
    description: demand times sign where the load is active, zero otherwise
    dims: [scenario, snapshot, Load]
    cases:
      active:
        when: Load_active
        expression: Load_sign * Load_p_set
    otherwise: 0
  Load_injection: sum(Load_demand, over=Load, by=Load_bus[bus])
