parameters:
  Store_e_min_pu:
    description: least energy stored, per unit of nominal capacity; negative for a store that may go short
    dims: [scenario, snapshot, store]
  Store_e_max_pu:
    description: most energy stored, per unit of nominal capacity
    dims: [scenario, snapshot, store]
  Store_e_set:
    description: a given energy schedule. No value means no row
    dims: [scenario, snapshot, store]
    missing: absent
  Store_max_hours:
    description: >-
      energy capacity in hours of discharge at the power rating `e_nom /
      max_hours`. No value means unbounded power
    dims: [scenario, store]
    missing: absent
  Store_marginal_cost_dispatch:
    description: cost of one unit of discharge, `p + p_store`
    dims: [scenario, snapshot, store]
  Store_marginal_cost_store:
    description: cost of one unit of charging, `p_store`
    dims: [scenario, snapshot, store]
  Store_split_dispatch:
    description: >-
      whether the store charges through `p_store`, apart from its net power
      `p`: true where an efficiency is not one, a cost applies to one direction
      only, or `cycles_max` is finite. Otherwise `p_store` is zero
    dims: [scenario, store]
    dtype: bool
  Store_cycles_max:
    description: most full cycles over the horizon, discharge over `e_nom`. No value means no row
    dims: [scenario, store]
    missing: absent

variables:
  Store_e:
    name: Store-e
    description: energy stored at the end of a snapshot
    dims: [scenario, snapshot, store]
    where: Store_active

expressions:
  Store_discharge_floor_pu:
    description: >-
      least discharge per unit of `e_nom`: zero for a store that splits its
      dispatch, the most charging as negative discharge otherwise
    dims: [scenario, snapshot, store]
    cases:
      split: { when: Store_split_dispatch, expression: 0 }
    otherwise: Store_p_min_pu / Store_max_hours
  Store_charge_cap_pu:
    description: most charging through `p_store` per unit of `e_nom`; zero for a store that does not split its dispatch
    dims: [scenario, snapshot, store]
    cases:
      split: { when: Store_split_dispatch, expression: -Store_p_min_pu / Store_max_hours }
    otherwise: 0
  Store_charge_opex:
    expression: >-
      Store_operating_cost((Store_p + Store_p_store) * Store_marginal_cost_dispatch)
      + Store_operating_cost(Store_p_store * Store_marginal_cost_store)
  Store_injection: sum(Store_sign * Store_p, over=store, by=Store_bus[bus])

constraints:
  Store_fix_e_lower:
    name: Store-fix-e-lower
    description: a fixed store holds at least its floor
    dims: [scenario, snapshot, store]
    where: not Store_e_nom_extendable AND Store_active AND (Store_e_nom < inf OR Store_e_min_pu == 0)
    expression: Store_e >= Store_e_min_pu * Store_e_nom_rated
  Store_fix_e_upper:
    name: Store-fix-e-upper
    description: a fixed store holds at most its nominal capacity
    dims: [scenario, snapshot, store]
    where: not Store_e_nom_extendable AND Store_active AND (Store_e_nom < inf OR Store_e_max_pu == 0)
    expression: Store_e <= Store_e_max_pu * Store_e_nom_rated
  Store_ext_e_lower:
    name: Store-ext-e-lower
    description: an extendable store holds at least its floor of the chosen build
    dims: [scenario, snapshot, store]
    where: Store_e_nom_extendable AND Store_active
    expression: Store_e >= Store_e_min_pu * Store_e_nom_ext
  Store_ext_e_upper:
    name: Store-ext-e-upper
    description: an extendable store holds at most the chosen build
    dims: [scenario, snapshot, store]
    where: Store_e_nom_extendable AND Store_active
    expression: Store_e <= Store_e_max_pu * Store_e_nom_ext
  Store_fix_p_lower:
    name: Store-fix-p-lower
    description: >-
      a fixed store discharges at least its floor. No row for a store that does
      not split its dispatch and has no `max_hours`
    dims: [scenario, snapshot, store]
    where: >-
      NOT Store_e_nom_extendable AND Store_active AND (Store_split_dispatch OR Store_max_hours)
      AND (Store_e_nom < inf OR Store_split_dispatch OR Store_p_min_pu == 0)
    expression: Store_p + Store_p_store >= Store_discharge_floor_pu * Store_e_nom_rated
  Store_fix_p_upper:
    name: Store-fix-p-upper
    description: a fixed store discharges at most its power rating. No row without `max_hours`
    dims: [scenario, snapshot, store]
    where: NOT Store_e_nom_extendable AND Store_active AND Store_max_hours AND (Store_e_nom < inf OR Store_p_max_pu == 0)
    expression: Store_p + Store_p_store <= Store_p_max_pu / Store_max_hours * Store_e_nom_rated
  Store_fix_p_store_upper:
    name: Store-fix-p_store-upper
    description: >-
      a fixed store charges through `p_store` at most its power rating where it
      splits its dispatch, not at all otherwise
    dims: [scenario, snapshot, store]
    where: >-
      NOT Store_e_nom_extendable AND Store_active AND (NOT Store_split_dispatch OR Store_max_hours)
      AND (Store_e_nom < inf OR NOT Store_split_dispatch OR Store_p_min_pu == 0)
    expression: Store_p_store <= Store_charge_cap_pu * Store_e_nom_rated
  Store_ext_p_lower:
    name: Store-ext-p-lower
    description: >-
      an extendable store discharges at least its floor of the chosen build. No
      row for a store that does not split its dispatch and has no `max_hours`
    dims: [scenario, snapshot, store]
    where: Store_e_nom_extendable AND Store_active AND (Store_split_dispatch OR Store_max_hours)
    expression: Store_p + Store_p_store >= Store_discharge_floor_pu * Store_e_nom_ext
  Store_ext_p_upper:
    name: Store-ext-p-upper
    description: an extendable store discharges at most its power rating of the chosen build. No row without `max_hours`
    dims: [scenario, snapshot, store]
    where: Store_e_nom_extendable AND Store_active AND Store_max_hours
    expression: Store_p + Store_p_store <= Store_p_max_pu / Store_max_hours * Store_e_nom_ext
  Store_ext_p_store_upper:
    name: Store-ext-p_store-upper
    description: >-
      an extendable store charges through `p_store` at most its power rating of
      the chosen build where it splits its dispatch, not at all otherwise
    dims: [scenario, snapshot, store]
    where: Store_e_nom_extendable AND Store_active AND (NOT Store_split_dispatch OR Store_max_hours)
    expression: Store_p_store <= Store_charge_cap_pu * Store_e_nom_ext
  Store_energy_balance:
    name: Store-energy_balance
    description: >-
      the energy stored is the energy carried in, less the discharge before its
      efficiency, plus the charge after its own, plus inflow less spill. `p` is
      the discharge less `p_store`
    dims: [scenario, snapshot, store]
    where: Store_active
    expression: >-
      Store_level_carried_in
      - Store_p * snapshot_weightings_stores / Store_efficiency_dispatch
      + (Store_efficiency_store - 1 / Store_efficiency_dispatch) * Store_p_store * snapshot_weightings_stores
      + (Store_inflow - Store_spill) * snapshot_weightings_stores
      == Store_e
  Store_cycles_max:
    name: Store-cycles_max
    description: the discharge over the horizon is at most `cycles_max` times the build
    dims: [scenario, store]
    where: Store_cycles_max AND Store_active_asset
    expression: sum((Store_p + Store_p_store) * snapshot_weightings_stores, over=snapshot) <= Store_cycles_max * Store_e_nom_effective
  Store_e_set:
    name: Store-e_set
    description: the energy stored follows the given schedule
    dims: [scenario, snapshot, store]
    where: Store_e_set AND Store_active
    expression: Store_e == Store_e_set
