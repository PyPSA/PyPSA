parameters:
  Link_efficiency_curve_delivery:
    description: >-
      what a port delivers at each breakpoint of its `efficiency` curve: `p`
      times `efficiency`, and zero where that is undefined
    dims: [Link, port, breakpoint]
    missing: absent

piecewise:
  Link_efficiency_incremental:
    name: Link-p_piecewise
    description: >-
      what a port delivers equals its `efficiency` curve at `p`, by segments
      filled in order; the status gates the curve of a committable link
    along: breakpoint
    dims: [scenario, snapshot, Link, port]
    where: Link_efficiency_curve AND at(Link_active, by=Link_port_Link[owner]) AND Link_efficiency_curve_p
    method: incremental
    activity: at(Link_status, by=Link_port_Link[owner])
    links:
      p: ["at(Link_p, by=Link_port_Link[owner])", Link_efficiency_curve_p]
      delivery: [Link_p_piecewise, Link_efficiency_curve_delivery]
