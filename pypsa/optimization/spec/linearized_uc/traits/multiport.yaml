piecewise:
  COMPONENT_COEF_incremental:
    description: no status gates the curve, as no unit with a curve is committable
    activity: null

assumptions:
  COMPONENT_COEF_curve_is_not_committable:
    holds: NOT at(COMPONENT_committable, by=COMPONENT_port_UNIT[owner])
    where: COMPONENT_COEF_curve
    description: a unit with a curve on a port is not committable, as a status gate needs integers
