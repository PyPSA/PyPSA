piecewise:
  Unit_COEF_incremental:
    description: no status gates the curve, as no unit with a curve is committable
    activity: null

assumptions:
  Unit_COEF_curve_is_not_committable:
    holds: "NOT at(Unit_committable, by=Unit_output_UNIT[UNIT])"
    where: "Unit_COEF_curve"
    description: a unit with a curve on a port is not committable, as a status gate needs integers
