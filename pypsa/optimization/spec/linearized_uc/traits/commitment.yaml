variables:
  COMPONENT_status:
    description: the share of a committable unit that is on
    domain: null
    bounds:
      upper: 1
  COMPONENT_start_up:
    description: the share that starts in this snapshot
    domain: null
    bounds:
      upper: 1
  COMPONENT_shut_down:
    description: the share that stops in this snapshot
    domain: null
    bounds:
      upper: 1

conditions:
  COMPONENT_tightened:
    description: >-
      an active committable unit with a fixed build whose start and stop cost
      the same in every snapshot and scenario
    condition: >-
      COMPONENT_fix AND COMPONENT_committable AND
      count(count(COMPONENT_start_up_cost != COMPONENT_shut_down_cost, over=snapshot) > 0,
      over=scenario) == 0
  COMPONENT_tightened_from_previous:
    description: a tightened unit at a snapshot that has a previous power
    condition: >-
      COMPONENT_tightened AND (position(snapshot) > 0 OR COMPONENT_status_initial == 0 OR
      COMPONENT_p_init)

piecewise:
  COMPONENT_marginal_cost_incremental:
    description: no status gates the curve, as no unit with a curve is committable
    activity: null

constraints:
  COMPONENT_com_p_current:
    name: COMPONENT-com-p-current
    description: the power fits the share on, the share starting only up to its start-up ramp
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_tightened
    expression: >-
      COMPONENT_p - COMPONENT_p_max_pu * COMPONENT_NOM * COMPONENT_status + (COMPONENT_p_max_pu *
      COMPONENT_NOM - COMPONENT_start_up_rate * COMPONENT_NOM) * COMPONENT_start_up <= 0
  COMPONENT_com_p_before:
    name: COMPONENT-com-p-before
    description: the previous power fits the share still on, the share stopping only up to its shut-down ramp
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_tightened_from_previous
    expression: >-
      COMPONENT_previous_p
      - COMPONENT_shut_down_rate * COMPONENT_NOM * COMPONENT_previous_status
      - (COMPONENT_p_max_pu * COMPONENT_NOM - COMPONENT_shut_down_rate * COMPONENT_NOM)
      * (COMPONENT_status - COMPONENT_start_up) <= 0
  COMPONENT_com_partly_start_up:
    name: COMPONENT-com-partly-start-up
    description: the rise in power is at most the ramp of the share on plus the start-up ramp of the share starting
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_tightened_from_previous
    expression: >-
      COMPONENT_p - COMPONENT_previous_p
      - (COMPONENT_p_min_pu * COMPONENT_NOM + COMPONENT_ramp_up_rate * COMPONENT_NOM) * COMPONENT_status
      + COMPONENT_p_min_pu * COMPONENT_NOM * COMPONENT_previous_status
      + (COMPONENT_p_min_pu * COMPONENT_NOM + COMPONENT_ramp_up_rate * COMPONENT_NOM
      - COMPONENT_start_up_rate * COMPONENT_NOM)
      * COMPONENT_start_up <= 0
  COMPONENT_com_partly_shut_down:
    name: COMPONENT-com-partly-shut-down
    description: the fall in power is bounded likewise, by the shut-down ramp
    dims: [scenario, snapshot, UNIT]
    where: COMPONENT_tightened_from_previous
    expression: >-
      COMPONENT_previous_p - COMPONENT_p
      - COMPONENT_shut_down_rate * COMPONENT_NOM * COMPONENT_previous_status
      + (COMPONENT_shut_down_rate * COMPONENT_NOM - COMPONENT_ramp_down_rate * COMPONENT_NOM) * COMPONENT_status
      - (COMPONENT_p_min_pu * COMPONENT_NOM + COMPONENT_ramp_down_rate * COMPONENT_NOM
      - COMPONENT_shut_down_rate * COMPONENT_NOM)
      * COMPONENT_start_up <= 0

assumptions:
  COMPONENT_marginal_cost_curve_is_not_committable:
    holds: NOT COMPONENT_committable
    where: COMPONENT_marginal_cost_curve
    description: a unit with a `marginal_cost` curve is not committable, as a status gate needs integers
  COMPONENT_committable_is_not_modular:
    holds: NOT COMPONENT_modular
    where: COMPONENT_committable AND count(COMPONENT_activity_mask, over=snapshot) > 0
    description: a committable unit is not modular, as the relaxation cannot share out modules
