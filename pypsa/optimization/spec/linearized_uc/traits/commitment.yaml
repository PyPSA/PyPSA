variables:
  Unit_status:
    description: the share of a committable unit that is on
    domain: null
    bounds:
      upper: 1
  Unit_start_up:
    description: the share that starts in this snapshot
    domain: null
    bounds:
      upper: 1
  Unit_shut_down:
    description: the share that stops in this snapshot
    domain: null
    bounds:
      upper: 1

conditions:
  Unit_tightened:
    description: >-
      an active committable unit with a fixed build whose start and stop cost
      the same in every snapshot and scenario
    condition: >-
      Unit_committable AND NOT Unit_NOM_extendable AND
      count(count(Unit_start_up_cost != Unit_shut_down_cost, over=snapshot) > 0,
      over=scenario) == 0 AND Unit_active
  Unit_tightened_from_previous:
    description: a tightened unit at a snapshot that has a previous power
    condition: >-
      Unit_tightened AND (position(snapshot) > 0 OR Unit_status_initial == 0 OR
      Unit_p_init)

piecewise:
  Unit_marginal_cost_incremental:
    description: no status gates the curve, as no unit with a curve is committable
    activity: null

constraints:
  Unit_com_p_current:
    name: Unit-com-p-current
    description: the power fits the share on, the share starting only up to its start-up ramp
    dims: [scenario, snapshot, UNIT]
    where: Unit_tightened
    expression: >-
      Unit_p - Unit_p_max_pu * Unit_NOM * Unit_status + (Unit_p_max_pu *
      Unit_NOM - Unit_start_up_rate * Unit_NOM) * Unit_start_up <= 0
  Unit_com_p_before:
    name: Unit-com-p-before
    description: the previous power fits the share still on, the share stopping only up to its shut-down ramp
    dims: [scenario, snapshot, UNIT]
    where: Unit_tightened_from_previous
    expression: >-
      Unit_previous_p
      - Unit_shut_down_rate * Unit_NOM * Unit_previous_status
      - (Unit_p_max_pu * Unit_NOM - Unit_shut_down_rate * Unit_NOM)
      * (Unit_status - Unit_start_up) <= 0
  Unit_com_partly_start_up:
    name: Unit-com-partly-start-up
    description: the rise in power is at most the ramp of the share on plus the start-up ramp of the share starting
    dims: [scenario, snapshot, UNIT]
    where: Unit_tightened_from_previous
    expression: >-
      Unit_p - Unit_previous_p
      - (Unit_p_min_pu * Unit_NOM + Unit_ramp_up_rate * Unit_NOM) * Unit_status
      + Unit_p_min_pu * Unit_NOM * Unit_previous_status
      + (Unit_p_min_pu * Unit_NOM + Unit_ramp_up_rate * Unit_NOM - Unit_start_up_rate * Unit_NOM)
      * Unit_start_up <= 0
  Unit_com_partly_shut_down:
    name: Unit-com-partly-shut-down
    description: the fall in power is bounded likewise, by the shut-down ramp
    dims: [scenario, snapshot, UNIT]
    where: Unit_tightened_from_previous
    expression: >-
      Unit_previous_p - Unit_p
      - Unit_shut_down_rate * Unit_NOM * Unit_previous_status
      + (Unit_shut_down_rate * Unit_NOM - Unit_ramp_down_rate * Unit_NOM) * Unit_status
      - (Unit_p_min_pu * Unit_NOM + Unit_ramp_down_rate * Unit_NOM - Unit_shut_down_rate * Unit_NOM)
      * Unit_start_up <= 0

assumptions:
  Unit_marginal_cost_curve_is_not_committable:
    holds: NOT Unit_committable
    where: Unit_marginal_cost_curve
    description: a unit with a `marginal_cost` curve is not committable, as a status gate needs integers
  Unit_committable_is_not_modular:
    holds: NOT (Unit_NOM_mod > 0)
    where: Unit_committable AND count(Unit_active, over=snapshot) > 0
    description: a committable unit is not modular, as the relaxation cannot share out modules
