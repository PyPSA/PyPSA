piecewise:
  Generator_efficiency_incremental:
    description: no status gates the curve, as no generator with a curve is committable
    activity: null

assumptions:
  Generator_efficiency_curve_is_not_committable:
    holds: "NOT Generator_committable"
    where: "Generator_efficiency_curve"
    description: a generator with an `efficiency` curve is not committable, as a status gate needs integers
