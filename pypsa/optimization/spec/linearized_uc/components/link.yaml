variables:
  Link_status:
    name: Link-status
    description: >-
      how much of a committable link is on, a share in [0, 1] rather than an
      integer: the relaxation the keyword solves (`variables.py:91-92`)
    domain: null
    bounds:
      upper: 1
  Link_start_up:
    name: Link-start_up
    description: >-
      how much of a committable link turns on this snapshot, a share in [0, 1]
      (`variables.py:142-143`)
    domain: null
    bounds:
      upper: 1
  Link_shut_down:
    name: Link-shut_down
    description: >-
      how much of a committable link turns off this snapshot, a share in [0, 1]
      (`variables.py:193-194`)
    domain: null
    bounds:
      upper: 1

piecewise:
  Link_marginal_cost_incremental:
    name: Link-marginal_cost_piecewise
    description: >-
      the running cost of a link with a curve is at least the curve at its flow,
      stated by segments filled in order, where linopy chooses the incremental
      rows. No status gates it, because no link with a curve is committable
      under the keyword
    activity: null
  Link_efficiency_incremental:
    name: Link-p{port}_piecewise
    description: >-
      what a link delivers to an output port with a curve is the curve at its
      flow, stated by segments filled in order. No status gates it, because no
      link with a curve is committable under the keyword
    activity: null

constraints:
  Link_com_p_before:
    name: Link-com-p-before
    description: >-
      the output a link had entering this snapshot fits the share of it still on
      (`constraints.py:729-742`). The share it is shutting down counts only at
      the shut-down ramp. At the first snapshot, the link carries in the state
      and output it brought into the horizon, and has no row where it came in
      running without an initial output (`constraints.py:712-719`)
    dims: [scenario, snapshot, link]
    where: Link_committable AND NOT Link_p_nom_extendable AND count(count(Link_start_up_cost != Link_shut_down_cost, over=snapshot) > 0, over=scenario) == 0 AND Link_active AND (position(snapshot) > 0 OR Link_status_initial == 0 OR Link_p_init)
    expression: >-
      Link_previous_p
      - Link_shut_down_rate * Link_p_nom * Link_previous_status
      - (Link_p_max_pu * Link_p_nom - Link_shut_down_rate * Link_p_nom)
      * (Link_status - Link_start_up) <= 0
  Link_com_partly_start_up:
    name: Link-com-partly-start-up
    description: >-
      raising output while a share is starting up is bounded by two ramps
      (`constraints.py:759-774`). They are the ramp of the share on and the
      start-up ramp of the share coming on
    dims: [scenario, snapshot, link]
    where: Link_committable AND NOT Link_p_nom_extendable AND count(count(Link_start_up_cost != Link_shut_down_cost, over=snapshot) > 0, over=scenario) == 0 AND Link_active AND (position(snapshot) > 0 OR Link_status_initial == 0 OR Link_p_init)
    expression: >-
      Link_p - Link_previous_p
      - (Link_p_min_pu * Link_p_nom + Link_ramp_up_rate * Link_p_nom) * Link_status
      + Link_p_min_pu * Link_p_nom * Link_previous_status
      + (Link_p_min_pu * Link_p_nom + Link_ramp_up_rate * Link_p_nom - Link_start_up_rate * Link_p_nom)
      * Link_start_up <= 0
  Link_com_partly_shut_down:
    name: Link-com-partly-shut-down
    description: >-
      lowering output while a share is shutting down is bounded likewise, by the
      shut-down ramp (`constraints.py:776-791`)
    dims: [scenario, snapshot, link]
    where: Link_committable AND NOT Link_p_nom_extendable AND count(count(Link_start_up_cost != Link_shut_down_cost, over=snapshot) > 0, over=scenario) == 0 AND Link_active AND (position(snapshot) > 0 OR Link_status_initial == 0 OR Link_p_init)
    expression: >-
      Link_previous_p - Link_p
      - Link_shut_down_rate * Link_p_nom * Link_previous_status
      + (Link_shut_down_rate * Link_p_nom - Link_ramp_down_rate * Link_p_nom) * Link_status
      - (Link_p_min_pu * Link_p_nom + Link_ramp_down_rate * Link_p_nom - Link_shut_down_rate * Link_p_nom)
      * Link_start_up <= 0

assumptions:
  Link_efficiency_curve_is_not_committable:
    holds: "NOT at(Link_committable, by=Link_output_link[link])"
    where: "Link_efficiency_curve"
    description: >-
      a link with a piecewise `efficiency` curve on a port is not
      committable. PyPSA gates such a curve by the status share
      (`constraints.py:1536-1540`, `piecewise.py:200-210`), and a curve gate
      is binary or integer
