<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" width="1040" height="330" style="max-width: 100%; height: auto" role="img" aria-labelledby="build-modes-title" font-family="sans-serif" fill="currentColor">
<title id="build-modes-title">Feasible capacity and cost of an extendable asset for each build_mode</title>
<g>
<text x="210" y="24" text-anchor="middle" font-weight="bold" font-size="16">build_mode="continuous"</text>
<text x="210" y="46" text-anchor="middle" font-size="13">p_nom_min ≤ p_nom ≤ p_nom_max</text>
<text x="210" y="63" text-anchor="middle" font-size="13">cost = capital_cost · p_nom</text>
<path d="M70 93.6 V270 H350.8" fill="none" stroke="currentColor" stroke-width="1.5"/>
<path d="M66 99.6 L70 93.6 L74 99.6 M344.8 266 L350.8 270 L344.8 274" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="350.8" y="308" text-anchor="end" font-size="14">p_nom</text>
<text transform="translate(60 93.6) rotate(-90)" text-anchor="end" font-size="14">cost</text>
<line x1="70" y1="270.0" x2="343.0" y2="159.75" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="4 4"/>
<line x1="148" y1="238.5" x2="148" y2="270" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="2 3"/>
<line x1="304" y1="175.5" x2="304" y2="270" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="2 3"/>
<line x1="148" y1="270" x2="148" y2="275" stroke="currentColor" stroke-width="1.5"/>
<text x="148" y="290" text-anchor="middle" font-size="13">p_nom_min</text>
<line x1="304" y1="270" x2="304" y2="275" stroke="currentColor" stroke-width="1.5"/>
<text x="304" y="290" text-anchor="middle" font-size="13">p_nom_max</text>
<circle cx="70" cy="270.0" r="4.5" fill="none" stroke="#3b82f6" stroke-width="2"/>
<line x1="148" y1="238.5" x2="304" y2="175.5" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round"/>
<text x="343.0" y="151.75" text-anchor="end" font-size="12.5" fill-opacity="0.75">capital_cost · p_nom</text>
</g>
<g>
<text x="540" y="24" text-anchor="middle" font-weight="bold" font-size="16">build_mode="semi_continuous"</text>
<text x="540" y="46" text-anchor="middle" font-size="13">p_nom = 0, or p_nom_min ≤ p_nom ≤ p_nom_max</text>
<text x="540" y="63" text-anchor="middle" font-size="13">cost = 0, or build_cost + capital_cost · p_nom</text>
<path d="M400 93.6 V270 H680.8" fill="none" stroke="currentColor" stroke-width="1.5"/>
<path d="M396 99.6 L400 93.6 L404 99.6 M674.8 266 L680.8 270 L674.8 274" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="680.8" y="308" text-anchor="end" font-size="14">p_nom</text>
<text transform="translate(390 93.6) rotate(-90)" text-anchor="end" font-size="14">cost</text>
<line x1="400" y1="270.0" x2="673.0" y2="159.75" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="4 4"/>
<line x1="478" y1="196.5" x2="478" y2="270" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="2 3"/>
<line x1="634" y1="133.5" x2="634" y2="270" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="2 3"/>
<line x1="478" y1="270" x2="478" y2="275" stroke="currentColor" stroke-width="1.5"/>
<text x="478" y="290" text-anchor="middle" font-size="13">p_nom_min</text>
<line x1="634" y1="270" x2="634" y2="275" stroke="currentColor" stroke-width="1.5"/>
<text x="634" y="290" text-anchor="middle" font-size="13">p_nom_max</text>
<line x1="400" y1="228.0" x2="478" y2="196.5" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle cx="400" cy="228.0" r="4.5" fill="none" stroke="#3b82f6" stroke-width="2"/>
<path d="M473 238.5 H469 V196.5 H473" fill="none" stroke="#f08c00" stroke-width="2"/>
<text x="465" y="221.5" text-anchor="end" font-size="13" fill="#f08c00">build_cost</text>
<circle cx="400" cy="270.0" r="4.5" fill="#3b82f6"/>
<line x1="478" y1="196.5" x2="634" y2="133.5" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round"/>
</g>
<g>
<text x="870" y="24" text-anchor="middle" font-weight="bold" font-size="16">build_mode="modular"</text>
<text x="870" y="46" text-anchor="middle" font-size="13">p_nom = p_nom_mod · n_mod, integer n_mod</text>
<text x="870" y="63" text-anchor="middle" font-size="13">cost = (capital_cost · p_nom_mod + build_cost) · n_mod</text>
<path d="M730 93.6 V270 H1010.8" fill="none" stroke="currentColor" stroke-width="1.5"/>
<path d="M726 99.6 L730 93.6 L734 99.6 M1004.8 266 L1010.8 270 L1004.8 274" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="1010.8" y="308" text-anchor="end" font-size="14">p_nom</text>
<text transform="translate(720 93.6) rotate(-90)" text-anchor="end" font-size="14">cost</text>
<line x1="730" y1="270.0" x2="1003.0" y2="159.75" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="4 4"/>
<line x1="808" y1="217.5" x2="808" y2="270" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="2 3"/>
<line x1="886" y1="165.0" x2="886" y2="270" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="2 3"/>
<line x1="964" y1="112.5" x2="964" y2="270" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="2 3"/>
<line x1="808" y1="270" x2="808" y2="275" stroke="currentColor" stroke-width="1.5"/>
<text x="808" y="290" text-anchor="middle" font-size="13">p_nom_mod</text>
<line x1="886" y1="270" x2="886" y2="275" stroke="currentColor" stroke-width="1.5"/>
<text x="886" y="290" text-anchor="middle" font-size="13"></text>
<line x1="964" y1="270" x2="964" y2="275" stroke="currentColor" stroke-width="1.5"/>
<text x="964" y="290" text-anchor="middle" font-size="13">p_nom_max</text>
<path d="M803 238.5 H799 V217.5 H803" fill="none" stroke="#f08c00" stroke-width="2"/>
<text x="795" y="232.0" text-anchor="end" font-size="13" fill="#f08c00">build_cost</text>
<circle cx="730" cy="270.0" r="4.5" fill="#3b82f6"/>
<circle cx="808" cy="217.5" r="4.5" fill="#3b82f6"/>
<circle cx="886" cy="165.0" r="4.5" fill="#3b82f6"/>
<circle cx="964" cy="112.5" r="4.5" fill="#3b82f6"/>
</g>
</svg>
