name: Tests

on:
  push:
    branches:
    - master
    - release-branch-v*
  pull_request:
    branches: ["*"]
  schedule:
  - cron: "0 5 * * *"
  workflow_call:
  workflow_dispatch: # run the full matrix on demand from any branch

# Cancel any in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pixi-envs:
    name: List tested Python versions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: pixi.toml
        sparse-checkout-cone-mode: false

    - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
      with:
        pixi-version: v0.84.2
        run-install: false

    - name: Read test environments from pixi.toml
      id: envs
      run: |
        all=$(pixi info --json | jq -c '[.environments_info[].name | select(test("^test-py3[0-9]+$"))] | sort_by(ltrimstr("test-py3") | tonumber)')
        echo "all=$all" >> "$GITHUB_OUTPUT"
        echo "pr=$(jq -c '[first, last] | unique' <<< "$all")" >> "$GITHUB_OUTPUT"

    outputs:
      all: ${{ steps.envs.outputs.all }}
      pr: ${{ steps.envs.outputs.pr }}

  test:
    # Test package in matrix of OS and pixi test environments (one per Python version)
    name: Test package
    needs: [pixi-envs]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # lean matrix on PRs and master pushes (min+max Python, ubuntu only), full matrix for daily runs, releases and manual runs
        pixi-env: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && fromJSON(needs.pixi-envs.outputs.all) || fromJSON(needs.pixi-envs.outputs.pr) }}
        os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
        api: [default, future, sparse]
        exclude:
        - os: macos-latest
          api: future
        - os: windows-latest
          api: future
        - os: macos-latest
          api: sparse
        - os: windows-latest
          api: sparse

    env:
      PIXI_ENV: ${{ matrix.pixi-env }}
      MPLBACKEND: Agg # https://github.com/orgs/community/discussions/26434
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0   # Needed for setuptools_scm

    - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
      with:
        pixi-version: v0.84.2
        environments: ${{ env.PIXI_ENV }}
        locked: true
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}

    - name: Run unit tests (old API)
      if: matrix.api == 'default'
      run: pixi run -e "$PIXI_ENV" test-cov

    # Behaviour which becomes the default in 2.0, see pypsa.options.future
    - name: Run unit tests (future flags)
      if: matrix.api == 'future'
      env:
        PYPSA_FUTURE: "true"
      run: pixi run -e "$PIXI_ENV" test-cov

    - name: Run unit tests (sparse linopy backend)
      if: matrix.api == 'sparse'
      run: pixi run -e "$PIXI_ENV" test-cov --linopy-sparse

    - name: Upload code coverage report
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: >
          unit-tests,
          os-${{ matrix.os }},
          ${{ matrix.pixi-env }},
          api-${{ matrix.api }}

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: >
          unit-tests,
          os-${{ matrix.os }},
          ${{ matrix.pixi-env }},
          api-${{ matrix.api }}

  test-linopy-master:
    name: Test linopy master (${{ matrix.backend }})
    # Only on the full suite (daily schedule, manual dispatch, releases), not every PR/push
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [dense, sparse]
    env:
      PIXI_ENV: test-linopy-master
      MPLBACKEND: Agg # https://github.com/orgs/community/discussions/26434
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0   # Needed for setuptools_scm

    - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
      with:
        pixi-version: v0.84.2
        environments: ${{ env.PIXI_ENV }}
        run-install: false

    - name: Resolve latest dependencies
      run: |
        pixi workspace exclude-newer unset
        pixi update -e "$PIXI_ENV"

    - name: Report linopy provenance
      run: |
        pixi run -e "$PIXI_ENV" python -c "import linopy; print('linopy', linopy.__version__, 'from', linopy.__file__)"

    - name: Run unit tests
      run: pixi run -e "$PIXI_ENV" pytest -n logical ${{ matrix.backend == 'sparse' && '--linopy-sparse' || '' }}

  test-plots:
    # Run the matplotlib image-comparison tests once, on a single instance.
    # Baselines are generated on Linux; see test/test_statistics_plot.py.
    name: Test plots
    runs-on: ubuntu-latest
    env:
      PIXI_ENV: test
      MPLBACKEND: Agg # https://github.com/orgs/community/discussions/26434
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0   # Needed for setuptools_scm

    - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
      with:
        pixi-version: v0.84.2
        environments: ${{ env.PIXI_ENV }}
        locked: true
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}

    - name: Run image comparison tests
      run: >
        pixi run -e "$PIXI_ENV" pytest --run-plot-tests -m mpl_image_compare
        --mpl --mpl-generate-summary=html --mpl-results-path=mpl-results

    - name: Upload artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: results-plotting
        path: |
          mpl-results
        retention-days: 14
        if-no-files-found: ignore

  doctests:
    name: Doctests
    runs-on: ubuntu-latest

    env:
      PIXI_ENV: test
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0   # Needed for setuptools_scm

    - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
      with:
        pixi-version: v0.84.2
        environments: ${{ env.PIXI_ENV }}
        locked: true
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}

    - name: Run doc tests
      run: >
        pixi run -e "$PIXI_ENV" pytest
        test/test_docs.py --test-docs
        --cov=pypsa --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

    - name: Upload code coverage report
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: >
          doc-tests,
          os-ubuntu-latest,
          python3.13,
          api-old-api

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: >
          doc-tests,
          os-ubuntu-latest,
          python3.13,
          api-old-api

  check-types:
    name: Check types
    runs-on: ubuntu-latest

    env:
      PIXI_ENV: default
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0   # Needed for setuptools_scm

    - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
      with:
        pixi-version: v0.84.2
        environments: ${{ env.PIXI_ENV }}
        locked: true
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}

    - name: Run type checker (mypy)
      run: pixi run -e "$PIXI_ENV" typecheck
