name: Test models

on:
  push:
    branches:
    - master
    - release-branch-v*
  pull_request:
    branches: ['*']
  schedule:
  - cron: "0 5 * * *"

env:
  PACKAGE_NAME: 'pypsa'
  SNAKEMAKE_STORAGE_CACHED_HTTP_CACHE: ""
  SNAKEMAKE_STORAGE_CACHED_HTTP_SKIP_REMOTE_CHECKS: "1"

# Cancel any in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-pypsa-eur:
    name: PyPSA-Eur
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
        - master
        # - latest

    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: filter
      with:
        filters: |
          src:
            - 'pypsa/**'
            - 'pyproject.toml'
            - '.github/workflows/test-models.yml'

    - name: Skip - no source changes
      if: steps.filter.outputs.src != 'true' && github.event_name != 'schedule'
      run: echo "Skipping tests because no source code changes detected"

    - name: Free up disk space
      if: steps.filter.outputs.src == 'true' || github.event_name == 'schedule'
      run: |
        echo "Initial disk space"
        df -h
        echo "Free up disk space"
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo docker builder prune -a --force
        echo "Final disk space"
        df -h

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: steps.filter.outputs.src == 'true' || github.event_name == 'schedule'
      with:
        repository: PyPSA/pypsa-eur
        ref: master

    - name: Check out latest release
      if: (steps.filter.outputs.src == 'true' || github.event_name == 'schedule') && matrix.version == 'latest'
      run: |
        git fetch --tags
        latest_tag=$(git describe --tags `git rev-list --tags --max-count=1`)
        git checkout $latest_tag

    - name: Setup Pixi
      if: steps.filter.outputs.src == 'true' || github.event_name == 'schedule'
      uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
      with:
        pixi-version: v0.68.1
        cache: true
        # Do not cache in branches
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

    - name: Setup cache keys
      if: steps.filter.outputs.src == 'true' || github.event_name == 'schedule'
      run: |
        echo "WEEK=$(date +'%Y%U')" >> $GITHUB_ENV # data and cutouts

    # Only run check if package is not pinned
    - name: Check if inhouse package is pinned
      if: steps.filter.outputs.src == 'true' || github.event_name == 'schedule'
      run: |
        grep_line=$(grep -- '- pypsa' envs/environment.yaml)
        if [[ $grep_line == *"<"* || $grep_line == *"=="* ]]; then
            echo "pinned=true" >> $GITHUB_ENV
        else
            echo "pinned=false" >> $GITHUB_ENV
        fi

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: (steps.filter.outputs.src == 'true' || github.event_name == 'schedule') && env.pinned == 'false'
      with:
        path: |
          data
          cutouts
        key: data-cutouts-pypsa-eur-${{ env.WEEK }}

    - name: Restore git-tracked files in data/
      if: (steps.filter.outputs.src == 'true' || github.event_name == 'schedule') && env.pinned == 'false'
      run: git checkout HEAD -- data/

    - name: Install package from ref
      if: (steps.filter.outputs.src == 'true' || github.event_name == 'schedule') && env.pinned == 'false'
      run: |
        # Allow upgrading internal packages without exclude-newer cap
        sed -i '/^exclude-newer\s*=/d' pixi.toml
        pixi remove ${{ env.PACKAGE_NAME }}
        pixi upgrade linopy
        pixi add --pypi --git https://github.com/${{ github.repository }}.git ${{ github.event.repository.name }} --rev ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    - name: Run snakemake test workflows
      if: (steps.filter.outputs.src == 'true' || github.event_name == 'schedule') && env.pinned == 'false'
      run: |
        pixi run integration-tests

    - name: Run unit tests
      if: (steps.filter.outputs.src == 'true' || github.event_name == 'schedule') && env.pinned == 'false'
      run: |
        pixi run unit-tests

    - name: Upload artifacts
      if: (steps.filter.outputs.src == 'true' || github.event_name == 'schedule') && env.pinned == 'false'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: results-pypsa-eur-${{ matrix.version }}
        path: |
          logs
          .snakemake/log
          results
        retention-days: 3

    - name: Show remaining disk space
      if: always()
      run: df -h

