name: Run docs notebooks

on:
  schedule:
  - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: build-docs
  cancel-in-progress: true

permissions:
  contents: write   # to push docs-notebooks branch

jobs:
  execute-notebooks:
    name: Execute notebooks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
      with:
        pixi-version: v0.84.2
        environments: docs
        locked: true

    - name: Gurobi license
      run: printf '%s' "$GUROBI_LIC" > $HOME/gurobi.lic
      env:
        GUROBI_LIC: ${{ secrets.GUROBI_LIC }}

    - name: Execute notebooks
      run: |
        PYPSA_PARAMS__OPTIMIZE__SOLVER_NAME=gurobi \
          pixi run -e docs jupyter nbconvert --to notebook --execute --inplace \
          $(git ls-files 'docs/**/*.ipynb')

    - name: Publish to docs-notebooks branch
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git switch -C docs-notebooks
        git add -f $(git ls-files -c -o 'docs/**/*.ipynb')
        git commit -m "docs: execute notebooks [skip ci]"
        git push -f origin docs-notebooks
