name: Benchmarks

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-model:
    # Time `create_model` against master, see test/benchmarks/build_model.py
    name: Build benchmarks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0   # Needed for setuptools_scm

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"

    - name: Install package and dependencies
      run: |
        python -m pip install uv
        uv sync --all-extras --locked

    - name: Measure the pull request
      run: uv run python test/benchmarks/build_model.py measure result.json

    - name: Measure master
      run: |
        git worktree add --detach ../master origin/master
        PYTHONPATH="$PWD/../master" uv run python test/benchmarks/build_model.py measure reference.json

    - name: Compare
      run: >
        uv run python test/benchmarks/build_model.py compare reference.json result.json
        | tee -a "$GITHUB_STEP_SUMMARY"
