name: Vouch check

# Runs with the permissions of the base repository. Never check out or run
# code of the pull request here.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-pr:
    name: Check pull request author
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        sparse-checkout: .github
        persist-credentials: false

    - uses: mitchellh/vouch/action/check-pr@d66fa29a64600490892131ad87597c30c91fcac4 # v1.5.0
      with:
        pr-number: ${{ github.event.pull_request.number }}
        auto-close: true
        template-file: .github/vouch-pr-unvouched.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
