# dependabot
# Ref: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# ------------------------------------------------------------------------------
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  # actions are pinned to commit SHAs, so every release needs an explicit bump.
  # all of them land in the single monthly pull-request below.
  groups:
    # open a single pull-request for all GitHub actions updates
    github-actions:
      patterns:
      - '*'
- package-ecosystem: uv
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
  allow:
  - dependency-type: all
  # minor and patch updates land in one pull-request per kind (version or security).
  # major updates open individually.
  groups:
    uv:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    uv-security:
      applies-to: security-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
