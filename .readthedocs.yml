version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    pre_system_dependencies:
    - git fetch --unshallow   # Needed to get version tags
    create_environment:
    - asdf plugin add pixi
    - asdf install pixi 0.84.2
    - asdf global pixi 0.84.2
    install:
    - pixi install -e docs --locked
    pre_build:
    - printf '%b' "$GUROBI_LIC" | tr -d "'" > $HOME/gurobi.lic
      # To create all doctest files
    - PYPSA_PARAMS__OPTIMIZE__SOLVER_NAME=gurobi pixi run -e docs pytest test/test_docs.py --test-docs
      # Overlay pre-executed notebooks from the docs-notebooks branch (built daily by build-docs.yml)
    - git fetch origin docs-notebooks
    - git checkout FETCH_HEAD -- 'docs/*.ipynb'
    build:
      html:
      - pixi run -e docs mkdocs build --strict --site-dir $READTHEDOCS_OUTPUT/html

mkdocs:
  configuration: mkdocs.yml
